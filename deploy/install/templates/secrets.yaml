{{- /* Names, keys and namespaces are the tables of the install guides. */ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
{{- $release := .Release.Namespace }}

{{- /* Tokens the installer need not choose: generated once, then kept (see lore-install.value). */}}
{{- $ingestToken := include "lore-install.value" (dict "setting" "secrets.ingestToken" "provided" $s.ingestToken "namespace" "lore-api" "name" "lore-ingest-token" "key" "token" "generate" true "minLength" 32) }}
{{- $internalToken := include "lore-install.value" (dict "setting" "secrets.internalToken" "provided" $s.internalToken "namespace" "lore-api" "name" "lore-agent-internal-token" "key" "token" "generate" true "minLength" 32) }}
{{- $mcpAuthToken := include "lore-install.value" (dict "setting" "secrets.mcpAuthToken" "provided" $s.mcpAuthToken "namespace" "lore-api" "name" "lore-mcp-auth-token" "key" "token" "generate" true "minLength" 32) }}
{{- $webhookSecret := include "lore-install.value" (dict "setting" "secrets.webhookSecret" "provided" $s.webhookSecret "namespace" "lore-api" "name" "lore-webhook-secret" "key" "secret" "generate" true "minLength" 32) }}
{{- $floorServiceToken := include "lore-install.value" (dict "setting" "secrets.floor.serviceToken" "provided" $s.floor.serviceToken "namespace" "lore-api" "name" "floor-service-token" "key" "token" "generate" true "minLength" 32) }}
{{- $gitCredentialToken := include "lore-install.value" (dict "setting" "secrets.floor.gitCredentialToken" "provided" $s.floor.gitCredentialToken "namespace" "lore-api" "name" "floor-git-credential-token" "key" "token" "generate" true "minLength" 32) }}
{{- $visitTokenSecret := include "lore-install.value" (dict "setting" "secrets.floor.visitTokenSecret" "provided" $s.floor.visitTokenSecret "namespace" $release "name" "floor-api" "key" "visitTokenSecret" "generate" true "minLength" 32) }}

{{- if $s.ghcr.username }}
{{- $pull := dict ".dockerconfigjson" (include "lore-install.dockerconfigjson" (dict
      "username" $s.ghcr.username
      "token" (required "secrets.ghcr.token is required with secrets.ghcr.username" $s.ghcr.token))) }}
{{- range list "lore-api" "lore-ui" "lore-stations" }}
{{ include "lore-install.secret" (dict "namespace" . "name" "ghcr-pull-secret" "type" "kubernetes.io/dockerconfigjson" "data" $pull) }}
{{- end }}
{{- end }}

{{- /* The database Secrets are the lore-databases chart's unless the installer brings a database of their own. */}}
{{- $offline := not (lookup "v1" "Namespace" "" "kube-system") }}
{{- if $s.loreDbPassword }}
{{- $dbPassword := dict "password" $s.loreDbPassword }}
{{- range $namespace, $name := dict "lore-api" "lore-api-db-password" "lore-ui" "lore-db-password" "lore-stations" "lore-stations-db-password" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" $dbPassword) }}
{{- end }}
{{- else if not (or $offline (lookup "v1" "Secret" "lore-api" "lore-api-db-password")) }}
{{- fail "install lore-databases first (it creates the database Secrets), or set secrets.loreDbPassword for a database of your own" }}
{{- end }}
{{- if $s.floorDbConnectionString }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "floor-postgres" "data" (dict "connectionString" $s.floorDbConnectionString)) }}
{{- else if not (or $offline (lookup "v1" "Secret" $release "floor-postgres")) }}
{{- fail "install lore-databases first (it creates floor-postgres), or set secrets.floorDbConnectionString for a database of your own" }}
{{- end }}

{{- range list "lore-api" "lore-stations" }}
{{ include "lore-install.secret" (dict "namespace" . "name" "lore-ingest-token" "data" (dict "token" $ingestToken)) }}
{{ include "lore-install.secret" (dict "namespace" . "name" "lore-agent-internal-token" "data" (dict "token" $internalToken)) }}
{{ include "lore-install.secret" (dict "namespace" . "name" "floor-service-token" "data" (dict "token" $floorServiceToken)) }}
{{- end }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-mcp-auth-token" "data" (dict "token" $mcpAuthToken)) }}

{{- $githubApp := dict
      "app-id" (required "secrets.githubApp.appId is required" $s.githubApp.appId)
      "private-key" (required "secrets.githubApp.privateKey is required" $s.githubApp.privateKey)
      "installation-id" (required "secrets.githubApp.installationId is required" $s.githubApp.installationId) }}
{{- range $namespace, $name := dict "lore-api" "github-app-credentials" "lore-ui" "github-app-credentials" "lore-stations" "lore-stations-github-app" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" $githubApp) }}
{{- end }}

{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-webhook-secret" "data" (dict "secret" $webhookSecret)) }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-github-oauth" "data" (dict
      "client-id" (required "secrets.githubOAuth.clientId is required" $s.githubOAuth.clientId)
      "client-secret" (required "secrets.githubOAuth.clientSecret is required" $s.githubOAuth.clientSecret))) }}

{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "floor-git-credential-token" "data" (dict "token" $gitCredentialToken)) }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "floor-api" "data" (dict
      "serviceToken" $floorServiceToken
      "visitTokenSecret" $visitTokenSecret
      "gitCredentialToken" $gitCredentialToken)) }}

{{- if .Values.utopia.enabled }}
{{- $u := $s.utopia }}
{{- if $s.ghcr.username }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "ghcr-pull-secret" "type" "kubernetes.io/dockerconfigjson" "data" (dict ".dockerconfigjson" (include "lore-install.dockerconfigjson" (dict "username" $s.ghcr.username "token" $s.ghcr.token)))) }}
{{- end }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "utopia-db-credentials" "type" "kubernetes.io/basic-auth" "data" (dict
      "username" "utopia"
      "password" (include "lore-install.value" (dict "setting" "secrets.utopia.dbPassword" "provided" $u.dbPassword "namespace" $release "name" "utopia-db-credentials" "key" "password" "generate" true)))) }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "utopia-app-db-credentials" "type" "kubernetes.io/basic-auth" "data" (dict
      "username" "utopia_app"
      "password" (include "lore-install.value" (dict "setting" "secrets.utopia.appDbPassword" "provided" $u.appDbPassword "namespace" $release "name" "utopia-app-db-credentials" "key" "password" "generate" true)))) }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "utopia-app" "data" (dict
      "secret-key" (include "lore-install.value" (dict "setting" "secrets.utopia.secretKey" "provided" $u.secretKey "namespace" $release "name" "utopia-app" "key" "secret-key" "generate" true)))) }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "utopia-oauth" "data" (dict
      "client-id" (required "secrets.utopia.oauthClientId is required" $u.oauthClientId)
      "client-secret" (required "secrets.utopia.oauthClientSecret is required" $u.oauthClientSecret)
      "cookie-secret" (include "lore-install.value" (dict "setting" "secrets.utopia.cookieSecret" "provided" $u.cookieSecret "namespace" $release "name" "utopia-oauth" "key" "cookie-secret" "generate" true "length" 32)))) }}
{{- end }}

{{- with $s.anthropicApiKey }}
{{- range $namespace, $name := dict "lore-api" "lore-anthropic-key" "lore-stations" "lore-stations-anthropic-key" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" (dict "anthropic-api-key" $s.anthropicApiKey)) }}
{{- end }}
{{- end }}

{{- with $s.openaiApiKey }}
{{- range $namespace, $name := dict "lore-api" "lore-openai-key" "lore-stations" "lore-stations-openai-key" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" (dict "api-key" $s.openaiApiKey)) }}
{{- end }}
{{- end }}

{{- with $s.slack.botToken }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-slack-credentials" "data" (dict
      "signing-secret" $s.slack.signingSecret
      "bot-token" $s.slack.botToken)) }}
{{ include "lore-install.secret" (dict "namespace" "lore-stations" "name" "lore-stations-slack" "data" (dict "bot-token" $s.slack.botToken)) }}
{{- end }}
{{- end }}
