{{- /* Names, keys and namespaces are docs/INSTALL.md section 1.5. */ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}

{{- $pull := dict ".dockerconfigjson" (include "lore-install.dockerconfigjson" (dict
      "username" (required "secrets.ghcr.username is required" $s.ghcr.username)
      "token" (required "secrets.ghcr.token is required" $s.ghcr.token))) }}
{{- range list "lore-api" "lore-ui" "lore-stations" }}
{{ include "lore-install.secret" (dict "namespace" . "name" "ghcr-pull-secret" "type" "kubernetes.io/dockerconfigjson" "data" $pull) }}
{{- end }}

{{- $dbPassword := dict "password" (required "secrets.loreDbPassword is required" $s.loreDbPassword) }}
{{- range $namespace, $name := dict "lore-api" "lore-api-db-password" "lore-ui" "lore-db-password" "lore-stations" "lore-stations-db-password" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" $dbPassword) }}
{{- end }}

{{- $ingestToken := dict "token" (required "secrets.ingestToken is required" $s.ingestToken) }}
{{- $internalToken := dict "token" (required "secrets.internalToken is required" $s.internalToken) }}
{{- $floorServiceToken := required "secrets.floor.serviceToken is required" $s.floor.serviceToken }}
{{- range list "lore-api" "lore-stations" }}
{{ include "lore-install.secret" (dict "namespace" . "name" "lore-ingest-token" "data" $ingestToken) }}
{{ include "lore-install.secret" (dict "namespace" . "name" "lore-agent-internal-token" "data" $internalToken) }}
{{ include "lore-install.secret" (dict "namespace" . "name" "floor-service-token" "data" (dict "token" $floorServiceToken)) }}
{{- end }}

{{- $githubApp := dict
      "app-id" (required "secrets.githubApp.appId is required" $s.githubApp.appId)
      "private-key" (required "secrets.githubApp.privateKey is required" $s.githubApp.privateKey)
      "installation-id" (required "secrets.githubApp.installationId is required" $s.githubApp.installationId) }}
{{- range $namespace, $name := dict "lore-api" "github-app-credentials" "lore-ui" "github-app-credentials" "lore-stations" "lore-stations-github-app" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" $githubApp) }}
{{- end }}

{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-webhook-secret" "data" (dict
      "secret" (required "secrets.webhookSecret is required" $s.webhookSecret))) }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-github-oauth" "data" (dict
      "client-id" (required "secrets.githubOAuth.clientId is required" $s.githubOAuth.clientId)
      "client-secret" (required "secrets.githubOAuth.clientSecret is required" $s.githubOAuth.clientSecret))) }}

{{- $gitCredentialToken := required "secrets.floor.gitCredentialToken is required" $s.floor.gitCredentialToken }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "floor-git-credential-token" "data" (dict "token" $gitCredentialToken)) }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "floor-api" "data" (dict
      "serviceToken" $floorServiceToken
      "visitTokenSecret" (required "secrets.floor.visitTokenSecret is required" $s.floor.visitTokenSecret)
      "gitCredentialToken" $gitCredentialToken)) }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "floor-postgres" "data" (dict
      "connectionString" (required "secrets.floorDbConnectionString is required" $s.floorDbConnectionString))) }}

{{- if .Values.utopia.enabled }}
{{- $u := $s.utopia }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "ghcr-pull-secret" "type" "kubernetes.io/dockerconfigjson" "data" $pull) }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "utopia-db-credentials" "type" "kubernetes.io/basic-auth" "data" (dict
      "username" "utopia"
      "password" (required "secrets.utopia.dbPassword is required" $u.dbPassword))) }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "utopia-app-db-credentials" "type" "kubernetes.io/basic-auth" "data" (dict
      "username" "utopia_app"
      "password" (required "secrets.utopia.appDbPassword is required" $u.appDbPassword))) }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "utopia-app" "data" (dict
      "secret-key" (required "secrets.utopia.secretKey is required" $u.secretKey))) }}
{{ include "lore-install.secret" (dict "namespace" .Release.Namespace "name" "utopia-oauth" "data" (dict
      "client-id" (required "secrets.utopia.oauthClientId is required" $u.oauthClientId)
      "client-secret" (required "secrets.utopia.oauthClientSecret is required" $u.oauthClientSecret)
      "cookie-secret" (required "secrets.utopia.cookieSecret is required" $u.cookieSecret))) }}
{{- end }}

{{- with $s.anthropicApiKey }}
{{- range $namespace, $name := dict "lore-api" "lore-anthropic-key" "lore-stations" "lore-stations-anthropic-key" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" (dict "anthropic-api-key" $s.anthropicApiKey)) }}
{{- end }}
{{- end }}

{{- with $s.openaiApiKey }}
{{- range $namespace, $name := dict "lore-api" "lore-openai-key" "lore-stations" "lore-stations-openai-key" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" (dict "api-key" $s.openaiApiKey)) }}
{{- end }}
{{- end }}

{{- with $s.slack.botToken }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-slack-credentials" "data" (dict
      "signing-secret" $s.slack.signingSecret
      "bot-token" $s.slack.botToken)) }}
{{ include "lore-install.secret" (dict "namespace" "lore-stations" "name" "lore-stations-slack" "data" (dict "bot-token" $s.slack.botToken)) }}
{{- end }}
{{- end }}
