{{- /*
Names, keys and namespaces are the table in deploy/install/README.md.

Every group below follows one rule (lore-install.groupSecret): set its values and
this chart writes the Secret; leave them empty and the Secret is yours, made with
the name and keys of the table. A required group whose Secret is not there stops
the install, naming it, except when the cluster cannot be read (helm template).
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
{{- $release := .Release.Namespace }}
{{- $offline := include "lore-install.offline" . }}

{{- /* Tokens the installer need not choose: generated once, then kept (see lore-install.value). */}}
{{- $ingestToken := include "lore-install.value" (dict "setting" "secrets.ingestToken" "provided" $s.ingestToken "namespace" "lore-api" "name" "lore-ingest-token" "key" "token" "generate" true "minLength" 32) }}
{{- $internalToken := include "lore-install.value" (dict "setting" "secrets.internalToken" "provided" $s.internalToken "namespace" "lore-api" "name" "lore-agent-internal-token" "key" "token" "generate" true "minLength" 32) }}
{{- $mcpAuthToken := include "lore-install.value" (dict "setting" "secrets.mcpAuthToken" "provided" $s.mcpAuthToken "namespace" "lore-api" "name" "lore-mcp-auth-token" "key" "token" "generate" true "minLength" 32) }}
{{- $webhookSecret := include "lore-install.value" (dict "setting" "secrets.webhookSecret" "provided" $s.webhookSecret "namespace" "lore-api" "name" "lore-webhook-secret" "key" "secret" "generate" true "minLength" 32) }}
{{- $floorServiceToken := include "lore-install.value" (dict "setting" "secrets.floor.serviceToken" "provided" $s.floor.serviceToken "namespace" "lore-api" "name" "floor-service-token" "key" "token" "generate" true "minLength" 32) }}
{{- $gitCredentialToken := include "lore-install.value" (dict "setting" "secrets.floor.gitCredentialToken" "provided" $s.floor.gitCredentialToken "namespace" "lore-api" "name" "floor-git-credential-token" "key" "token" "generate" true "minLength" 32) }}
{{- $userTokenKey := include "lore-install.value" (dict "setting" "secrets.userTokenEncryptionKey" "provided" $s.userTokenEncryptionKey "namespace" "lore-api" "name" "lore-user-token-key" "key" "key" "generate" true "hex" true "minLength" 64) }}
{{- $visitTokenSecret := include "lore-install.value" (dict "setting" "secrets.floor.visitTokenSecret" "provided" $s.floor.visitTokenSecret "namespace" $release "name" "floor-api" "key" "visitTokenSecret" "generate" true "minLength" 32) }}

{{- if $s.ghcr.username }}
{{- $pull := dict ".dockerconfigjson" (include "lore-install.dockerconfigjson" (dict
      "username" $s.ghcr.username
      "token" (required "secrets.ghcr.token is required with secrets.ghcr.username" $s.ghcr.token))) }}
{{- range list "lore-api" "lore-ui" "lore-stations" }}
{{ include "lore-install.secret" (dict "namespace" . "name" "ghcr-pull-secret" "type" "kubernetes.io/dockerconfigjson" "data" $pull) }}
{{- end }}
{{- end }}

{{- /* Databases: the lore-databases chart's Secrets, unless the installer brings a database of their own. */}}
{{- range $namespace, $name := dict "lore-api" "lore-api-db-password" "lore-ui" "lore-db-password" "lore-stations" "lore-stations-db-password" }}
{{ include "lore-install.groupSecret" (dict "namespace" $namespace "name" $name "kind" "required" "offline" $offline
      "setting" "secrets.loreDbPassword for a database of your own (the lore-databases chart creates this Secret: install it first)"
      "inputs" (dict "password" $s.loreDbPassword) "data" (dict "password" $s.loreDbPassword)) }}
{{- end }}
{{ include "lore-install.groupSecret" (dict "namespace" $release "name" "floor-postgres" "kind" "required" "offline" $offline
      "setting" "secrets.floorDbConnectionString for a database of your own (the lore-databases chart creates this Secret: install it first)"
      "inputs" (dict "connectionString" $s.floorDbConnectionString) "data" (dict "connectionString" $s.floorDbConnectionString)) }}

{{- /* Tokens: a copy in each namespace that reads one. */}}
{{- range list "lore-api" "lore-stations" }}
{{ include "lore-install.groupSecret" (dict "namespace" . "name" "lore-ingest-token" "kind" "generated" "offline" $offline "setting" "secrets.ingestToken" "inputs" (dict "token" $s.ingestToken) "data" (dict "token" $ingestToken)) }}
{{ include "lore-install.groupSecret" (dict "namespace" . "name" "lore-agent-internal-token" "kind" "generated" "offline" $offline "setting" "secrets.internalToken" "inputs" (dict "token" $s.internalToken) "data" (dict "token" $internalToken)) }}
{{ include "lore-install.groupSecret" (dict "namespace" . "name" "floor-service-token" "kind" "generated" "offline" $offline "setting" "secrets.floor.serviceToken" "inputs" (dict "token" $s.floor.serviceToken) "data" (dict "token" $floorServiceToken)) }}
{{- end }}
{{ include "lore-install.groupSecret" (dict "namespace" "lore-api" "name" "lore-mcp-auth-token" "kind" "generated" "offline" $offline "setting" "secrets.mcpAuthToken" "inputs" (dict "token" $s.mcpAuthToken) "data" (dict "token" $mcpAuthToken)) }}
{{ include "lore-install.groupSecret" (dict "namespace" "lore-api" "name" "lore-webhook-secret" "kind" "generated" "offline" $offline "setting" "secrets.webhookSecret" "inputs" (dict "secret" $s.webhookSecret) "data" (dict "secret" $webhookSecret)) }}
{{ include "lore-install.groupSecret" (dict "namespace" "lore-api" "name" "floor-git-credential-token" "kind" "generated" "offline" $offline "setting" "secrets.floor.gitCredentialToken" "inputs" (dict "token" $s.floor.gitCredentialToken) "data" (dict "token" $gitCredentialToken)) }}
{{ include "lore-install.groupSecret" (dict "namespace" $release "name" "floor-api" "kind" "generated" "offline" $offline "setting" "secrets.floor.*"
      "inputs" (dict "serviceToken" $s.floor.serviceToken "visitTokenSecret" $s.floor.visitTokenSecret "gitCredentialToken" $s.floor.gitCredentialToken)
      "data" (dict "serviceToken" $floorServiceToken "visitTokenSecret" $visitTokenSecret "gitCredentialToken" $gitCredentialToken)) }}

{{- /* The GitHub App Lore acts as, and the OAuth App people sign in with: always the installer's. */}}
{{- $githubApp := dict "app-id" $s.githubApp.appId "private-key" $s.githubApp.privateKey "installation-id" $s.githubApp.installationId }}
{{- /* Only lore-api signs people in, so only its copy carries the App's own client (FR-379, FR-380). */}}
{{- $githubAppSignIn := $githubApp }}
{{- if or $s.githubApp.clientId $s.githubApp.clientSecret }}
{{- $githubAppSignIn = merge (dict "client-id" $s.githubApp.clientId "client-secret" $s.githubApp.clientSecret) (deepCopy $githubApp) }}
{{- end }}
{{ include "lore-install.groupSecret" (dict "namespace" "lore-api" "name" "github-app-credentials" "kind" "required" "offline" $offline "setting" "secrets.githubApp" "inputs" $githubAppSignIn "data" $githubAppSignIn) }}
{{- range $namespace, $name := dict "lore-stations" "lore-stations-github-app" }}
{{ include "lore-install.groupSecret" (dict "namespace" $namespace "name" $name "kind" "required" "offline" $offline "setting" "secrets.githubApp" "inputs" $githubApp "data" $githubApp) }}
{{- end }}
{{ include "lore-install.groupSecret" (dict "namespace" "lore-api" "name" "lore-user-token-key" "kind" "generated" "offline" $offline "setting" "secrets.userTokenEncryptionKey" "inputs" (dict "key" $s.userTokenEncryptionKey) "data" (dict "key" $userTokenKey)) }}
{{- $githubOAuth := dict "client-id" $s.githubOAuth.clientId "client-secret" $s.githubOAuth.clientSecret }}
{{ include "lore-install.groupSecret" (dict "namespace" "lore-api" "name" "lore-github-oauth" "kind" "required" "offline" $offline "setting" "secrets.githubOAuth" "inputs" $githubOAuth "data" $githubOAuth) }}

{{- if .Values.utopia.enabled }}
{{- $u := $s.utopia }}
{{- if $s.ghcr.username }}
{{ include "lore-install.secret" (dict "namespace" $release "name" "ghcr-pull-secret" "type" "kubernetes.io/dockerconfigjson" "data" (dict ".dockerconfigjson" (include "lore-install.dockerconfigjson" (dict "username" $s.ghcr.username "token" $s.ghcr.token)))) }}
{{- end }}
{{ include "lore-install.groupSecret" (dict "namespace" $release "name" "utopia-db-credentials" "type" "kubernetes.io/basic-auth" "kind" "generated" "offline" $offline "setting" "secrets.utopia.dbPassword" "inputs" (dict "password" $u.dbPassword) "data" (dict
      "username" "utopia"
      "password" (include "lore-install.value" (dict "setting" "secrets.utopia.dbPassword" "provided" $u.dbPassword "namespace" $release "name" "utopia-db-credentials" "key" "password" "generate" true)))) }}
{{ include "lore-install.groupSecret" (dict "namespace" $release "name" "utopia-app-db-credentials" "type" "kubernetes.io/basic-auth" "kind" "generated" "offline" $offline "setting" "secrets.utopia.appDbPassword" "inputs" (dict "password" $u.appDbPassword) "data" (dict
      "username" "utopia_app"
      "password" (include "lore-install.value" (dict "setting" "secrets.utopia.appDbPassword" "provided" $u.appDbPassword "namespace" $release "name" "utopia-app-db-credentials" "key" "password" "generate" true)))) }}
{{ include "lore-install.groupSecret" (dict "namespace" $release "name" "utopia-app" "kind" "generated" "offline" $offline "setting" "secrets.utopia.secretKey" "inputs" (dict "secret-key" $u.secretKey) "data" (dict
      "secret-key" (include "lore-install.value" (dict "setting" "secrets.utopia.secretKey" "provided" $u.secretKey "namespace" $release "name" "utopia-app" "key" "secret-key" "generate" true "hex" true)))) }}
{{- /* The OpenID Connect client Utopia signs people in with (secrets.oidc). Its cookie secret is generated. */}}
{{ include "lore-install.groupSecret" (dict "namespace" $release "name" "utopia-oauth" "kind" "required" "offline" $offline "setting" "secrets.oidc" "inputs" (dict "client-id" $s.oidc.clientId "client-secret" $s.oidc.clientSecret) "data" (dict
      "client-id" $s.oidc.clientId
      "client-secret" $s.oidc.clientSecret
      "cookie-secret" (include "lore-install.value" (dict "setting" "secrets.utopia.cookieSecret" "provided" $u.cookieSecret "namespace" $release "name" "utopia-oauth" "key" "cookie-secret" "generate" true "length" 32)))) }}
{{- end }}

{{- /* Optional groups: written only when set. Empty, they are yours to make, or left out. */}}
{{- with $s.anthropicApiKey }}
{{- range $namespace, $name := dict "lore-api" "lore-anthropic-key" "lore-stations" "lore-stations-anthropic-key" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" (dict "anthropic-api-key" $s.anthropicApiKey)) }}
{{- end }}
{{- end }}

{{- with $s.openaiApiKey }}
{{- range $namespace, $name := dict "lore-api" "lore-openai-key" "lore-stations" "lore-stations-openai-key" }}
{{ include "lore-install.secret" (dict "namespace" $namespace "name" $name "data" (dict "api-key" $s.openaiApiKey)) }}
{{- end }}
{{- end }}

{{- if or $s.slack.botToken $s.slack.signingSecret }}
{{ include "lore-install.secret" (dict "namespace" "lore-api" "name" "lore-slack-credentials" "data" (dict
      "signing-secret" (required "secrets.slack.signingSecret is required with secrets.slack.botToken" $s.slack.signingSecret)
      "bot-token" (required "secrets.slack.botToken is required with secrets.slack.signingSecret" $s.slack.botToken))) }}
{{ include "lore-install.secret" (dict "namespace" "lore-stations" "name" "lore-stations-slack" "data" (dict "bot-token" $s.slack.botToken)) }}
{{- end }}
{{- end }}
