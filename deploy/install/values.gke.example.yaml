# Lore on Google GKE. Pull the chart (`helm pull oci://ghcr.io/re-cinq/charts/lore-install
# --version X.Y.Z --untar`), copy this file, fill it in, then:
#
#   helm upgrade --install lore oci://ghcr.io/re-cinq/charts/lore-install --version X.Y.Z \
#     -n lore-floor --create-namespace -f my-values.yaml
#
# First (docs/install/gke.md): CloudNativePG, Traefik, cert-manager, and the
# lore-databases chart. Every CHANGE-ME must be replaced; the install stops
# while one is left. The filled file holds secrets: keep it out of git. Tokens
# and passwords not listed here are generated on the first install and kept.
# To run every Lore pod on one node pool: --set global.nodeSelector.pool=management

# The identity provider Utopia signs people in with. Google shown; any OpenID Connect issuer works (Microsoft Entra ID:
# https://login.microsoftonline.com/<tenant id>/v2.0).
global:
  oidc:
    issuer: https://accounts.google.com
    allowedDomains: CHANGE-ME                                  # e.g. example.com

secrets:
  # The databases are the lore-databases chart's. For Cloud SQL instead, skip
  # that chart, set these two, and set LORE_DB_HOST in lore-api, lore-ui and
  # lore-stations below:
  # loreDbPassword: CHANGE-ME
  # floorDbConnectionString: postgres://floor:CHANGE-ME@CHANGE-ME:5432/floor
  githubApp:
    appId: "CHANGE-ME"
    installationId: "CHANGE-ME"
    privateKey: |
      -----BEGIN RSA PRIVATE KEY-----
      CHANGE-ME
      -----END RSA PRIVATE KEY-----
  githubOAuth:
    clientId: CHANGE-ME
    clientSecret: CHANGE-ME
  # Lore's own model calls with an Anthropic key. With Vertex AI (Gemini) there
  # is no key: drop this line and use the Vertex block under lore-api.
  anthropicApiKey: CHANGE-ME
  # The OIDC client (app registration) of Utopia's sign-in, and its secret.
  # Leave both empty to create Secret utopia-oauth (keys client-id,
  # client-secret) yourself.
  oidc:
    clientId: CHANGE-ME
    clientSecret: CHANGE-ME

utopia:
  enabled: true
  hostname: utopia.example.com
  # Must repeat global.oidc above; the install stops when the two differ.
  oidc:
    issuer: https://accounts.google.com
    allowedDomains: CHANGE-ME
  # The controller must allow request bodies up to 200 MB and keep WebSockets open.
  ingress:
    className: traefik
    clusterIssuer: letsencrypt-prod
  # Storage uses the cluster's default class unless you name one:
  # data: { storageClass: standard-rwo }

lore-platform:
  platform:
    ingressClassName: traefik
    # The cert-manager ClusterIssuer; empty: bring the TLS Secrets yourself.
    clusterIssuer: letsencrypt-prod
    networkPolicies:
      ingressNamespace: traefik
    # The controller must allow request bodies up to 25 MB on the API host
    # (GitHub webhooks) and keep WebSockets open on the UI host (live run page).
    ingresses:
      - { name: lore-api, namespace: lore-api, host: lore-api.example.com, service: lore-api, port: 3000 }
      - { name: lore-mcp, namespace: lore-api, host: lore-mcp.example.com, service: lore-mcp-gateway, port: 8080 }
      - { name: lore-ui, namespace: lore-ui, host: lore.example.com, service: lore-ui, port: 3000 }
      # The live run page's WebSocket, on the UI's own host so that the browser
      # sends the sign-in cookie when it opens the connection.
      # Prefix, not Exact: Traefik 3 ranks an Exact path below the UI's "/" prefix.
      - { name: lore-ui-live, namespace: lore-api, host: lore.example.com, path: /api/ws, pathType: Prefix, service: lore-api, port: 3000 }

  lore-api:
    utopia: { enabled: true }
    # Vertex AI under Workload Identity: lore-api's Kubernetes ServiceAccount
    # impersonates the Google service account lore-api@<project>, which needs
    # roles/aiplatform.user. Used for Gemini calls and for the embeddings
    # (Vertex text-embedding-005, 768 dimensions), which are Vertex by default.
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: lore-api@CHANGE-ME.iam.gserviceaccount.com
    env:
      LORE_WEBHOOK_URL: https://lore-api.example.com/api/webhook/github
      LORE_API_URL: https://lore-api.example.com
      LORE_UI_URL: https://lore.example.com
      GITHUB_ORG: CHANGE-ME
      GCP_PROJECT: CHANGE-ME
      # Without Vertex: delete serviceAccount, GCP_PROJECT and the Vertex entries
      # below (Anthropic is then the default, embeddings keyword-only unless you
      # set LORE_EMBEDDING_PROVIDER: openai and secrets.openaiApiKey).
      LORE_LLM_PROVIDER: vertex
      LORE_FACT_MODEL: gemini-2.5-flash
      LORE_EMBEDDING_PROVIDER: vertex   # text-embedding-005
      LORE_TRACE_EXPORTER: cloud-trace  # Google Cloud Trace
      # GITHUB_HOST: ghe.example.com   # GitHub Enterprise; unset for github.com
      # LORE_DB_HOST: CHANGE-ME        # Cloud SQL only
  lore-ui:
    env:
      GITHUB_APP_SLUG: CHANGE-ME
      UTOPIA_URL: https://utopia.example.com
      LORE_API_PUBLIC_URL: https://lore-api.example.com
      LORE_WS_URL: wss://lore.example.com/api/ws
      # GITHUB_HOST: ghe.example.com
      # LORE_DB_HOST: CHANGE-ME
  lore-stations:
    env:
      LORE_UI_URL: https://lore.example.com
      # GITHUB_HOST: ghe.example.com
      # LORE_DB_HOST: CHANGE-ME
      LORE_LLM_PROVIDER: vertex
      LORE_FACT_MODEL: gemini-2.5-flash
      LORE_EMBEDDING_PROVIDER: vertex
      GCP_PROJECT: CHANGE-ME
