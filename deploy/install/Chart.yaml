apiVersion: v2
name: lore-install
description: >-
  Installs Lore, the floor, the agent subsystem and, optionally, Utopia on one
  cluster from one values file.
type: application
version: 0.1.0

# The agent subsystem is not a dependency of its own: the floor chart bundles
# it (floor.subsystem.enabled). Its standalone chart rejects the `global` key
# Helm hands every subchart, and both charts ship the same five CRDs.
dependencies:
  - name: lore-platform
    version: 0.1.0
    repository: file://../chart
  - name: floor
    version: 0.8.0
    repository: oci://ghcr.io/re-cinq/charts
  # Utopia's chart is not published to a registry. The release script
  # (scripts/ci/package-install-chart.sh) reads it from the git tag of the
  # Utopia image pinned in values.yaml and packages it into this chart; a
  # checkout of re-cinq/utopia beside the repository does the same locally.
  - name: utopia
    version: 0.1.0
    repository: file://../../../utopia/deploy/chart
    condition: utopia.enabled
