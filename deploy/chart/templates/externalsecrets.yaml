{{- /*
Every Kubernetes Secret the platform reads, filled from Secret Manager through
the External Secrets ClusterSecretStore. One entry per Secret:
  name, namespace, keys: {<secret key>: <Secret Manager key>}, optional
  target, template (ExternalSecret target.template) and creationPolicy.
*/ -}}
{{- $store := .Values.platform.secretStore }}
{{- range .Values.platform.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: {{ .target | default .name }}
    {{- with .creationPolicy }}
    creationPolicy: {{ . }}
    {{- end }}
    {{- with .template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
    {{- range $key, $remote := .keys }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ $remote }} }
    {{- end }}
{{- end }}
