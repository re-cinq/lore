{{- /*
Every workload has a ServiceAccount of its own and none mounts an API token:
nothing in them talks to the Kubernetes API. An identity binding (a Google,
Azure or other workload identity) is an annotation set by a value:
lore-ui.serviceAccount.annotations and platform.dgraph.serviceAccount.annotations.
*/ -}}
{{- $uiAccount := (index .Values "lore-ui").serviceAccount | default dict }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lore-ui
  namespace: lore-ui
  {{- with $uiAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if .Values.platform.dgraph }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lore-dgraph
  namespace: lore-dgraph
  {{- with (.Values.platform.dgraph.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
