{{- /*
Every workload has a ServiceAccount of its own and none mounts an API token:
nothing in them talks to the Kubernetes API. The Google annotation is Workload
Identity and only means something on GKE.
*/ -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lore-ui
  namespace: lore-ui
  {{- with .Values.platform.gcpProject }}
  annotations:
    iam.gke.io/gcp-service-account: lore-ui@{{ . }}.iam.gserviceaccount.com
  {{- end }}
automountServiceAccountToken: false
{{- if .Values.platform.dgraph }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lore-dgraph
  namespace: lore-dgraph
automountServiceAccountToken: false
{{- end }}
