{{- if .Values.platform.dgraph }}
{{- $g := .Values.platform.dgraph }}
{{- $global := .Values.global | default dict }}
{{- $nodeSelector := $g.nodeSelector | default $global.nodeSelector }}
{{- $tolerations := $g.tolerations | default $global.tolerations }}
{{- $podLabels := merge (dict) ($g.podLabels | default dict) ($global.podLabels | default dict) }}
{{- $podAnnotations := merge (dict) ($g.podAnnotations | default dict) ($global.podAnnotations | default dict) }}
---
apiVersion: v1
kind: Service
metadata:
  name: lore-dgraph-alpha
  namespace: lore-dgraph
  labels: { app: lore-dgraph }
spec:
  clusterIP: None
  selector: { app: lore-dgraph }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 9080, targetPort: 9080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lore-dgraph-alpha
  namespace: lore-dgraph
  labels: { app: lore-dgraph }
spec:
  serviceName: lore-dgraph-alpha
  replicas: 1
  selector:
    matchLabels: { app: lore-dgraph }
  template:
    metadata:
      labels:
        app: lore-dgraph
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # One replica on one disk: the node autoscaler must not move it.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: lore-dgraph
      automountServiceAccountToken: false
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Verified against dgraph/standalone v24.0.0: it runs as 1000 with every
      # capability dropped and a read-only root, writing only to /dgraph and /tmp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dgraph
          image: {{ $g.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9080 }
          {{- if and (hasKey $g "telemetry") (not $g.telemetry) }}
          # Dgraph reports usage to Dgraph Inc. and errors to Sentry unless told not to.
          env:
            - { name: DGRAPH_ALPHA_TELEMETRY, value: "reports=false; sentry=false;" }
            - { name: DGRAPH_ZERO_TELEMETRY, value: "reports=false; sentry=false;" }
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /dgraph }
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $g.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $g.storageSize }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lore-dgraph-schema
  namespace: lore-dgraph
data:
  setup-memory-dgraph-schema.sh: |
{{ .Files.Get "files/setup-memory-dgraph-schema.sh" | indent 4 }}
  setup-spec-trace-schema.sh: |
{{ .Files.Get "files/setup-spec-trace-schema.sh" | indent 4 }}
---
# Applies both schemas after every sync; idempotent. An Argo CD PostSync hook,
# and a Helm post-install/upgrade hook for a plain helm install.
apiVersion: batch/v1
kind: Job
metadata:
  name: lore-dgraph-schema-apply
  namespace: lore-dgraph
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    {{- if or $podLabels $podAnnotations }}
    metadata:
      {{- with $podLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: lore-dgraph
      automountServiceAccountToken: false
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-schema
          image: {{ $g.schemaImage | default $.Values.platform.schemaImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # An image that already holds curl: the scripts run under its sh.
          command: ["/bin/sh", "-c"]
          args:
            - sh /schema/setup-memory-dgraph-schema.sh && sh /schema/setup-spec-trace-schema.sh
          env:
            - name: DGRAPH_HTTP
              value: http://lore-dgraph-alpha.lore-dgraph.svc.cluster.local:8080
          volumeMounts:
            - { name: schema, mountPath: /schema }
      volumes:
        - name: schema
          configMap: { name: lore-dgraph-schema }
{{- end }}
