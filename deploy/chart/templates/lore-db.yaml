{{- if .Values.platform.database }}
{{- $db := .Values.platform.database }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: lore-db-backup
  namespace: lore-db
spec:
  configuration:
    destinationPath: gs://{{ $db.backupBucket }}/lore-db
    googleCredentials:
      gkeEnvironment: true
  retentionPolicy: {{ $db.backupRetention }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lore-db
  namespace: lore-db
spec:
  instances: 1
  imageName: {{ $db.image }}
  bootstrap:
    initdb:
      database: lore
      owner: lore
      secret: { name: lore-db-credentials }
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  # The pod's identity writes WAL and backups to the bucket (Workload Identity).
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ $db.backupServiceAccount }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: lore-db-backup
  storage:
    size: {{ $db.size }}
  resources:
    {{- toYaml $db.resources | nindent 4 }}
  postgresql:
    shared_preload_libraries: [vector]
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lore-db-daily
  namespace: lore-db
spec:
  schedule: {{ $db.backupSchedule | quote }}
  backupOwnerReference: self
  cluster: { name: lore-db }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
