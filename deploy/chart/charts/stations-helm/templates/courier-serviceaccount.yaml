{{- if .Values.courierJobs }}
# The courier pods only post to lore-api: no API token, and an identity
# annotation only when courier.serviceAccount.annotations sets one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-courier
  namespace: {{ .Values.namespace }}
  {{- with .Values.courier.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
