{{- if .Values.courierJobs }}
# The courier pods only post to lore-api. They get no Workload Identity
# annotation (the stations pod's own ServiceAccount carries it) and no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-courier
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
{{- end }}
