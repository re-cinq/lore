# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-api

replicaCount: 1

# Where the pods run. Empty: anywhere. Unset here, global.nodeSelector and
# global.tolerations of the parent chart apply; set here, they win.
nodeSelector: {}
tolerations: []

# The restricted pod profile: non-root user, no privilege escalation, every
# capability dropped, the RuntimeDefault seccomp profile and a read-only root
# filesystem with an emptyDir at /tmp. Off keeps the image's own user and a
# writable root, which is what a cluster that predates it runs.
hardened: false
runAsUser: 1000

# PodDisruptionBudget keeps at least one lore-api pod available during
# Autopilot node consolidation. Without this, scale-down evictions
# briefly take the API offline and local MCP clients silently fall
# back to file mode (writes never reach Postgres). Rendered only above one
# replica: with one, minAvailable 1 would block every node drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# GCP project of the `lore-api` GSA the pod's KSA impersonates for Vertex
# embeddings (templates/serviceaccount.yaml). Empty: the ServiceAccount carries
# no Workload Identity annotation. Set by terraform.
gcpProject: ""

image:
  repository: ghcr.io/re-cinq/lore-api
  tag: latest
  # sha256:... pins the image by content; the tag stays for the reader.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

# Prometheus text on /metrics, scraped by the ServiceMonitor in deploy/chart/templates/monitoring.yaml.
metricsPort: 9464

service:
  type: ClusterIP
  port: 3000

# 1Gi, heap sized to it by NODE_OPTIONS below: at 512Mi Node's default heap
# (~250 MB) ran out every Monday at 11:00 UTC when the weekly
# spec-coverage-backfill started ~20 detect pods reading chunks through here
# at once (#2217).
# CPU may burst to 2 cores: the Loops tab reads seven loop routes at once,
# each 0.3 to 3.6 s alone, and at a 500m limit the burst was throttled into
# 16 s for the board (measured 2026-10-24). Autopilot bills the request, so
# the limit costs nothing while the pod is idle.
resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  # The GitHub host this install talks to; empty is github.com. A GitHub Enterprise Server is its bare host name, e.g. ghe.example.com.
  GITHUB_HOST: ""
  # The client's pack repository (specs/client-packs), "owner/name"; empty is no pack. LORE_PACK_REF is the branch or tag to read, empty is the repository's default branch.
  LORE_PACK_REPO: ""
  LORE_PACK_REF: ""
  PORT: "3000"
  LORE_METRICS_PORT: "9464"
  # Leaves ~250 MB of the 1Gi limit for buffers, sockets and native memory.
  NODE_OPTIONS: "--max-old-space-size=768"
  CONTEXT_PATH: /context
  LORE_TEAM: platform
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  # Shared Dgraph endpoint (memory + spec-trace graphs). Empty → /impact + graph
  # reads fail soft. Overridden by terraform set to the in-cluster service DNS.
  LORE_DGRAPH_HTTP: ""
  # The context evals (specs/context-evals) run on the process-wide model
  # (LORE_LLM_PROVIDER) unless LORE_EVAL_LLM_PROVIDER and LORE_EVAL_LLM_MODEL
  # name another; our own cluster sets Vertex Gemini in its values file.
  # LORE_EVAL_JUDGE_MODEL names a stronger model for the verdict alone.

dbPasswordSecret:
  name: lore-api-db-password
  key: password

ingestTokenSecret:
  name: lore-ingest-token
  key: token

githubAppSecret:
  name: github-app-credentials
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# HMAC secret for verifying GitHub webhook signatures.
webhookSecret:
  name: lore-webhook-secret
  key: secret

# The GitHub OAuth app lore-api signs people in with for the web UI
# (/api/auth/*, ADR-053). An empty name leaves the sign-in off: the routes
# answer 503 and the UI cannot start a session.
githubOAuthSecret:
  name: ""
  clientIdKey: client-id
  clientSecretKey: client-secret

# The service-to-service token lore-api accepts from the stations service and
# the cluster agents.
internalTokenSecret:
  name: lore-agent-internal-token
  key: token

# Slack integration (optional — leave empty to disable)
slackSigningSecret:
  name: lore-slack-credentials
  key: signing-secret

slackBotTokenSecret:
  name: lore-slack-credentials
  key: bot-token

# Who the agents' commits are authored and committed by: lore-api puts these into the
# GIT_AUTHOR_* / GIT_COMMITTER_* env of every agent that commits (config.env of its
# agent-defaults md), so a client's own identity replaces the default without a prompt edit.
commitAuthor:
  name: Lore Agent
  email: lore-agent@re-cinq.com

# The external floor engine (its own namespace and Helm release). Off by default:
# nothing below renders until terraform sets enabled from var.enable_external_floor.
floor:
  enabled: false
  apiUrl: http://floor-api.floor.svc.cluster.local:8080
  # The image a floor agent's pod runs in: node:22-bookworm plus the tools the agents
  # lean on (jq, yq, rg, python3, make, a Temurin 21 JDK ...), built from apps/agent-image. The subsystem
  # brings its own supervisor; this is only the container the agent works inside.
  agentImage: ghcr.io/re-cinq/lore-agent:latest
  # In-cluster lore-mcp gateway skills registry; set by terraform.
  skillsUrl: ""
  serviceTokenSecret:
    name: floor-service-token
    key: token
  gitCredentialTokenSecret:
    name: floor-git-credential-token
    key: token

# Utopia (deeplethe/utopia), the knowledge-graph service the spec/ADR chain is
# mirrored into (specs/utopia-graph-mirror). Off by default: terraform sets
# enabled from var.enable_utopia. Each repo's push key lives in lore.utopia_sources.
# With tokenSecret (the Secret holding a Utopia write token under `token`) and
# workspaceId set, a repo's first spec/ADR ingest creates its knowledge base in
# that workspace; empty, a person sets each repo up through the setup route.
utopia:
  enabled: false
  apiUrl: http://utopia.utopia.svc.cluster.local
  workspaceId: ""
  tokenSecret: ""

# Optional key for Lore's own model calls and embeddings against any
# OpenAI-compatible API (OpenAI, Microsoft Foundry). Selected with the env
# entries OPENAI_BASE_URL, LORE_LLM_PROVIDER=openai, LORE_FACT_MODEL,
# LORE_EMBEDDING_PROVIDER=openai and LORE_EMBEDDING_MODEL; leave those unset
# (they are not listed in env above on purpose, an empty value would still be
# exported) and the secret is unused.
openaiKeySecret:
  name: lore-openai-key
  key: api-key

# The Anthropic ORG admin key used by the cost-sync maintenance job. Secrets are
# namespace-scoped, so this names the lore-api-namespace copy of the Secret;
# unset simply makes the job skip.
anthropicAdminKeySecret:
  name: lore-anthropic-key
  key: anthropic-admin-key
