apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lore-api
  template:
    metadata:
      labels:
        app: lore-api
        {{- with (include "lore.podLabels" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "lore.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: lore-api
      automountServiceAccountToken: false
      {{- with (include "lore.podSettings" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      # Plan edits are debounced in memory (planning-sync flushes them on
      # hapi's onPreStop), so give a rollout time to write the last keystrokes:
      # 45 seconds for that, after the 10 the preStop below waits.
      terminationGracePeriodSeconds: 55
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.floor.enabled }}
      # lore-api puts its pipelines and agent definitions to the floor once, at
      # boot, and does not try again. On a first install the floor's api is
      # still waiting for its own migration, so wait for it here (at most five
      # minutes: a floor out of reach must not stop the deploy).
      initContainers:
        - name: wait-for-floor
          image: {{ include "lore.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              const url = process.env.FLOOR_API_URL + "/readyz";
              const giveUpAt = Date.now() + 300000;
              (async () => {
                while (Date.now() < giveUpAt) {
                  try {
                    if ((await fetch(url, { signal: AbortSignal.timeout(3000) })).ok) return;
                  } catch {}
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                }
                console.log("the floor is not ready; starting anyway");
              })();
          env:
            - name: FLOOR_API_URL
              value: {{ .Values.floor.apiUrl | quote }}
          {{- with (include "lore.containerSecurityContext" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "lore.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # A pod being replaced keeps serving for 10 seconds before it is told
          # to stop. The ingress needs a moment to stop sending it requests;
          # without the wait, a request arriving in that moment hits a closed
          # port and is answered 502. That matters most for GitHub's webhook
          # deliveries (`POST /api/webhook/github`, which the public webhook
          # hostnames route here, deploy/chart/templates/ingresses.yaml): GitHub
          # does not retry one.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: LORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret.name }}
                  key: {{ .Values.dbPasswordSecret.key }}
            - name: LORE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestTokenSecret.name }}
                  key: {{ .Values.ingestTokenSecret.key }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.appIdKey }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.privateKeyKey }}
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.installationIdKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lore-anthropic-key
                  key: anthropic-api-key
                  optional: true
            {{- if .Values.openaiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openaiKeySecret.name }}
                  key: {{ .Values.openaiKeySecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.anthropicAdminKeySecret }}
            # The Anthropic ORG admin key, for the cost-sync maintenance job
            # (#1348). Distinct from the API key above: it reads the billing
            # reports and mints nothing. Optional — an unset key makes the job
            # report a skip rather than fail.
            - name: ANTHROPIC_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropicAdminKeySecret.name }}
                  key: {{ .Values.anthropicAdminKeySecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.webhookSecret }}
            - name: LORE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webhookSecret.name }}
                  key: {{ .Values.webhookSecret.key }}
            {{- end }}
            # optional: a Secret without the App's client leaves the App
            # sign-in answering 503; it must never keep the API from starting.
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.clientIdKey }}
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.clientSecretKey }}
                  optional: true
            {{- if .Values.userTokenKeySecret.name }}
            - name: LORE_USER_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.userTokenKeySecret.name }}
                  key: {{ .Values.userTokenKeySecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.githubOAuthSecret.name }}
            # optional: a Secret that has not synced yet leaves the sign-in
            # answering 503; it must never keep the whole API from starting.
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubOAuthSecret.name }}
                  key: {{ .Values.githubOAuthSecret.clientIdKey }}
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubOAuthSecret.name }}
                  key: {{ .Values.githubOAuthSecret.clientSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.internalTokenSecret }}
            - name: LORE_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalTokenSecret.name }}
                  key: {{ .Values.internalTokenSecret.key }}
            {{- end }}
            {{- if .Values.slackSigningSecret }}
            - name: LORE_SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slackSigningSecret.name }}
                  key: {{ .Values.slackSigningSecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.slackBotTokenSecret }}
            - name: LORE_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slackBotTokenSecret.name }}
                  key: {{ .Values.slackBotTokenSecret.key }}
                  optional: true
            {{- end }}
            - name: LORE_COMMIT_AUTHOR_NAME
              value: {{ .Values.commitAuthor.name | quote }}
            - name: LORE_COMMIT_AUTHOR_EMAIL
              value: {{ .Values.commitAuthor.email | quote }}
            {{- if .Values.floor.enabled }}
            - name: FLOOR_API_URL
              value: {{ .Values.floor.apiUrl | quote }}
            - name: LORE_AGENT_IMAGE
              value: {{ .Values.floor.agentImage | quote }}
            {{- if .Values.floor.skillsUrl }}
            - name: LORE_SKILLS_URL
              value: {{ .Values.floor.skillsUrl | quote }}
            {{- end }}
            - name: FLOOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.floor.serviceTokenSecret.name }}
                  key: {{ .Values.floor.serviceTokenSecret.key }}
            - name: FLOOR_GIT_CREDENTIAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.floor.gitCredentialTokenSecret.name }}
                  key: {{ .Values.floor.gitCredentialTokenSecret.key }}
            {{- end }}
            {{- if .Values.utopia.enabled }}
            - name: UTOPIA_API_URL
              value: {{ .Values.utopia.apiUrl | quote }}
            {{- if .Values.utopia.tokenSecret }}
            - name: UTOPIA_WORKSPACE_ID
              value: {{ .Values.utopia.workspaceId | quote }}
            # Optional: the apply that creates this ExternalSecret also renders this
            # env, and the token is seeded after it. Until it is, lore-api starts
            # without UTOPIA_TOKEN and simply does not set repos up by itself.
            - name: UTOPIA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.utopia.tokenSecret }}
                  key: token
                  optional: true
            {{- end }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with (include "lore.containerSecurityContext" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.hardened }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
          {{- end }}
