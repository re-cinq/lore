apiVersion: v1
kind: ServiceAccount
metadata:
  name: lore-api
  namespace: {{ .Values.namespace }}
  annotations:
    # Workload Identity → the `lore-api` GSA (infra/terraform/lore-api-iam.tf),
    # which holds roles/aiplatform.user for Vertex embeddings. Without this the
    # pod runs as the unbound default KSA and every embedding call is a 403.
    iam.gke.io/gcp-service-account: lore-api@{{ .Values.gcpProject }}.iam.gserviceaccount.com
