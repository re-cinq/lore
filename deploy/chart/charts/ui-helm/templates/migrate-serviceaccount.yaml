{{- if .Values.migrations.enabled }}
# The migrate hook Job's own identity, with no API token: it talks to Postgres
# only. A hook like the Job, so it exists on a first install, before any
# regular resource does.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
{{- end }}
