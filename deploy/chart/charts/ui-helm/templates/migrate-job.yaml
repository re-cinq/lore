{{- if .Values.migrations.enabled }}
# pre-install/pre-upgrade hook: apply DB migrations before the UI rolls out.
# Re-runs every deploy; lore.schema_migrations makes applied files a no-op.
# `helm upgrade --wait` blocks until this succeeds, so a bad migration fails
# the deploy before any new UI pods take traffic. On a database with no
# baseline (a managed Postgres) the script installs the baseline first
# (files/migrate.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # No pod retry and a deadline under helm's own 5m: a migration failure is
  # deterministic (each file runs in one transaction, and the DB-wait loop
  # below already covers an unreachable database), so retrying it three times
  # only spent helm's deadline and turned the real psql error into
  # "context deadline exceeded" — which marked the release failed with the hook
  # still InProgress, and every later deploy of ANY service died on the same
  # hook (#1650, 2026-08-29). A hook that always resolves inside the deadline
  # fails the one deploy that carries the bad migration, with its log readable.
  backoffLimit: 0
  activeDeadlineSeconds: 270
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-migrate
    spec:
      restartPolicy: Never
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.migrations.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ .Files.Get "files/migrate.sh" | indent 14 }}
          env:
            # A DDL statement queued behind a long transaction would otherwise
            # wait past the Job deadline and report nothing; a lock wait that
            # long is the wedge, so it fails fast and names the lock.
            - name: TEAM_SCHEMAS
              value: {{ .Values.migrations.teamSchemas | quote }}
            - name: PGOPTIONS
              value: "-c lock_timeout=60s"
            - name: PGHOST
              value: {{ .Values.env.LORE_DB_HOST | quote }}
            - name: PGPORT
              value: {{ .Values.env.LORE_DB_PORT | quote }}
            - name: PGDATABASE
              value: {{ .Values.env.LORE_DB_NAME | quote }}
            - name: PGUSER
              value: {{ .Values.migrations.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret.name }}
                  key: {{ .Values.dbPasswordSecret.key }}
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: baseline
              mountPath: /baseline
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ .Chart.Name }}-migrations
        - name: baseline
          configMap:
            name: {{ .Chart.Name }}-baseline
{{- end }}
