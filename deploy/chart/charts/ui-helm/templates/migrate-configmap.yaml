{{- if .Values.migrations.enabled }}
# Migration SQL, mounted by the migrate hook Job. Created as a hook (lower
# weight than the Job) and recreated each deploy so new *.sql is picked up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-migrations
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{ (.Files.Glob "migrations/*.sql").AsConfig | indent 2 }}
{{- end }}
