# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-ui

replicaCount: 1

# Where the pods run. Empty: anywhere. Unset here, global.nodeSelector and
# global.tolerations of the parent chart apply; set here, they win.
nodeSelector: {}

# Identity as plain labels and annotations, whatever the cluster binds them to
# (a workload identity label on the pod and an annotation on the ServiceAccount,
# a service mesh, a cost label). podLabels / podAnnotations here win over
# global.podLabels / global.podAnnotations of the parent chart; none is set by
# default. Example, Azure Workload Identity:
#   podLabels: { azure.workload.identity/use: "true" }
#   serviceAccount: { annotations: { azure.workload.identity/client-id: <client id> } }
podLabels: {}
podAnnotations: {}
serviceAccount:
  annotations: {}
tolerations: []

# The restricted pod profile: non-root user, no privilege escalation, every
# capability dropped, the RuntimeDefault seccomp profile and a read-only root
# filesystem with an emptyDir at /tmp. Off keeps the image's own user and a
# writable root, which is what a cluster that predates it runs.
hardened: false
runAsUser: 1000

# PodDisruptionBudget keeps at least one UI pod available during
# Autopilot node consolidation. Rendered only above one replica.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-ui
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  # The GitHub host this install talks to; empty is github.com. A GitHub Enterprise Server is its bare host name, e.g. ghe.example.com.
  GITHUB_HOST: ""
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  # pg pool cap for the UI's connection pool (src/lib/db.ts). Matches the code
  # default; exposed here so it's tunable via standard deploy.
  LORE_DB_POOL_MAX: "20"
  # In-cluster MCP server URL — the /api/pipeline/[id]/timeline route proxies
  # here for the commit-walk + trailer parsing. Stays inside the cluster
  # rather than hairpinning through the public ingress.
  LORE_API_URL: http://lore-api.lore-api.svc.cluster.local:3000

# Schema migrations applied as a pre-install/pre-upgrade hook Job before the UI
# rolls out. SQL lives in migrations/*.sql; tracked in lore.schema_migrations.
# Connects as `lore`, which owns the database (terraform/lore-db.tf initdb
# owner), so DDL needs no superuser — reuses the same dbPasswordSecret the UI
# uses.
migrations:
  enabled: true
  # Only psql is used. Pinned by digest; the standard variant carries pgvector.
  image: ghcr.io/cloudnative-pg/postgresql:16.16-standard-bookworm@sha256:69b02d259c6fe5d0ef53fe67ecb000e9c0cee4d3b9e173b58bb13e722b17ba4e
  user: lore
  # Team schemas (each with a chunks table) the baseline creates on a database
  # that has none. A repo whose team has no schema of its own uses org_shared.
  teamSchemas: org_shared
  # Annotations of the migrate Job's ServiceAccount (it talks to Postgres only).
  serviceAccount:
    annotations: {}

dbPasswordSecret:
  name: lore-db-password
  key: password

githubAppSecret:
  name: github-app-credentials
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# The UI holds no service token and no OAuth secret: a person signs in through
# lore-api, which keeps the GitHub OAuth app (ADR-053), and the UI sends that
# person's session token with every call.
