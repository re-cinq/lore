apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        {{- with (include "lore.podLabels" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "lore.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      automountServiceAccountToken: false
      {{- with (include "lore.podSettings" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "lore.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # Bearer the gateway proxies to lore-api with.
            - name: LORE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestTokenSecret.name }}
                  key: {{ .Values.ingestTokenSecret.key }}
            # Required Bearer on incoming MCP requests: what agent pods send. With
            # mcpAuthTokenSecret unset it is the ingest token above, which hands
            # every agent pod the admin token.
            - name: LORE_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.mcpAuthTokenSecret.name }}
                  name: {{ .Values.mcpAuthTokenSecret.name }}
                  key: {{ .Values.mcpAuthTokenSecret.key }}
                  {{- else }}
                  name: {{ .Values.ingestTokenSecret.name }}
                  key: {{ .Values.ingestTokenSecret.key }}
                  {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with (include "lore.containerSecurityContext" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.hardened }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
          {{- end }}
