# Deploy into the existing lore-api namespace so the gateway reuses that
# namespace's lore-ingest-token Secret — no new namespace or Secret needed.
namespace: lore-api

replicaCount: 1

# Where the pod runs and how it is locked down: see lore-api-helm/values.yaml.
nodeSelector: {}

# Identity as plain labels and annotations, whatever the cluster binds them to
# (a workload identity label on the pod and an annotation on the ServiceAccount,
# a service mesh, a cost label). podLabels / podAnnotations here win over
# global.podLabels / global.podAnnotations of the parent chart; none is set by
# default. Example, Azure Workload Identity:
#   podLabels: { azure.workload.identity/use: "true" }
#   serviceAccount: { annotations: { azure.workload.identity/client-id: <client id> } }
podLabels: {}
podAnnotations: {}
serviceAccount:
  annotations: {}
tolerations: []
hardened: false
runAsUser: 1000

image:
  repository: ghcr.io/re-cinq/lore-mcp
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

# Prometheus text on /metrics, scraped by the ServiceMonitor in deploy/chart/templates/monitoring.yaml.
metricsPort: 9464

service:
  type: ClusterIP
  port: 8080

# The floor's agent pods, which fetch skills and speak MCP to this gateway.
# An empty namespace leaves their egress alone.
agentPods:
  namespace: ai-agents
  podLabels:
    agents.re-cinq.com/component: job

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  LORE_MCP_HTTP: "1"
  LORE_MCP_SERVER_MODE: agent
  LORE_MCP_PORT: "8080"
  LORE_METRICS_PORT: "9464"
  # The read cache is for a laptop that lost the API (specs/local-read-cache
  # AC1). One gateway serves every agent pod, so it never caches.
  LORE_CACHE_ENABLED: "false"
  # In-cluster lore-api. The gateway is a normal Deployment (NOT under the
  # agent-job NetworkPolicy), so it may use the ClusterIP directly. Agent pods
  # reach it by its Service too, through templates/agent-egress.yaml.
  LORE_API_URL: http://lore-api.lore-api.svc.cluster.local:3000
  LORE_TEAM: platform

# The token the gateway proxies to lore-api with.
ingestTokenSecret:
  name: lore-ingest-token
  key: token

# The Bearer the gateway requires on incoming requests, which agent pods present
# through the lore-mcp-auth headers_secret. The gateway refuses to run
# without one. Empty name: the ingest token above is required instead, so every
# agent pod holds the admin token. A client install names its own Secret.
mcpAuthTokenSecret:
  name: ""
  key: token
