{{- /*
The passwords are generated on the first install and read back from the
cluster afterwards, so an upgrade never changes one. `helm template` has no
cluster, so each render shows other passwords.
*/ -}}
{{- $db := .Values.namespace }}
{{- $lorePassword := include "lore-databases.password" (dict "namespace" $db "name" "lore-db-credentials" "key" "password") }}
{{- $floorPassword := include "lore-databases.password" (dict "namespace" $db "name" "floor-db-credentials" "key" "password") }}
{{- $lore := include "lore-databases.cluster" (dict "root" . "cluster" "lore") | fromJson }}
{{- $floor := include "lore-databases.cluster" (dict "root" . "cluster" "floor") | fromJson }}
{{- $secrets := list
  (dict "namespace" $db "name" "lore-db-credentials" "type" "kubernetes.io/basic-auth" "data" (dict "username" .Values.lore.owner "password" $lorePassword))
  (dict "namespace" $db "name" "floor-db-credentials" "type" "kubernetes.io/basic-auth" "data" (dict "username" .Values.floor.owner "password" $floorPassword))
  (dict "namespace" "lore-api" "name" "lore-api-db-password" "data" (dict "password" $lorePassword))
  (dict "namespace" "lore-ui" "name" "lore-db-password" "data" (dict "password" $lorePassword))
  (dict "namespace" "lore-stations" "name" "lore-stations-db-password" "data" (dict "password" $lorePassword))
  (dict "namespace" "lore-floor" "name" "floor-postgres" "data" (dict "connectionString" (printf "postgres://%s:%s@%s-rw.%s.svc.cluster.local:5432/%s" .Values.floor.owner $floorPassword .Values.floor.name $db .Values.floor.database))) }}
{{- range $secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: {{ .type | default "Opaque" }}
stringData:
  {{- range $key, $value := .data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
