line:
  id: code-review-reply
  entry: read-review
  exit: done
  # gemini-cli gives a model 60 seconds to start answering (its global
  # `defaultHeadersTimeout`), and Gemini 3.1 Pro thinking over a whole diff often
  # takes longer: the call fails as "fetch failed sending request" and is retried
  # with the same context. The CLI reads this experiments file, named by GEMINI_EXP,
  # and flag 45773134 (DEFAULT_REQUEST_TIMEOUT) is that limit in seconds. The agent
  # runtime is to set this itself; this copy goes when it does.
  files:
    gemini_exp: '{"flags":[{"flagId":45773134,"intValue":"600"}]}'
  args:
    repo:
      kind: git
    pr_url:
      kind: value
    review_id:
      kind: value
    intent:
      kind: value
  nodes:
    - id: read-review
      station: read-review
    - id: reply
      station: code-review-refine
      bind:
        target: repo
        description: review_feedback
    - id: post-reply
      station: post-reply
    - id: done
  edges:
    - from: read-review
      to: reply
      on: success
    - from: read-review
      to: read-review
      on: failed
      iteration_max: 1
    - from: reply
      to: post-reply
      on: success
    - from: reply
      to: post-reply
      on: changes_requested
    - from: reply
      to: reply
      on: failed
      iteration_max: 1
    - from: post-reply
      to: done
      on: success
    - from: post-reply
      to: post-reply
      on: failed
      iteration_max: 1
stations:
  read-review:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: pr_url
        kind: value
      - name: review_id
        kind: value
      - name: intent
        kind: value
    produces:
      - name: review_feedback
        kind: value
  code-review-refine:
    kind: agent
    agent_definition: code-review-refine
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: description
        kind: value
      - name: issue
        kind: file
        path: issue.md
        optional: true
      - name: gemini_exp
        kind: file
        path: gemini-exp.json
    produces:
      - name: reply_output
        kind: file
        from: output
  post-reply:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: reply_output
        kind: file
      - name: pr_url
        kind: value
    produces:
      - name: reply_url
        kind: value
agent_definitions:
  code-review-refine:
    settings:
      model: gemini-3.1-pro-preview
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 20
      prices:
        gemini-3.1-pro-preview:
          input_per_million: 2
          output_per_million: 12
      config:
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
          GEMINI_EXP: /workspace/gemini-exp.json
      prompt: |
        {description}

        The PR branch is checked out at /workspace/target and the task line above
        states the intent and the thread. Do NOT use `gh` and do NOT touch the
        network (the pod has neither `gh` nor a GitHub token in the shell) — read
        and commit locally, and let Lore post your reply.
        - intent = address: implement the requested fix under /workspace/target
          and commit it to the checked-out PR branch, e.g.
          `git -C /workspace/target commit -am "<message>"`.
        - intent = answer: do NOT change code.
        The human's comment is quoted in the task above — act on that.

        Do NOT install dependencies or run builds or tests (`npm ci` and friends)
        — the pod has a 1Gi disk budget and exceeding it evicts the pod, taking
        your commit with it. Commit the change and let the PR's CI validate it.
        The pod's Bash hook refuses test, build and install commands outright.

        Emit your reply as a fenced block; Lore posts it in-thread for you:

        ```REVIEW_REPLY
        <short markdown reply>
        ```

        If the task does not state a concrete requested change and you cannot
        find one in the thread, do NOT guess or invent work: post one clarifying
        question in the review thread and output
        REVIEW_RESULT:CHANGES_REQUESTED:needs clarification.

        Then output exactly one of:
        - REVIEW_RESULT:APPROVED
        - REVIEW_RESULT:CHANGES_REQUESTED:<one-line summary of what remains>

        One thing above is different here. Nobody pushes your commit for you. When the intent is address, push it once it is committed:
        `git -C /workspace/target push origin HEAD`
        That one command may use the network, and git is already authenticated for this repository. Push nothing else, and never force. If the push is refused, say so in your reply and output REVIEW_RESULT:CHANGES_REQUESTED:the fix could not be pushed.

        `/workspace/issue.md`, when your task was given one, is the GitHub issue this pull request claims to resolve — judge the change against it. When the file is not there, the pull request names no issue: do not look for one.
