line:
  id: code-review-recheck
  entry: recheck
  exit: done
  args:
    repo:
      kind: git
    pr_url:
      kind: value
    # The subject: two re-checks of one sha are one run, while a re-check of a newer sha never joins the older one it supersedes.
    head_sha:
      kind: value
      subject: true
    description:
      kind: value
  nodes:
    - id: recheck
      station: code-review-recheck
      bind:
        target: repo
    - id: post-review
      station: post-review
    - id: done
  edges:
    - from: recheck
      to: post-review
      on: success
    - from: recheck
      to: post-review
      on: changes_requested
    - from: recheck
      to: recheck
      on: failed
      iteration_max: 1
    - from: post-review
      to: done
      on: success
    # A post that fails is usually an agent that ended without a verdict; posting again reads the same output, so the agent runs again instead.
    - from: post-review
      to: recheck
      on: failed
      iteration_max: 1
stations:
  code-review-recheck:
    description: An AI agent does a fast re-check of the commits pushed since the last review, confirming earlier concerns are resolved and flagging only new problems.
    kind: agent
    agent_definition: code-review-recheck
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    result_required: true
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: description
        kind: value
      - name: issue
        kind: file
        path: issue.md
        optional: true
    produces:
      - name: review_output
        kind: file
        from: output
  post-review:
    description: Posts the review agent's verdict and comments on the pull request on GitHub. If the agent ended without a verdict, it fails so the agent runs again.
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: review_output
        kind: file
      - name: pr_url
        kind: value
      - name: head_sha
        kind: value
        optional: true
      # The threads of Lore's findings the re-check was handed; an approval resolves them.
      - name: open_threads
        kind: value
        optional: true
    produces:
      - name: review_summary
        kind: value
      - name: review_url
        kind: value
