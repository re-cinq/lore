line:
  id: code-review-recheck
  entry: prepare
  exit: done
  args:
    repo: { kind: git }
    pr_url: { kind: value }
    head_sha: { kind: value, subject: true }
    description: { kind: value }
  nodes:
    - id: prepare
      station: prepare-code-review
    - id: tell-story
      station: review-story
    - id: publish-story
      station: code-review-progress
      bind: { revision: head_sha }
    - id: check-implementation
      station: review-implementation
    - id: check-issue
      station: review-issue
    - id: publish-checks
      station: code-review-docs-gate
      bind: { revision: head_sha }
    - id: check-docs
      station: review-docs
      bind: { target: repo }
    - id: finalize
      station: finalize-code-review
      bind: { revision: head_sha }
    - id: publish-incomplete
      station: code-review-progress
      bind: { revision: head_sha }
    - id: review-whole
      station: code-review-recheck
      bind: { target: repo }
    - id: post-review
      station: post-review
    - id: done
  edges:
    - { from: prepare, to: tell-story, on: success }
    - { from: prepare, to: publish-incomplete, on: failed }
    # A change the collector cannot split into code and tests (a binary, a file holding its own tests) is reviewed whole.
    - { from: prepare, to: review-whole, on: whole_diff }
    # A commit that is no longer the pull request head is reviewed by the run of the newer one.
    - { from: prepare, to: done, on: superseded }
    # A pull request of Markdown alone has no story: its statements go to the documents check, and one that moves only links is approved without an agent.
    - { from: prepare, to: check-docs, on: docs_only }
    - { from: prepare, to: finalize, on: links_only }
    - { from: post-review, to: done, on: superseded }
    - { from: review-whole, to: post-review, on: success }
    - { from: review-whole, to: post-review, on: changes_requested }
    - { from: review-whole, to: review-whole, on: failed, iteration_max: 1 }
    - { from: tell-story, to: publish-story, on: success }
    - { from: publish-story, to: check-implementation, on: success }
    - { from: check-implementation, to: check-issue, on: success }
    - { from: check-issue, to: publish-checks, on: success }
    # The documents check runs only for a pull request that writes or removes a statement in its Markdown.
    - { from: publish-checks, to: finalize, on: success }
    - { from: publish-checks, to: check-docs, on: docs }
    - { from: check-docs, to: finalize, on: success }
    - { from: finalize, to: post-review, on: success }
    - { from: post-review, to: done, on: success }
    # A post that fails is usually a review without a verdict; posting again reads the same output, so the whole-diff reviewer writes one.
    - { from: post-review, to: review-whole, on: failed, iteration_max: 1 }
    - { from: tell-story, to: publish-incomplete, on: failed }
    - { from: publish-story, to: publish-incomplete, on: failed }
    - { from: check-implementation, to: publish-incomplete, on: failed }
    - { from: check-issue, to: publish-incomplete, on: failed }
    - { from: publish-checks, to: publish-incomplete, on: failed }
    - { from: check-docs, to: publish-incomplete, on: failed }
    - { from: finalize, to: publish-incomplete, on: failed }
    # A review the story could not finish is still owed: the whole-diff reviewer gives it.
    - { from: publish-incomplete, to: review-whole, on: always }
stations:
  review-story:
    description: Tells the story the tests tell, one behaviour per assertion.
    kind: agent
    agent_definition: review-story
    conversation: new
    result_required: true
    outcomes: [success, failed]
    needs:
      - { name: test_evidence, kind: file, path: tests.json }
    produces:
      - { name: story, kind: file, from: output }
  review-implementation:
    description: Checks the implementation against the story and reports every gap with a proposed change.
    kind: agent
    agent_definition: review-implementation
    conversation: new
    result_required: true
    outcomes: [success, failed]
    needs:
      - { name: story, kind: file, path: story.txt }
      - { name: code_evidence, kind: file, path: code.json }
      - { name: test_evidence, kind: file, path: tests.json }
    produces:
      - { name: implementation_check, kind: file, from: output }
  review-issue:
    description: Checks what the issue, the discussion and the specs require against the story and reports every gap with a proposed change.
    kind: agent
    agent_definition: review-issue
    conversation: new
    result_required: true
    outcomes: [success, failed]
    needs:
      - { name: story, kind: file, path: story.txt }
      - { name: implementation_check, kind: file, path: implementation-check.txt }
      - { name: issue_evidence, kind: file, path: issue.json }
      - { name: code_evidence, kind: file, path: code.json }
      - { name: test_evidence, kind: file, path: tests.json }
    produces:
      - { name: issue_check, kind: file, from: output }
  review-docs:
    description: Checks each statement the pull request writes in its Markdown against the tests it links and against the code.
    kind: agent
    agent_definition: review-docs
    conversation: new
    result_required: true
    outcomes: [success, failed]
    needs:
      - { name: docs_evidence, kind: file, path: docs.json }
      - { name: target, kind: git, path: target, access: read }
    produces:
      - { name: docs_check, kind: file, from: output }
  code-review-recheck:
    description: An AI agent re-checks the commits pushed since the last review from the whole diff, when the story review cannot be given.
    kind: agent
    agent_definition: code-review-recheck
    conversation: new
    result_required: true
    outcomes: [success, changes_requested, failed]
    needs:
      - { name: target, kind: git, path: target, access: read }
      - { name: description, kind: value }
      - { name: issue, kind: file, path: issue.md, optional: true }
    produces:
      - { name: review_output, kind: file, from: output }
  code-review-progress:
    description: Updates the review comment for this pull request revision with the story and the gaps found so far.
    kind: service
    outcomes: [success, failed]
    needs:
      - { name: revision, kind: value }
      - { name: pr_url, kind: value, optional: true }
      - { name: preparation_failed, kind: value, optional: true }
      - { name: review_mode, kind: value, optional: true }
      - { name: story, kind: file, optional: true }
      - { name: implementation_check, kind: file, optional: true }
      - { name: issue_check, kind: file, optional: true }
      - { name: docs_check, kind: file, optional: true }
    produces: []
  code-review-docs-gate:
    description: Updates the review comment with what both checks found, and sends a pull request that changes documents to the documents check.
    kind: service
    outcomes: [success, docs, failed]
    needs:
      - { name: revision, kind: value }
      - { name: pr_url, kind: value, optional: true }
      - { name: docs_changed, kind: value, optional: true }
      - { name: story, kind: file }
      - { name: implementation_check, kind: file }
      - { name: issue_check, kind: file }
    produces: []
  prepare-code-review:
    description: Collects the tests, the code, the issue and the changed documents of the pull request revision as four packets.
    kind: service
    outcomes: [success, docs_only, links_only, whole_diff, superseded, failed]
    needs:
      - { name: pr_url, kind: value }
      - { name: head_sha, kind: value }
      - { name: previous_findings, kind: value, optional: true }
    produces:
      - { name: test_evidence, kind: file }
      - { name: code_evidence, kind: file }
      - { name: issue_evidence, kind: file }
      - { name: docs_evidence, kind: file }
      - { name: review_mode, kind: value }
      - { name: docs_changed, kind: value }
  finalize-code-review:
    description: Checks that every pass of the review is complete and produces the formal review for GitHub, changes requested for any gap that blocks.
    kind: service
    outcomes: [success, failed]
    needs:
      - { name: pr_url, kind: value }
      - { name: revision, kind: value }
      - { name: review_mode, kind: value, optional: true }
      - { name: story, kind: file, optional: true }
      - { name: implementation_check, kind: file, optional: true }
      - { name: issue_check, kind: file, optional: true }
      - { name: docs_check, kind: file, optional: true }
    produces:
      - { name: review_output, kind: file }
      - { name: review_run, kind: value }
  post-review:
    description: Posts the review agent's verdict and comments on the pull request on GitHub. If the agent ended without a verdict, it fails so the agent runs again.
    kind: service
    outcomes:
      - success
      - superseded
      - failed
    needs:
      - { name: review_run, kind: value, optional: true }
      - name: review_output
        kind: file
      - name: pr_url
        kind: value
      - name: head_sha
        kind: value
        optional: true
      # The threads of Lore's findings the re-check was handed; an approval resolves them.
      - name: open_threads
        kind: value
        optional: true
    produces:
      - name: review_summary
        kind: value
      - name: review_url
        kind: value
