# The auto-merge loop (specs/protected-branch-merge): one run per pull request code
# review has passed. It waits until the pull request is green, every review thread
# is resolved, Lore's review stands approved on its head and it has been open long
# enough; then it approves and hands the merge to GitHub, or merges itself where no
# rule asks for an approval. It fixes nothing on the way: a pull request that is
# red, conflicted or behind is the business of the loop that opened it, which
# rebases and repairs it on the pull request's own events; this loop only waits.
line:
  id: auto-merge
  entry: await-merge
  exit: done
  args:
    repo:
      kind: git
    # One run per pull request: the loop starts it again only after a run ends.
    pr_url:
      kind: value
      subject: true
    # The head commit the run was started for: the loop takes a pull request
    # again only once its head moved past every run that worked it.
    head_sha:
      kind: value
  nodes:
    - id: await-merge
      station: auto-merge-await
      route: "{args.pr_url}"
    - id: approve
      station: auto-merge-approve
    - id: done
  edges:
    - from: await-merge
      to: approve
      on: success
    # The pull request was closed, or cannot be judged: nothing to merge.
    - from: await-merge
      to: done
      on: failed
    - from: approve
      to: done
      on: success
    - from: approve
      to: done
      on: failed
stations:
  auto-merge-await:
    description: Waits on the pull request until CI is green, no review thread is open, Lore's review stands approved on its head and it has been open long enough. Red CI, a conflict or an open thread is waited out, never fixed here.
    kind: human
    outcomes:
      - success
      - failed
    needs:
      - name: head_sha
        kind: value
    produces: []
  auto-merge-approve:
    description: Approves the pull request and arms GitHub's auto-merge where the branch rule asks for an approval, or merges it where it asks for none; a pull request touching a code owner's path, or one only Lore's own App could approve, is left for a person.
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: pr_url
        kind: value
    produces:
      - name: merge_state
        kind: value
      - name: merge_blocked
        kind: value
