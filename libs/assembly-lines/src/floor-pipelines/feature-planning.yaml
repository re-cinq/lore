line:
  id: feature-planning
  entry: analyze
  exit: done
  args:
    repo:
      kind: git
    plan_id:
      kind: value
      subject: true
    # The repository at its default branch. What runs after the spec PR merges
    # reads the merged spec, and the spec branch is gone by then: a git item
    # carrying no sha clones the branch as it stands when the visit opens.
    base:
      kind: git
  nodes:
    - id: analyze
      station: plan-analyze
      bind:
        target: repo
    # Not a review: every pass settles here before the author waits again, so a
    # Refine round that died tells its person rather than leaving them watching a
    # plan that will never answer. See the plan-pass-end station.
    - id: plan-pass-end
      station: plan-pass-end
    - id: author
      station: plan-author
    # No inbound edge — the plan page's own Validate button fires this event while
    # the line waits on `author`; every outcome hands straight back to the author.
    - id: validate
      station: plan-validate
      start: manual.plan.validate
      bind:
        target: repo
    - id: analyse-specs
      station: spec-analysis
      bind:
        target: repo
    - id: write
      station: spec-write
      bind:
        target: repo
    - id: open-spec-pr
      station: open-spec-pr
      bind:
        target: repo
    # The station IS the GitHub PR view, a page this platform does not own — the
    # route is absolute, and it resolves only once open-spec-pr has stamped pr_url.
    # No `reports:` block: Lore's own webhook code posts station_run.reported for a
    # PR close/merge explicitly, the same way it already handles the review lines,
    # so that mapping stays out of the floor's generic event matcher.
    - id: merged
      station: spec-pr-merged
      route: "{args.pr_url}"
    # Reads the merged spec, so it clones the base branch: after the merge the
    # spec branch may be deleted, and what it held is on the base anyway.
    - id: decompose
      station: feature-decompose
      bind:
        target: base
    - id: issues
      station: issues
      bind:
        target: base
    - id: done
  edges:
    - from: analyze
      to: plan-pass-end
      on: success
    # An agent visit can produce this outcome, so the graph must route it; planning
    # asks for no review, so it settles exactly as success does.
    - from: analyze
      to: plan-pass-end
      on: changes_requested
    # A pass that died — a crashed pod, a non-zero exit, a timeout — hands the plan
    # back to its people rather than retrying on its own. Every pass is asked for by
    # a person (the first draft, Regenerate, each Refine), so there is no runaway to
    # bound: the page names the failure and they ask again. plan-pass-end is what
    # tells a Refine's person their round died, before the author waits again.
    - from: analyze
      to: plan-pass-end
      on: failed
    # Every one of analyze's outcomes reaches here; plan-pass-end reports only
    # success or failed of its own (posting the Refine-failure notice, or not), and
    # either way the plan waits on its author next.
    - from: plan-pass-end
      to: author
      on: always
    # Unbounded on purpose. The back-edge rule exists to stop two agents arguing
    # forever; here a person decides each pass, so there is no runaway to bound — and
    # any number picked would silently kill a feature that needed one more round.
    # `author` is a human station, which is what makes this cycle a guarded one.
    - from: author
      to: analyze
      on: changes_requested
    - from: author
      to: analyse-specs
      on: success
    # The author walked away, or the feature was closed. Not a failure of the
    # machine, so it settles rather than erroring — but it must be routed either
    # way, since a station's outcome always needs an edge out.
    - from: author
      to: done
      on: failed
    # Validate reports only `success` in practice (the findings are the delivery,
    # not the outcome) but a pod can still fail outright, so `always` catches both
    # and hands the plan straight back to the people reading it.
    - from: validate
      to: author
      on: always
    - from: analyse-specs
      to: write
      on: success
    # analyse-specs has no upstream NODE — its input is a plan a PERSON accepted, so
    # a question about that plan can only be answered by that person.
    - from: analyse-specs
      to: author
      on: changes_requested
    - from: analyse-specs
      to: done
      on: failed
    - from: write
      to: open-spec-pr
      on: success
    # The change set was unusable — a spec path that does not exist, or an
    # instruction to amend a spec that does not cover the area. One correction:
    # unlike the author's loop, which is unbounded because a person decides each
    # pass, two agents disagreeing without a referee will do so all day.
    - from: write
      to: analyse-specs
      on: changes_requested
      iteration_max: 1
    - from: write
      to: done
      on: failed
    - from: open-spec-pr
      to: merged
      on: success
    - from: open-spec-pr
      to: done
      on: failed
    - from: merged
      to: decompose
      on: success
    # A reviewer asked for changes on the spec PR — the same shape as the spec
    # analysis having a question: an objection to a plan a PERSON accepted,
    # answerable only by that person. Unbounded like the author's own loop, and
    # legal without iteration_max because BOTH ends are human stations: leaving one
    # a person has just decided, entering one a person decides before anything else
    # runs. Two agents still cannot argue forever through it.
    - from: merged
      to: author
      on: changes_requested
    # The PR was closed without merging — abandoned or superseded. Not a failure of
    # the machine, so it settles rather than erroring, but it must be routed either
    # way.
    - from: merged
      to: done
      on: failed
    - from: decompose
      to: issues
      on: success
    # decompose has no upstream NODE — its input is a spec a human merged. A spec it
    # cannot break down is a question for the author, not something to re-run, so
    # the line ends rather than looping.
    - from: decompose
      to: done
      on: changes_requested
    - from: decompose
      to: done
      on: failed
    - from: issues
      to: done
      on: success
    # The station is the first thing to read the decomposition as DATA, so it is
    # where a label the repo does not have, or a story with no tasks, actually
    # shows. One correction, then the budget is exhausted and the line fails.
    - from: issues
      to: decompose
      on: changes_requested
      iteration_max: 1
    - from: issues
      to: done
      on: failed
stations:
  plan-analyze:
    kind: agent
    agent_definition: plan-analyze
    # Each Refine continues the previous round's conversation for the SAME plan, so
    # the agent keeps what it read and decided instead of being re-briefed.
    conversation: continue
    conversation_key: plan_id
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: plan_id
        kind: value
      # What THIS round asks for: the first draft's brief with what its author
      # already knows, or the one section a Refine names. Reading the plan cannot
      # tell the agent which of its sections a person just asked about.
      - name: description
        kind: value
        optional: true
    produces: []
  plan-author:
    kind: human
    outcomes:
      - success
      - changes_requested
      - failed
    needs: []
    produces:
      - name: plan_md
        kind: file
      # Written only on a changes_requested report — the person clicked Refine on
      # one section, naming it and the hash they read it at. plan-pass-end reads it
      # back on the analyze pass it asks for.
      - name: refine
        kind: value
      # What the round this report asks for is for: the Refine's section, or the
      # draft's own brief. The agent is told, rather than having to guess from the
      # plan which section a person just clicked.
      - name: description
        kind: value
  plan-pass-end:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: plan_id
        kind: value
      # Present only on a Refine round — the person who clicked Refine on the plan
      # page produced it when `author` answered changes_requested; a first draft
      # has none.
      - name: refine
        kind: value
        optional: true
    produces: []
  plan-validate:
    kind: agent
    agent_definition: plan-validate
    outcomes:
      - success
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      # The plan is read live through lore_plan_read, not from a file: a person
      # clicks Validate after editing, and the bag's plan.md is only as fresh as
      # the last Draft, Refine or approval. A hand-started node cannot be handed a
      # new blob, so a snapshot here would validate text nobody is looking at.
      - name: plan_id
        kind: value
    produces:
      - name: plan_validation
        kind: file
        path: plan-validation.json
  spec-analysis:
    kind: agent
    agent_definition: spec-analysis
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: plan_md
        kind: file
        path: plan.md
      # Which spec pass this is: the first one, or an amendment to specs an
      # earlier pass already merged or left open on this branch.
      - name: description
        kind: value
        optional: true
    produces:
      - name: spec_plan
        kind: file
        path: spec-plan.json
  spec-write:
    kind: agent
    agent_definition: spec-write
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      # Write access needs a human on every path in — here `author` precedes this
      # node on every route (through `analyse-specs`), so the cycle/need-graph rule
      # is satisfied without this node ever being the first writer.
      - name: target
        kind: git
        path: target
        access: write
      - name: plan_md
        kind: file
        path: plan.md
      - name: spec_plan
        kind: file
        path: spec-plan.json
    produces:
      - name: spec_review
        kind: file
        path: spec-review-result.json
  open-spec-pr:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      # The pull request is titled after the plan, as every spec PR opened by hand
      # was; the branch name is the fallback, not the intent.
      - name: plan_title
        kind: value
        optional: true
    produces:
      - name: pr_url
        kind: value
  spec-pr-merged:
    kind: human
    outcomes:
      - success
      - changes_requested
      - failed
    needs: []
    produces: []
  feature-decompose:
    kind: agent
    agent_definition: feature-decompose
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
    produces:
      - name: decomposition
        kind: file
        path: decomposition.json
  issues:
    kind: service
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: decomposition
        kind: file
      # For the spec_path it derives — the decomposition names stories and tasks,
      # not which spec they belong to; that is spec-plan.json's creates/updates.
      - name: spec_plan
        kind: file
      - name: plan_id
        kind: value
      - name: plan_title
        kind: value
        optional: true
    produces: []
agent_definitions:
  plan-analyze:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        # CPU and memory are what a floor agent pod gets when nothing is set (seen 2026-09-30); only the disk is raised, from 1Gi, for the clone.
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
      prompt: |
        You are a senior software architect drafting a PLAN together with the
        people who asked for it. The plan is a shared document: people are
        reading and writing it while you work, and what you write lands in it
        for them to see.

        Your job is REQUIREMENTS ELICITATION AND GAP-CLOSING: say what the
        change is for, how success is measured, what it touches in THIS
        codebase and what it deliberately leaves alone, and ask about
        everything only a person can decide. You are writing a plan, not a
        task list: a later step turns the approved plan into specs, and
        another into tasks. Do not size, sequence or split work.

        ## Gather before you write

        Ground every statement in what the organisation already knows. Before
        you touch the plan, use the Lore MCP tools. Pass `repo` (the
        owner/name your task names above) on every `lore_*` call: the gateway
        has no checkout to detect it from.

        1. `lore_assemble_context` with the plan's subject — conventions,
           ADRs, memories and facts in one call. Always first.
        2. `lore_query_graph` — the knowledge graph of services, teams and
           technologies and how they relate. Query it for everything the plan
           touches: who runs it, what depends on it, what it depends on. This
           is where *Who operates it*, *Constraints*, *Delivery implications*
           and *What could break* come from — never guess them.
        3. `query_trace` — the spec traceability graph: the specs and tests
           that already cover the area, so the plan names what it changes.
        4. `lore_search_context` and `lore_search_memory` — earlier decisions
           and what previous work learned. Search with more than one
           phrasing.

        Then read the repository, checked out read-only at /workspace/target:
        search it by the plan's domain terms and read the specs and ADRs that
        own the area. A plan that names the real services, teams and modules
        it touches is worth ten that do not. Name the entity or file each
        claim rests on. When the graph and the repository have nothing, ask
        (below) instead of inventing.

        For a Refine, gather for that section's subject, and for anything a
        settled answer you are working in touches elsewhere in the plan.

        ## Your deliverable: the live plan {plan_id}

        The plan you work on is `{plan_id}`. You change it only through the
        two plan tools below; the live plan is what people see and edit
        while you work, and it is the whole deliverable: nothing you print
        is read.

        Start with `lore_plan_read {plan_id}`: it returns every section as
        `{slot, title, blocks}`, each block as `{id, type, hash, text,
        props}`. Read it before your first edit and again whenever an edit is
        refused.

        Edit with `lore_plan_edit {plan_id, op, expect}`: one op per call, in
        reading order, so people watch the plan take shape and can edit
        beside you. Every op names its section by `slot` (`intent`, `kpis`,
        `scope`, …, `questions` — the slots the read returned). For
        `replace-block` and `remove-block` pass `expect: {blockId, hash}`
        from your latest read. A refused edit means a person changed that
        block since you read it: read the plan again, keep their words, and
        continue from there.

        Rule: never touch the conversation — question, answer, comment and
        finding blocks are people's. You add questions with `add-question`
        and never remove or edit one, answered or not. Answers and resolved
        comments are settled decisions: write them into the section's prose.
        Unanswered questions and open threads are people still talking:
        leave them alone.

        Never overwrite what people wrote. Extend their text, and replace or
        remove a block only when it is empty or holds only your own earlier
        words.

        The op catalogue (every op is one JSON object with its `op` name):

        - `append-to-section` `{slot, paragraphs: ["…"]}` — adds plain
          paragraphs at the end of a section. The usual way to extend a
          section.
        - `insert-blocks` `{slot, after: blockId | null, blocks: [block]}` —
          adds structured blocks after a block (`null`: at the top of the
          section).
        - `replace-block` `{slot, blockId, block}` / `remove-block` `{slot,
          blockId}` — one block, with `expect`.
        - `set-section-text` `{slot, paragraphs: ["…"]}` / `set-section-prose`
          `{slot, blocks: [block]}` — replace a section's whole prose. Only
          for a section that is empty or holds only your own earlier words;
          the section's questions and KPIs stay.
        - A `paragraphs` entry is plain text: Markdown in it is shown
          literally. For structure write `block`s: `{"type":
          "paragraph"|"quote", "content": inline}`, `{"type": "heading",
          "content": inline}` (a subheading inside the section), `{"type":
          "bulletListItem"|"numberedListItem"|"checkListItem", "content":
          inline, "children": [block]}`, `{"type": "codeBlock", "language":
          "…", "content": inline}`, `{"type": "table", "rows": [[inline]]}`.
          `inline` is a list of `{"type": "text", "text": "…", "styles":
          {"bold": true}}` (styles `bold`, `italic`, `code`) and `{"type":
          "link", "href": "…", "content": [text]}`.
        - `upsert-kpi` `{kpi: {"kpiId": "k-…", "metric": "…", "baseline":
          "…", "target": "…", "direction": "up|down|hold", "deadline": "…",
          "rationale": "…"}}` — one KPI per call, into `kpis`. Keep a KPI's
          `kpiId` when you revise it; give a new KPI a fresh `kpiId`.
        - `set-prototype` `{prototype: {"maturity":
          "none|click-dummy|running-prototype|pre-prod", "url": "",
          "agreedBy": "", "notes": ""}}`.
        - `add-question` `{slot, "questionId": "q-…", "question": "…",
          "why": "…"}`, optionally `"kind": "choice"` with `"options": ["…",
          "…"]` — ask what only a person can decide, in the section it
          belongs to, with a fresh `questionId`. Suggest the answer you would
          pick in `why`. Target the `questions` slot (Open questions) only
          when it belongs to no other section. That section holds only
          questions: never a list, a paragraph, or a copy of a question
          asked elsewhere.
        - `add-section` `{slot: "custom-…", title, after: slot, paragraphs}`
          — a section the template lacks, placed after the section it
          follows, under a fresh slot that starts with `custom-`.
          `set-section-title` `{slot: "custom-…", title}` retitles a section
          you added. Never remove a section, and never retitle a template
          one.

        On a Refine round, edit the section this round's brief names as
        asked; change another section only where a settled answer you are
        working with makes what it says wrong.

        When you are done, stop: every edit is already in the live plan.
        End your final message with the line
        `LORE_NODE_RESULT: {"outcome":"success"}`.

        ## This round

        {description}
  plan-validate:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
      prompt: |
        You validate a feature plan BEFORE its people approve it. You are not
        the author and not the approver: you read the plan and report every
        contradiction and gap you find as findings. You never fix anything
        yourself.

        Read the plan with `lore_plan_read {plan_id}` — it is a live document
        and people edit it while you work, so read it yourself rather than
        trusting any copy. Then read this repository's `specs/`, `adrs/`,
        `CLAUDE.md`, and any code or file the plan names, from the read-only
        clone at /workspace/target, so you can tell a claim that holds from one
        that doesn't. Call
        `lore_assemble_context` first, and `lore_search_memory` for prior
        decisions the plan may be repeating or contradicting. Pass `repo`
        (the owner/name your task names above) on every `lore_*` call: the
        gateway has no checkout to detect it from.

        Never edit the plan. Never edit the repository. Your only output is
        the findings file below.

        ## What to report

        Walk the plan section by section — each `## ` heading carries a
        `<!-- slot:… -->` marker; use it to place your finding.

        **INCONSISTENCY** — two statements of the plan disagree with each
        other, or a plan claim that this repository or one of its specs
        contradicts. Example: the plan says a public API answers a question
        that in fact asks for a credential.

        **INCOMPLETENESS** — check this fixed list against every section:
        - every fixed piece of text the plan promises (a label, a message)
          names its strings;
        - every new wire or protocol entry, every new message, names its
          fields;
        - every new store names retention and erasure;
        - every claim of "verified" names what it was verified against;
        - every dependency on other work names its issue;
        - every KPI names where its number comes from.

        **INFEASIBILITY** — a mechanism the plan relies on that this
        repository does not have, and that the plan does not say it builds:
        a node type, an edge outcome, a station or human-station type, a
        task type, a label, a table, a route, a handler, a file. Check each
        one in the code, not by its name — search for it. When the plan adds
        or changes an assembly line, walk `.lore/assembly-line-guide.md`
        item by item: every item the plan needs is either present in the
        repository or named in the plan as work to do. Example: the plan
        routes an agent node on an `obsolete` outcome, but agent nodes only
        produce success, changes_requested or failed.

        ## Severity

        `blocker` — a contradiction, a missing definition the spec cannot be
        written without, or an INFEASIBILITY.
        `warning` — everything else worth flagging.

        ## Standing findings

        Earlier findings appear inside the plan as:

            > **Finding** (<id>, <severity>[, resolved]): text — why

        If one still stands, report it again by its id (`finding_id`), so
        the reviewer sees it did not go away. Omit one that is now fixed.
        Never repeat one already marked `resolved`.

        ## Your deliverable

        The file `plan-validation.json`, written to the current directory:

            {
              "findings": [
                {
                  "slot": string,
                  "finding_id": string,  // only when re-reporting a standing finding
                  "text": string,        // one sentence a reviewer acts on
                  "why": string,         // the evidence: which plan lines or repo files disagree
                  "severity": "blocker" | "warning"
                }
              ]
            }

        Write `{"findings": []}` when the plan is clean. After EVERY write,
        validate it:

            node -e 'JSON.parse(require("fs").readFileSync("plan-validation.json"))'

        (jq is not installed in this pod.) If it throws, fix the file and
        re-run until it exits silently.

        ## Sending it back

        Print exactly this as your LAST line:

            LORE_NODE_RESULT: {"outcome":"success"}

        The findings are the delivery, not the outcome — this line always
        reports success, whether the plan is clean or you reported ten
        blockers.
  spec-analysis:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
      prompt: |
        You decide WHICH SPECIFICATIONS a newly accepted feature plan
        changes, and how. You do not write them — a later step does that
        from your answer.

        ## This pass

        {description}

        The accepted plan is at `{plan_md_path}`. It was settled with its
        author over one or more planning rounds and is now ACCEPTED. Its
        `<!-- slot:… -->` markers and `>` quotes are the planning tool's
        bookkeeping; read past them. Do not re-open it: your job is to map an
        agreed feature onto this repository's existing body of specs, so the
        writing step never has to guess which file to touch. The repository
        is checked out read-only at /workspace/target. Call
        `lore_assemble_context` first. Pass `repo` (the owner/name your task
        names above) on every `lore_*` call: the gateway has no checkout to
        detect it from.

        ## Your deliverable

        The file `spec-plan.json`, written to the current directory. Nothing
        you print is read except the outcome line below; the FILE is the
        deliverable, and a run that ends without a valid one has failed.

        After EVERY write, run:

            jq empty spec-plan.json

        If it prints anything the file is invalid — fix it and re-run until
        it exits silently.

        ## How to work

        PHASE 1 — ORIENT. Read `.lore/spec-standard.md` if this repository
        has one: it is the authority on how a spec here is written, and
        everything you propose must fit it. If there is no such file, infer
        the conventions from the specs that already exist and say so in
        "standard". Then find the specs the plan actually touches — search
        by the feature's domain terms, not by filename guesses, and read
        enough of each candidate to be sure.

        PHASE 2 — DELIVER. Write `spec-plan.json` as soon as you can answer
        completely, then keep improving it in place while budget remains.

        ## The shape of spec-plan.json

        {
          "standard": string,
          "updates": [
            { "path": string, "reason": string,
              "statements": [string], "guidance": string }
          ],
          "creates": [
            { "path": string, "title": string, "reason": string,
              "outline": [string], "guidance": string,
              "artifacts": ["spec", "plan", "tasks"] }
          ],
          "adrs": [ { "path": string, "decision": string, "why_now": string } ],
          "considered": [ { "path": string, "why_not": string } ],
          "summary": string
        }

        - "updates" — an EXISTING spec this feature changes. Name the file by
          its real path, and in "statements" quote or identify the specific
          statements that must change, so the writing step edits a known
          place instead of rewriting a document. "guidance" says what the
          change must convey, and names which of the plan's Constraints,
          KPIs and Open questions land in this file — the writing step works
          from your routing, so a plan item no entry claims is a plan item
          that gets dropped.
        - "creates" — a feature that has no spec yet. Propose a DIRECTORY,
          `specs/<slug>/`, as "path": the writing step fills the
          repository's templates (`.specify/templates/`) into the artifact
          set there — spec.md, plan.md, tasks.md. "artifacts" names which of
          the three this feature needs; leave it out for a new feature,
          which gets all three. Give an "outline" of spec.md's headings, and
          name in "guidance" which of the plan's Constraints, KPIs and Open
          questions land in this feature, exactly as an "updates" entry
          would — the mechanism detail (trigger wiring, data model, line
          graph with failure edges, gating, state/label taxonomy) lands in
          the feature's plan.md, the success criteria (`SC-nnn`, from the
          plan's KPIs) and Open Questions in its spec.md, so say which is
          which when it is not obvious. Create a new feature dir only when
          the feature genuinely has no home; extending the spec that already
          owns the area is almost always right, and a repo full of thin
          overlapping specs is worse than a few thorough ones.
        - "adrs" — include an entry ONLY when the plan settles an
          architectural DECISION with a trade-off worth recording (a new
          dependency, a protocol, a boundary moved). A feature that merely
          uses the existing architecture needs no ADR, and proposing one for
          every feature makes the record worthless.
        - "considered" — specs a reader would EXPECT on this list that you
          deliberately left off, with the reason. Keep it short; this is
          evidence you looked, not a place to list the repository.
        - "summary" — two or three sentences a reviewer can read in the PR
          body.

        At least one of "updates" or "creates" MUST be non-empty. A feature
        that changes no specification at all is a finding, not an empty
        answer — report it by requesting changes.

        ## Sending it back

        Print exactly one of these as your LAST line:

            LORE_NODE_RESULT: {"outcome": "success"}
            LORE_NODE_RESULT: {"outcome": "changes_requested"}

        Request changes when the plan cannot be mapped as it stands — it
        contradicts an existing spec or ADR, it is ambiguous in a way that
        changes WHICH spec is touched, or it needs a decision only the
        author can make. Say why in "summary": the author reads it and
        answers in another planning round, so a concrete question costs one
        round while a vague objection costs several. Do NOT request changes
        merely because the plan is large or you are unsure how to word a
        spec — those are the writing step's problem, not a reason to stop.
