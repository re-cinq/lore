        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
  spec-analysis:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
  spec-write:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
