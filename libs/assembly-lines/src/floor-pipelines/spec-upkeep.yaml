# A repository's weekly spec upkeep (specs/external-floor FR14, specs/spec-test-coverage).
# Two stations read the traceability graph: one finds statements that drifted
# from the code, one finds testable statements no test is linked to. One agent
# fixes the drift first and adds the links second, as two commits, and Lore
# opens one pull request. The run then waits for that pull request's CI, sends
# a red build back to an agent at most twice, and asks the code-review line for
# a review. It never merges.
#
# Started per repository by the stations service's weekly tick, keyed on the
# run's day. When both detectors find nothing the run ends before the agent:
# no branch, no pod, no pull request.
line:
  id: spec-upkeep
  entry: detect-drift
  exit: done
  args:
    repo:
      kind: git
    upkeep:
      kind: value
      subject: true
  nodes:
    - id: detect-drift
      station: spec-upkeep-detect-drift
      bind:
        target: repo
    - id: detect-unlinked
      station: spec-upkeep-detect-unlinked
      bind:
        target: repo
    - id: update-specs
      station: spec-upkeep-update-specs
      bind:
        target: repo
    - id: open-pr
      station: spec-upkeep-open-pr
      bind:
        target: repo
    # Nobody answers this by hand: Lore's pr-ready-check sweep reads the build
    # and reports to the visit once CI has a verdict.
    - id: await-ci
      station: spec-upkeep-await-ci
      route: "{args.pr_url}"
    - id: fix-ci
      station: spec-upkeep-fix-ci
      bind:
        target: repo
    - id: request-review
      station: spec-upkeep-request-review
    - id: done
  edges:
    - from: detect-drift
      to: detect-unlinked
      on: success
    - from: detect-drift
      to: detect-drift
      on: failed
      iteration_max: 1
    - from: detect-unlinked
      to: update-specs
      on: success
    # Neither detector found anything: the specs need nothing this week.
    - from: detect-unlinked
      to: done
      on: nothing
    - from: detect-unlinked
      to: detect-unlinked
      on: failed
      iteration_max: 1
    - from: update-specs
      to: open-pr
      on: success
    # The agent acted on nothing. open-pr then finds no commit on the branch
    # and ends the run; the two are one path so there is one place that decides.
    - from: update-specs
      to: open-pr
      on: changes_requested
    - from: update-specs
      to: update-specs
      on: failed
      iteration_max: 1
    - from: open-pr
      to: await-ci
      on: success
    - from: open-pr
      to: done
      on: nothing
    - from: open-pr
      to: open-pr
      on: failed
      iteration_max: 1
    - from: await-ci
      to: request-review
      on: success
    # A red build, and a red build on a sha already reported red: both go to
    # fix-ci, twice at most each. The CI link check is the judge of the links.
    - from: await-ci
      to: fix-ci
      on: changes_requested
      iteration_max: 2
    - from: await-ci
      to: fix-ci
      on: failed
      iteration_max: 2
    - from: fix-ci
      to: await-ci
      on: success
    - from: fix-ci
      to: await-ci
      on: changes_requested
    - from: fix-ci
      to: fix-ci
      on: failed
      iteration_max: 1
    - from: request-review
      to: done
      on: success
    - from: request-review
      to: request-review
      on: failed
      iteration_max: 1
stations:
  spec-upkeep-detect-drift:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
    produces:
      - name: drift
        kind: file
      - name: drift_count
        kind: value
  spec-upkeep-detect-unlinked:
    kind: service
    outcomes:
      - success
      - nothing
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: drift_count
        kind: value
    produces:
      - name: unlinked
        kind: file
      - name: unlinked_count
        kind: value
  spec-upkeep-update-specs:
    kind: agent
    agent_definition: spec-upkeep-update-specs
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: drift
        kind: file
        path: drift.md
      - name: unlinked
        kind: file
        path: unlinked.md
    produces:
      - name: pr_body
        kind: file
        path: pr-body.md
  spec-upkeep-open-pr:
    kind: service
    outcomes:
      - success
      - nothing
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      # Absent when the agent wrote no description.
      - name: pr_body
        kind: file
        optional: true
    produces:
      - name: pr_url
        kind: value
  spec-upkeep-await-ci:
    kind: human
    outcomes:
      - success
      - changes_requested
      - failed
    needs: []
    # Written only on a red report: the sha the build judged, the checks that
    # failed and what they printed, and the same as one file for the repair.
    produces:
      - name: ci_feedback_sha
        kind: value
      - name: ci_failed_checks
        kind: value
      - name: ci_failure_summary
        kind: value
      - name: round_brief
        kind: file
  spec-upkeep-fix-ci:
    kind: agent
    agent_definition: spec-upkeep-fix-ci
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: round_brief
        kind: file
        path: round-brief.md
        optional: true
    produces:
      - name: ci_fixed
        kind: value
      - name: ci_blocked
        kind: value
  spec-upkeep-request-review:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: pr_url
        kind: value
    produces: []
agent_definitions:
  spec-upkeep-update-specs:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 30
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        env:
          LORE_TEST_POLICY: none
      prompt: |
        You keep this repository's specifications true. Two lists were prepared
        for you from the traceability graph, and your whole job is to work through
        them, in order, changing SPECIFICATION FILES ONLY.

        The branch is checked out with write access at /workspace/target. Run every
        command from inside it (`cd /workspace/target` first). Pass `repo` (the
        owner/name your task names above) on every `lore_*` call: the gateway has
        no checkout to detect it from.

        NEVER change code, tests, build files or workflows. If a list entry can
        only be made true by changing code, leave the spec as it is and say so in
        the pull request description.

        ## Part 1: drifted statements, at `{drift_path}`

        Each entry names a spec, a statement, why it is listed, and the tests bound
        to it. A statement is listed because a test bound to it fails, or because
        the code it describes changed under it.

        For each statement:
        1. Open the spec at that statement, the bound test, and the code the test
           exercises.
        2. Decide which one is out of date.
           - The code changed on purpose (the test was updated with it, or the
             behaviour is described in a newer spec or ADR): rewrite the statement
             to say what the code does now. Keep the fact it carried and state the
             consequence; never leave the old rule standing beside the new one.
             Keep its test links, and fix a link whose path or line moved.
           - The spec is right and the code or the test is wrong: change nothing
             in the spec. Record the statement, the failing test and one line on
             why in the pull request description under "Left for a person".
           - You cannot tell: change nothing, and record it the same way.
        3. Never delete a statement to make drift go away.

        When Part 1 changed anything, commit it on its own:
        `git add` the spec files and commit with the message
        `spec: update statements that drifted from the code`.

        ## Part 2: statements with no test link, at `{unlinked_path}`

        Each entry is a testable statement that no test is linked to. Some already
        have a test that validates them and only lack the link; some have no test
        at all.

        For each statement:
        1. Search the repository's tests for one that asserts what the statement
           says. Use the statement's own nouns and values; `lore-query-trace` and
           plain `grep` over the test files are both fine.
        2. Open the candidate test and read its assertions. Link it ONLY when the
           test would fail if the statement stopped being true. A test that merely
           touches the same module does not validate the statement.
        3. Add the link at the END of the statement, on the same line as its last
           word, in the form the spec's other links use (copy the path style of a
           link already in that file; when the file has none, use a path from the
           repository root):
           `([validated by <the test's title>](<path to the test file>#L<line of the it/test call>))`
           The label is the test's exact title. The line is where the `it(` or
           `test(` call starts.
        4. No test validates it: leave the statement unlinked. Never write a test,
           never link a test that does not exist, never invent a line number.

        When Part 2 changed anything, commit it on its own with the message
        `spec: link statements to the tests that validate them`.

        Read each brief's file first. A brief that lists no spec means that part
        has no work.

        ## The pull request description

        Write `{pr_body_path}`. Prose, short: how many statements you updated and
        why, how many links you added, and a "Left for a person" list of every
        entry you did not act on with one line each on why. No checklists, no
        emoji.

        DELIVERY, NON-NEGOTIABLE: the next step runs in a DIFFERENT container.
        - Run nothing from CI's checklist here: no linter, no typecheck, no test
          suite. CI runs them on every push and they do not fit this pod. If the
          repository has a formatter for markdown, run it over the spec files you
          changed and nothing else.
        - Push after your commits: `git push origin HEAD`. The clone carries its
          own credentials, so a plain push authenticates; you need no token and
          must never look for one. Never force.
        - Then bring the branch up to date with the repository's default branch
          (`git fetch origin`, merge it in) and push again if that produced
          anything. A branch that cannot merge cleanly gets no CI at all.
        - Confirm it landed: `git status` must report the branch is not ahead of
          its upstream. An unpushed commit lives only in this container.
        - Do not open a pull request: you have no `gh` and no GitHub token. Lore
          opens the PR from the branch you push.

        End your final message with exactly one of these lines:
        - You changed at least one spec file and pushed it:
          LORE_NODE_RESULT: {"outcome":"success"}
        - Nothing in either list could be acted on, and you pushed nothing:
          LORE_NODE_RESULT: {"outcome":"changes_requested"}
  spec-upkeep-fix-ci:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 30
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        env:
          LORE_TEST_POLICY: none
      prompt: |
        The spec upkeep pull request of this repository has a RED build. Your
        job is to make it green by correcting the SPECIFICATION FILES this
        branch changed, and nothing else.

        The branch is checked out with write access at /workspace/target. Run
        every command from inside it (`cd /workspace/target` first). Pass `repo`
        (the owner/name your task names above) on every `lore_*` call: the
        gateway has no checkout to detect it from.

        YOU CANNOT RUN TESTS, LINTERS, TYPECHECKS, BUILDS OR INSTALLS HERE, and
        you do not need to. The pod's Bash hook refuses them. CI already ran
        them, and what it printed is your only evidence.

        ## What CI said

        Read `/workspace/round-brief.md` first when it exists. Its `CI reported
        failures` section names the sha CI judged, the checks that failed, and
        what they printed: annotations as `path:line message`, the failed step,
        the log tail. When the file is missing or too thin, ask CI yourself:
        call `lore_get_ci_failures` with no arguments, then `lore_get_ci_job_log`
        with a failure's `job_id` and a `grep` for its error marker.

        FIRST, check the branch has not moved since CI judged it: run
        `git log --format=%s <the judged sha>..HEAD`. If it lists a commit that
        does not carry `[skip ci]`, somebody pushed and CI has not judged the
        new head yet. Change nothing and end with
        LORE_NODE_RESULT: {"outcome":"success","extras":{"ci_fixed":"branch moved past <sha>; CI re-judges the head"}}

        ## What to fix

        This branch changed specification files only: statements were updated
        and test links were added. A red build here is almost always one of:
        - A spec lint finding. The annotation names the spec file and line:
          open it there and fix what it says.
        - A broken spec link (`broken spec link: <path>#L<n> ...`). Open the
          test file it names. Point the link at the right file and at the line
          where the `it(` or `test(` call starts, or remove the link when no
          test validates the statement. Never invent a line number.
        - A statement's status or wording a spec rule rejects. Fix the
          statement, keeping the fact it carried.

        Fix EVERY finding the verdict names in this visit: each one you leave
        costs another round.

        NEVER change code, tests, build files or workflows. When the red check
        is not about a specification file (a unit test failing, a build
        breaking), it is not this branch's doing and not yours to repair: change
        nothing and report `changes_requested` below, naming the check.

        DELIVERY, NON-NEGOTIABLE: the next step runs in a DIFFERENT container.
        - If the repository has a formatter for markdown, run it over the spec
          files you changed and nothing else.
        - `git add` what you changed and commit it with a short, factual
          message. Then `git push origin HEAD`. The clone carries its own
          credentials, so a plain push authenticates; you need no token and
          must never look for one. Never force.
        - Then bring the branch up to date with the repository's default branch
          (`git fetch origin`, merge it in) and push again if that produced
          anything. A branch that cannot merge cleanly gets no CI at all.
        - Confirm it landed: `git status` must report the branch is not ahead
          of its upstream. An unpushed commit lives only in this container.

        Print exactly one of these as the last line of your final message:
        - You fixed what the verdict named and pushed it:
          LORE_NODE_RESULT: {"outcome":"success","extras":{"ci_fixed":"<one line: what was wrong in the spec>"}}
        - You changed nothing, or the failure is not in a specification file:
          LORE_NODE_RESULT: {"outcome":"changes_requested","extras":{"ci_blocked":"<one line: which check, and why it is not the spec's>"}}
