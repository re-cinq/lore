# One backlog ticket per run (specs/implementation-loop FR3, specs/external-floor
# FR12): acceptance tests first, then one red-green-refactor round per visit,
# each judged by the pull request's own CI, behind a draft pull request, and a
# wait until it is green with no unresolved review threads. It never merges.
#
# The two waits are human stations nobody answers by hand: Lore's
# pr-ready-check sweep reads the pull request and reports to the parked visit.
# A red verdict rides along as the round brief, a file the next agent reads.
#
# One backlog ticket per repository at a time: the run is keyed on `backlog`, a
# value that is the same for every backlog ticket of a repository. A plan's
# task is keyed on itself instead (`spec-task-<task id>`), so the tasks of a
# plan run side by side and beside the backlog's ticket (FR15).
line:
  id: implementation-loop
  entry: sync-start
  exit: done
  args:
    repo:
      kind: git
    backlog:
      kind: value
      subject: true
    task_id:
      kind: value
    ticket:
      kind: file
  nodes:
    # The branch is put on current main by Lore, not left to a prompt: a
    # service check compares it with the default branch, and only a branch that
    # is behind gets a pod, which rebases it and resolves the conflicts. The same
    # pair guards the three places a branch can fall behind: before the first
    # agent, before the pull request leaves draft, and when a ready pull request
    # turns red or conflicted.
    - id: sync-start
      station: loop-sync-check
      bind:
        target: repo
    - id: sync-start-rebase
      station: loop-sync
      bind:
        target: repo
    # A small model first asks whether a merged pull request already did
    # the ticket, before the most expensive pod does (#3497); off until a
    # repository switches it on.
    - id: done-check
      station: loop-done-check
      bind:
        target: repo
    - id: dod
      station: loop-dod
      bind:
        target: repo
    - id: open-pr
      station: loop-open-pr
      bind:
        target: repo
    - id: tdd-round
      station: loop-tdd-round
      bind:
        target: repo
    # The round is judged by the pull request's build, not by the pod that
    # wrote it: a park costs nothing while it waits.
    - id: await-ci
      station: loop-await-ci
      route: "{args.pr_url}"
    - id: repair-build
      station: loop-repair-build
      bind:
        target: repo
    - id: ready-for-review
      station: loop-ready-for-review
      bind:
        target: repo
    - id: sync-final
      station: loop-sync-check
      bind:
        target: repo
    - id: sync-final-rebase
      station: loop-sync
      bind:
        target: repo
    - id: mark-ready
      station: loop-mark-ready
    - id: await-pr
      station: loop-await-pr
      route: "{args.pr_url}"
    - id: sync-pr
      station: loop-sync-check
      bind:
        target: repo
    - id: sync-pr-rebase
      station: loop-sync
      bind:
        target: repo
    - id: fix-ci
      station: loop-fix-ci
      bind:
        target: repo
    - id: done
  edges:
    - from: sync-start
      to: done-check
      on: success
    - from: sync-start
      to: done-check
      on: rebased
    - from: sync-start
      to: sync-start-rebase
      on: changes_requested
    - from: sync-start
      to: sync-start
      on: failed
      iteration_max: 1
    - from: sync-start-rebase
      to: done-check
      on: success
    # A conflict nobody can settle by reading it: the run ends rather than
    # building on a branch that is not on main.
    - from: sync-start-rebase
      to: sync-start-rebase
      on: failed
      iteration_max: 1
    - from: done-check
      to: dod
      on: success
    # Already done by a merged pull request: the run ends and Lore closes the
    # ticket with the pull request and the reason, as for dod's own verdict.
    - from: done-check
      to: done
      on: changes_requested
    - from: done-check
      to: dod
      on: failed
    - from: dod
      to: open-pr
      on: success
    - from: dod
      to: dod
      on: failed
      iteration_max: 1
    # "This ticket cannot be expressed as acceptance tests", or "it is already
    # resolved": a scoping verdict, not a failure. A retry cannot make an
    # unclear ticket clear, so the run ends and Lore reads `dod_blocked` or
    # `dod_resolved` off the visit to say so on the ticket.
    # The run itself settles as success, as the Postgres-walked line settles it
    # `completed`: the floor has no failing exit yet (re-cinq/floor#20), and
    # these edges move to it when it has one.
    - from: dod
      to: done
      on: changes_requested
    - from: open-pr
      to: tdd-round
      on: success
    - from: open-pr
      to: open-pr
      on: failed
      iteration_max: 1
    # Both outcomes mean the round pushed, and CI decides what that push was
    # worth.
    - from: tdd-round
      to: await-ci
      on: success
    - from: tdd-round
      to: await-ci
      on: changes_requested
    # Stuck, or the pod died. One more try, then the run settles as
    # iteration_max rather than reaching the exit as a success.
    - from: tdd-round
      to: tdd-round
      on: failed
      iteration_max: 1
    - from: await-ci
      to: ready-for-review
      on: success
    # The round budget. Twelve rounds on one ticket means it was mis-sized,
    # so the budget failing IS the diagnosis.
    - from: await-ci
      to: tdd-round
      on: changes_requested
      iteration_max: 12
    # A build that stayed red, or a branch that stayed conflicted, across a
    # round which pushed nothing. Another round would re-derive the same
    # verdict; repair-build is handed the failing checks and fixes only those.
    - from: await-ci
      to: repair-build
      on: failed
      iteration_max: 2
    # Whatever the repair says of itself, the build is the judge: a repair
    # that moved nothing comes back as `failed` on the same sha until the
    # budget above is spent.
    - from: repair-build
      to: await-ci
      on: success
    - from: repair-build
      to: await-ci
      on: changes_requested
    - from: repair-build
      to: repair-build
      on: failed
      iteration_max: 1
    - from: ready-for-review
      to: sync-final
      on: success
    - from: ready-for-review
      to: ready-for-review
      on: failed
      iteration_max: 1
    - from: sync-final
      to: mark-ready
      on: success
    - from: sync-final
      to: mark-ready
      on: rebased
    - from: sync-final
      to: sync-final-rebase
      on: changes_requested
    - from: sync-final
      to: sync-final
      on: failed
      iteration_max: 1
    # The pull request is still a draft, and the wait after mark-ready is
    # where CI judges the rebased head, so it goes straight on.
    - from: sync-final-rebase
      to: mark-ready
      on: success
    - from: sync-final-rebase
      to: sync-final-rebase
      on: failed
      iteration_max: 1
    - from: mark-ready
      to: await-pr
      on: success
    - from: mark-ready
      to: mark-ready
      on: failed
      iteration_max: 1
    - from: await-pr
      to: done
      on: success
    # Red CI, changes Lore's own review asked for, a conflict and a branch
    # behind main are the blocking conditions this line acts on: GitHub keeps
    # Lore from requesting changes on a pull request it opened, so no reply
    # line answers its review, and the fix is handed the findings instead. A conflicted pull request gets no CI at all, so the
    # branch is put on main first; a rebase alone is cheap and a long-lived pull
    # request falls behind many times, so the sync has twice the fix's budget.
    - from: await-pr
      to: sync-pr
      on: changes_requested
      iteration_max: 14
    # Eight fixes: review findings and red CI share them, and a fix that
    # answers the review often leaves the coverage gate red for one more.
    - from: sync-pr
      to: fix-ci
      on: success
      iteration_max: 8
    - from: sync-pr
      to: await-pr
      on: rebased
    - from: sync-pr
      to: sync-pr-rebase
      on: changes_requested
      iteration_max: 6
    - from: sync-pr
      to: sync-pr
      on: failed
      iteration_max: 1
    # The push is a new head: the wait reads CI on it and sends the branch back
    # for a repair only if that is red too.
    - from: sync-pr-rebase
      to: await-pr
      on: success
    - from: sync-pr-rebase
      to: sync-pr-rebase
      on: failed
      iteration_max: 1
    # Unresolved threads the review round-trip did not clear: a human
    # conversation, not a build and not a failure of the machine, so the run
    # ends here with the pull request open for the people in it.
    - from: await-pr
      to: done
      on: failed
    - from: fix-ci
      to: await-pr
      on: success
    - from: fix-ci
      to: await-pr
      on: changes_requested
    - from: fix-ci
      to: fix-ci
      on: failed
      iteration_max: 1
stations:
  loop-sync-check:
    description: Checks whether the branch lacks commits of the default branch. A branch on current main goes straight on; a clean pull request GitHub calls behind is rebased by GitHub here; a conflict goes to the sync round.
    kind: service
    outcomes:
      - success
      - rebased
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
    produces: []
  loop-sync:
    description: An AI agent rebases the branch onto the default branch, resolves the conflicts and force-pushes with a lease, changing nothing else.
    kind: agent
    agent_definition: loop-sync
    conversation: new
    outcomes:
      - success
      - failed
    result_required: true
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: ticket
        kind: file
        path: ticket.md
    produces:
      - name: sync_summary
        kind: value
  loop-dod:
    description: An AI agent defines done for the ticket as acceptance tests that fail today, writing no production code. It ends the run if the ticket is unclear or already resolved.
    kind: agent
    agent_definition: loop-dod
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    result_required: true
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: ticket
        kind: file
        path: ticket.md
    produces:
      - name: dod_strategy
        kind: value
      - name: dod_blocked
        kind: value
      - name: dod_resolved
        kind: value
  loop-done-check:
    description: Asks a small model whether a merged pull request that names the ticket already does it. Done ends the run with the ticket closed; anything else goes on to the definition of done.
    kind: service
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: ticket
        kind: file
        path: ticket.md
      - name: issue_number
        kind: value
        optional: true
    produces:
      - name: dod_resolved
        kind: value
  loop-open-pr:
    description: Opens a draft pull request for the ticket's branch, so every later round is judged by that pull request's CI.
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: task_id
        kind: value
      # The ticket's title and number: absent on a run started by hand.
      - name: issue_title
        kind: value
        optional: true
      - name: issue_number
        kind: value
        optional: true
    produces:
      - name: pr_url
        kind: value
  loop-tdd-round:
    description: An AI agent does exactly one red, green, refactor round toward the acceptance tests and pushes it. CI then judges the round.
    kind: agent
    agent_definition: loop-tdd-round
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    result_required: true
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: ticket
        kind: file
        path: ticket.md
      # Absent on the first round: only a red build produces it.
      - name: round_brief
        kind: file
        path: round-brief.md
        optional: true
    produces:
      - name: tdd_done
        kind: value
      - name: tdd_next
        kind: value
      - name: tdd_blocked
        kind: value
  loop-await-ci:
    description: Waits until the pull request's CI judges the latest round. Green moves on to review, red asks for another round, and a build that stays red goes to repair.
    kind: human
    outcomes:
      - success
      - changes_requested
      - failed
    needs: []
    # Written only on a red report: the sha the build judged, the checks that
    # failed and what they printed, and the same as one file for the next agent.
    produces:
      - name: ci_feedback_sha
        kind: value
      - name: ci_failed_checks
        kind: value
      - name: ci_failure_summary
        kind: value
      - name: round_brief
        kind: file
  loop-repair-build:
    description: An AI agent fixes only the checks that stayed red after a round that pushed nothing new, so the loop does not re-derive the same failure.
    kind: agent
    agent_definition: loop-fix-ci
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    result_required: true
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: ticket
        kind: file
        path: ticket.md
      # Absent on the first round: only a red build produces it.
      - name: round_brief
        kind: file
        path: round-brief.md
        optional: true
    produces:
      - name: ci_fixed
        kind: value
      - name: ci_blocked
        kind: value
  loop-ready-for-review:
    description: Writes the pull request's title and description from its diff, the ticket and the definition of done with one small model call, and deletes the definition of done from the branch.
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: ticket
        kind: file
        path: ticket.md
      - name: task_id
        kind: value
      - name: pr_url
        kind: value
    produces:
      - name: pr_body
        kind: file
      - name: pr_title
        kind: value
      - name: issue_coverage
        kind: value
  loop-mark-ready:
    description: Applies the written title and description and marks the draft pull request ready for review.
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: pr_url
        kind: value
      - name: task_id
        kind: value
      - name: issue_number
        kind: value
        optional: true
      # What the ready-for-review step wrote; each is absent when it wrote none.
      - name: pr_body
        kind: file
        optional: true
      - name: pr_title
        kind: value
        optional: true
      - name: issue_coverage
        kind: value
        optional: true
    produces: []
  loop-await-pr:
    description: Waits on the pull request until it is on current main, CI is green, Lore's review asks for no changes and no review thread is open. A branch behind or in conflict goes to the sync, red CI and Lore's requested changes to a fix, while a person's open threads end the run for people to settle.
    kind: human
    outcomes:
      - success
      - changes_requested
      - failed
    needs: []
    # Written only on a red report: the sha the build judged, the checks that
    # failed and what they printed, and the same as one file for the next agent.
    produces:
      - name: ci_feedback_sha
        kind: value
      - name: ci_failed_checks
        kind: value
      - name: ci_failure_summary
        kind: value
      - name: round_brief
        kind: file
  loop-fix-ci:
    description: An AI agent makes the red build green, or makes the changes Lore's review asked for, on the pull request after it was marked ready, changing only what CI or the review reported.
    kind: agent
    agent_definition: loop-fix-ci
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    result_required: true
    needs:
      - name: target
        kind: git
        path: target
        access: write
      - name: ticket
        kind: file
        path: ticket.md
      # Absent on the first round: only a red build produces it.
      - name: round_brief
        kind: file
        path: round-brief.md
        optional: true
    produces:
      - name: ci_fixed
        kind: value
      - name: ci_blocked
        kind: value
agent_definitions:
  loop-sync:
    settings:
      model: gemini-3.1-pro-preview
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 20
      prices:
        gemini-3.1-pro-preview:
          input_per_million: 2
          output_per_million: 12
          cache_read_per_million: 0.2
      config:
        max_turns: 60
        pod_resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 6Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 6Gi
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
  loop-dod:
    settings:
      model: gemini-3.1-pro-preview
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 60
      prices:
        gemini-3.1-pro-preview:
          input_per_million: 2
          output_per_million: 12
          cache_read_per_million: 0.2
      config:
        max_turns: 200
        # Autopilot holds an ephemeral-storage limit to its request, so the limit
        # is what evicts: runs aa9c26e4's dod pods were evicted at 2Gi by npm ci.
        pod_resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 6Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 6Gi
        skills:
          - lore-context
          - tdd-loop
          - legacy-characterize
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
  loop-tdd-round:
    settings:
      # On Sonnet while gemini-cli's streams stall for 10 minutes a request (run 4aba1706); back to Gemini once they don't.
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 60
      config:
        max_turns: 300
        pod_resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 6Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 6Gi
        skills:
          - lore-context
          - tdd-loop
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        env:
          # A round runs the tests its branch created, acceptance tests included; main's tests are CI's.
          LORE_BRANCH_TESTS: /workspace/target
  loop-fix-ci:
    settings:
      # Gemini 4 Argon since 2026-10-26 (#3502): on loop-bench's medium and large
      # tickets it left 38 of 68 repairs green, Gemini 3.1 Pro 18 of 66.
      model: gemini-4-argon
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 45
      prices:
        gemini-4-argon:
          input_per_million: 2
          output_per_million: 10
          cache_read_per_million: 0.2
      config:
        max_turns: 200
        pod_resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 6Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 6Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
