line:
  id: code-review
  entry: review
  exit: done
  args:
    repo:
      kind: git
    pr_url:
      kind: value
      subject: true
    description:
      kind: value
  nodes:
    - id: review
      station: code-review
      bind:
        target: repo
    - id: post-review
      station: post-review
    - id: done
  edges:
    - from: review
      to: post-review
      on: success
    - from: review
      to: post-review
      on: changes_requested
    - from: review
      to: review
      on: failed
      iteration_max: 1
    - from: post-review
      to: done
      on: success
    # A post that fails is usually an agent that ended without a verdict; posting again reads the same output, so the agent runs again instead.
    - from: post-review
      to: review
      on: failed
      iteration_max: 1
stations:
  code-review:
    kind: agent
    agent_definition: code-review
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: description
        kind: value
      - name: issue
        kind: file
        path: issue.md
        optional: true
    produces:
      - name: review_output
        kind: file
        from: output
  post-review:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: review_output
        kind: file
      - name: pr_url
        kind: value
      - name: head_sha
        kind: value
        optional: true
    produces:
      - name: review_summary
        kind: value
      - name: review_url
        kind: value
agent_definitions:
  code-review:
    settings:
      model: gemini-3.1-pro-preview
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 25
      prices:
        gemini-3.1-pro-preview:
          input_per_million: 2
          output_per_million: 12
      config:
        # CPU and memory are what a floor agent pod gets when nothing is set (seen 2026-09-30); only the disk is raised, from 1Gi, for the clone.
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        disallowed_tools:
          - Bash(npm:*)
          - Bash(npx:*)
          - Bash(yarn:*)
          - Bash(pnpm:*)
          - Bash(bun:*)
          - Bash(pip:*)
          - Bash(pip3:*)
          - Bash(uv:*)
          - Bash(cargo:*)
          - Bash(go:*)
          - Bash(make:*)
          - Bash(bash:*)
          - Bash(sh:*)
        env:
          LORE_TEST_POLICY: none
