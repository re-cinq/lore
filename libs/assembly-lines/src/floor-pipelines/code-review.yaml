line:
  id: code-review
  entry: review
  exit: done
  args:
    repo:
      kind: git
    pr_url:
      kind: value
      subject: true
    description:
      kind: value
  nodes:
    - id: review
      station: code-review
      bind:
        target: repo
    - id: post-review
      station: post-review
    - id: done
  edges:
    - from: review
      to: post-review
      on: success
    - from: review
      to: post-review
      on: changes_requested
    - from: review
      to: review
      on: failed
      iteration_max: 1
    - from: post-review
      to: done
      on: success
    # A post that fails is usually an agent that ended without a verdict; posting again reads the same output, so the agent runs again instead.
    - from: post-review
      to: review
      on: failed
      iteration_max: 1
stations:
  code-review:
    description: An AI agent reviews the pull request's diff against the repository's conventions, ADRs, specs and CI result, and returns a verdict with its findings.
    kind: agent
    agent_definition: code-review
    conversation: new
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: description
        kind: value
      - name: issue
        kind: file
        path: issue.md
        optional: true
    produces:
      - name: review_output
        kind: file
        from: output
  post-review:
    description: Posts the review agent's verdict and comments on the pull request on GitHub. If the agent ended without a verdict, it fails so the agent runs again.
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: review_output
        kind: file
      - name: pr_url
        kind: value
      - name: head_sha
        kind: value
        optional: true
      # The threads of Lore's findings the re-check was handed; an approval resolves them.
      - name: open_threads
        kind: value
        optional: true
    produces:
      - name: review_summary
        kind: value
      - name: review_url
        kind: value
agent_definitions:
  code-review:
    settings:
      model: gemini-4-argon
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 25
      prices:
        gemini-4-argon:
          input_per_million: 2
          output_per_million: 10
      config:
        # CPU and memory are what a floor agent pod gets when nothing is set (seen 2026-09-30); only the disk is raised, from 1Gi, for the clone.
        pod_resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 6Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 6Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
        env:
          LORE_TEST_POLICY: none
