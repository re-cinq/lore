line:
  id: issue-triage
  entry: reproduce
  exit: done
  args:
    # One run per issue: the webhook starts a run the moment the label lands and the
    # two-minute sweep still sees that label, so without a key the issue gets two.
    issue_url:
      kind: value
      subject: true
  nodes:
    - id: reproduce
      station: reproduce
    - id: triage-label
      station: triage-label
    - id: diagnose
      station: diagnose
    - id: verify
    - id: human-gate
      station: human-gate
    - id: done
  edges:
    - from: reproduce
      to: triage-label
      on: success
    - from: reproduce
      to: triage-label
      on: failed
      iteration_max: 3
    - from: triage-label
      to: diagnose
      on: success
    - from: diagnose
      to: triage-label
      on: success
    - from: diagnose
      to: triage-label
      on: failed
      iteration_max: 3
    - from: triage-label
      to: verify
      on: success
    - from: triage-label
      to: done
      on: failed
    - from: verify
      to: human-gate
      on: success
    - from: human-gate
      to: done
      on: success
stations:
  reproduce:
    kind: agent
    agent_definition: triage-reproduce
    outcomes:
      - success
      - failed
    needs:
      - name: issue_url
        kind: value
  triage-label:
    kind: service
    outcomes:
      - success
      - failed
    needs:
      - name: issue_url
        kind: value
  diagnose:
    kind: agent
    agent_definition: triage-diagnose
    outcomes:
      - success
      - failed
    needs:
      - name: issue_url
        kind: value
  human-gate:
    kind: human
    route: "{args.issue_url}"
    outcomes:
      - success
agent_definitions:
  triage-reproduce:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
  triage-diagnose:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 10
      config:
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
