line:
  id: issue-triage
  entry: verify
  exit: done
  args:
    # One run per issue: the webhook starts a run the moment the label lands and the
    # two-minute sweep still sees that label, so without a key the issue gets two.
    issue_url:
      kind: value
      subject: true
  nodes:
    - id: verify
      station: triage-verify
    - id: human-gate
      station: human-gate
    - id: done
  edges:
    - from: verify
      to: human-gate
      on: success
    - from: verify
      to: close-obsolete
      on: obsolete
    - from: verify
      to: decompose
      on: large-issue
    - from: verify
      to: label-not-actionable
      on: not-actionable
    - from: verify
      to: label-failed
      on: failed
      iteration_max: 3
    - from: human-gate
      to: done
      on: success
stations:
  triage-verify:
    kind: agent
    agent_definition: triage-verify
    outcomes:
      - success
      - obsolete
      - large-issue
      - not-actionable
      - failed
    produces: []
  human-gate:
    kind: human
    route: "{args.issue_url}"
    outcomes:
      - success
agent_definitions: {}
