line:
  id: issue-triage
  entry: verify
  exit: done
  args:
    # One run per issue: the webhook starts a run the moment the label lands and the
    # two-minute sweep still sees that label, so without a key the issue gets two.
    issue_url:
      kind: value
      subject: true
  nodes:
    - id: verify
    - id: human-gate
      station: human-gate
    - id: decompose
      station: decompose
    - id: done
  edges:
    - from: verify
      to: human-gate
      on: success
    - from: human-gate
      to: done
      on: success
    - from: decompose
      to: done
      on: always
stations:
  human-gate:
    kind: human
    route: "{args.issue_url}"
    outcomes:
      - success
  decompose:
    kind: agent
    agent_definition: feature-decompose
    outcomes:
      - success
      - changes_requested
      - failed
    needs: []
    produces: []
agent_definitions: {}
