line:
  id: issue-triage
  entry: reproduce
  exit: done
  args:
    # One run per issue: the webhook starts a run the moment the label lands and the
    # two-minute sweep still sees that label, so without a key the issue gets two.
    issue_url:
      kind: value
      subject: true
    # Both sent by the dispatch that starts the run (apps/stations/src/events/handlers.ts);
    # the label and close stations need them to reach the issue.
    issue_number:
      kind: value
    repo:
      kind: value
    # The default branch, which decompose reads to split a large issue (apps/stations/src/work/issue-triage-tick/).
    target:
      kind: git
  nodes:
    - id: reproduce
      station: triage-reproduce
    - id: label-reproduced
      station: triage-label
    - id: label-needs-repro
      station: triage-label
    - id: label-unable
      station: triage-label
    - id: label-skipped
      station: triage-label
    - id: diagnose
      station: triage-diagnose
    - id: label-diagnosed
      station: triage-label
    - id: verify
      station: triage-verify
    - id: decompose
      station: triage-decompose
    - id: file-issues
      station: triage-file-issues
    - id: close-obsolete
      station: close-issue
    - id: label-not-actionable
      station: triage-label
    - id: label-failed
      station: triage-label
    - id: human-gate
      station: human-gate
    - id: done
  edges:
    - from: reproduce
      to: label-reproduced
      on: success
    - from: reproduce
      to: label-needs-repro
      on: needs-reproduction
    - from: reproduce
      to: label-unable
      on: unable-to-reproduce
    - from: reproduce
      to: label-skipped
      on: skipped
    - from: reproduce
      to: label-failed
      on: failed
      iteration_max: 3
    - from: label-reproduced
      to: diagnose
      on: success
    - from: label-needs-repro
      to: done
      on: success
    - from: label-unable
      to: done
      on: success
    - from: label-skipped
      to: done
      on: success
    - from: diagnose
      to: label-diagnosed
      on: success
    - from: diagnose
      to: label-failed
      on: failed
      iteration_max: 3
    - from: label-diagnosed
      to: verify
      on: success
    - from: verify
      to: human-gate
      on: success
    - from: verify
      to: close-obsolete
      on: obsolete
    - from: verify
      to: decompose
      on: large-issue
    - from: decompose
      to: file-issues
      on: success
    - from: decompose
      to: label-failed
      on: failed
      iteration_max: 3
    - from: file-issues
      to: done
      on: success
    - from: file-issues
      to: decompose
      on: changes_requested
      iteration_max: 3
    - from: file-issues
      to: label-failed
      on: failed
    - from: verify
      to: label-not-actionable
      on: not-actionable
    - from: verify
      to: label-failed
      on: failed
      iteration_max: 3
    - from: close-obsolete
      to: done
      on: always
    - from: label-not-actionable
      to: done
      on: success
    - from: label-failed
      to: done
      on: success
    - from: human-gate
      to: done
      on: success
stations:
  triage-verify:
    description: An AI agent checks the issue against the repository's specs and docs and decides whether it is a genuine bug, obsolete, or not actionable, with a short verdict for the reporter.
    kind: agent
    agent_definition: triage-verify
    conversation: new
    outcomes:
      - success
      - obsolete
      - not-actionable
      - large-issue
      - failed
    needs:
      - name: issue_url
        kind: value
      - name: diagnosis
        kind: value
    produces:
      # One paragraph for the issue's reporter, which close-obsolete posts and
      # label-not-actionable comments; the agent sends it as the result line's extras.
      - name: verdict
        kind: value
  triage-reproduce:
    description: An AI agent tries to reproduce the reported behaviour against the repository and says whether it reproduced, needs more detail, or could not.
    kind: agent
    agent_definition: triage-reproduce
    conversation: new
    outcomes:
      - success
      - unable-to-reproduce
      - needs-reproduction
      - skipped
      - failed
    needs:
      - name: issue_url
        kind: value
    produces:
      - name: verdict
        kind: value
        optional: true
  triage-diagnose:
    description: An AI agent traces a reproduced issue to its cause in the code and writes a short diagnosis that verify reads.
    kind: agent
    agent_definition: triage-diagnose
    conversation: new
    outcomes:
      - success
      - failed
    needs:
      - name: issue_url
        kind: value
    produces:
      - name: diagnosis
        kind: value
  triage-decompose:
    description: An AI agent splits a confirmed bug too broad for one change into a story and small tasks, each with acceptance criteria and a test plan.
    kind: agent
    agent_definition: triage-decompose
    conversation: new
    outcomes:
      - success
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: issue_url
        kind: value
      - name: diagnosis
        kind: value
    produces:
      - name: decomposition
        kind: file
        path: decomposition.json
  triage-file-issues:
    description: Files the decomposition as a story issue with one sub-issue per task, labelled for a person to prioritize rather than queued for the implementation loop.
    kind: service
    outcomes:
      - success
      - changes_requested
      - failed
    needs:
      - name: target
        kind: git
        path: target
        access: read
      - name: decomposition
        kind: file
        path: decomposition.json
      - name: issue_number
        kind: value
    produces: []
  close-issue:
    description: Posts the agent's verdict on the issue and closes it, because the behaviour it reports no longer exists or was already addressed.
    kind: service
    outcomes:
      - success
    needs:
      - name: repo
        kind: value
      - name: issue_number
        kind: value
      - name: verdict
        kind: value
    produces: []
  triage-label:
    description: Labels the issue with the triage result, not actionable or failed. For a not actionable issue it also posts the agent's verdict as a comment.
    kind: service
    outcomes:
      - success
    needs:
      - name: repo
        kind: value
      - name: issue_number
        kind: value
      - name: verdict
        kind: value
        optional: true
    produces: []
  human-gate:
    description: Waits on the issue page for a person to decide whether a confirmed bug is worth implementing.
    kind: human
    route: "{args.issue_url}"
    outcomes:
      - success
    needs: []
    produces: []
agent_definitions:
  triage-reproduce:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
  triage-diagnose:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 10
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
  triage-verify:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 10
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
  triage-decompose:
    settings:
      model: claude-sonnet-4-6
      image: ${LORE_AGENT_IMAGE}
      timeout_minutes: 15
      config:
        pod_resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        skills:
          - lore-context
        skills_source: ${LORE_SKILLS_URL}
        mcp_servers:
          - name: lore
            transport: http
            url: ${LORE_MCP_URL}
            headers_secret: lore-mcp-auth
