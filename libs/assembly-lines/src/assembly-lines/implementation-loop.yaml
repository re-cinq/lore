# One ticket per run (specs/implementation-loop FR3). The TICKET loop is not a
# back-edge — the Floor driver re-arms on the run's terminal state (FR2). The TDD
# loop IS one, because a red-green-refactor round per pod is what keeps each
# round's prompt bounded however many rounds precede it, and "how many rounds for
# one ticket" is legitimately a small integer where "how many tickets in a repo's
# backlog" never is.
name: implementation-loop
description: Work one backlog ticket top-down — acceptance tests first, then one red-green-refactor round per visit, each judged by the pull request's own CI — behind a draft PR, and park until it is green with no unresolved review threads. Never merges.
version: 1
entry: dod
exit: done

nodes:
  - id: dod
    type: agent
    prompt_ref: acceptance-dod
    # Explicit, not inherited: an agent node's Station defaults to the LINE's
    # task type, and no Station named implementation-loop exists — the first
    # live run died with "Station or AgentDefinition not found".
    station_ref: acceptance-dod
    model: claude-sonnet-4-6
    description: Write the RED acceptance tests that mean "ticket done", pick a strategy, commit .lore/dod.md.

  - id: open-pr
    type: agent
    # `push-only` is the ONLY prompt_ref the Floor stamps args.pr_url/pr_number
    # for (spec-pr.ts decidePrStamp), and await-pr's route needs pr_url.
    prompt_ref: push-only
    station_ref: push-only
    description: Open the DRAFT pull request, so CI has a target and code-review stays quiet.

  - id: tdd-round
    type: agent
    prompt_ref: tdd-round
    station_ref: tdd-round
    model: claude-sonnet-4-6
    description: ONE red-green-refactor round. Commit and push what it wrote.

  # The round is judged by the pull request's build, not by the pod that wrote
  # it. A pod running the repo's whole suite pays for a machine to answer a
  # question CI answers anyway, on hardware the repo already sized for it; a
  # park costs nothing while it waits. `ci_check`, not `pr_review`: the flip
  # that takes a PR out of draft keys on the DESTINATION type, so a pr_review
  # wait here would un-draft after round one and start review on unfinished work.
  - id: await-ci
    type: ci_check
    route: "{args.pr_url}"
    description: Waiting on CI for the round just pushed — GitHub Actions is the judge.

  # No `validate` node, and no in-pod lint, format or typecheck either. All of
  # it is what CI already runs on the pull request, and since red CI routes to
  # another round instead of blocking the ticket, running it twice buys latency
  # at the cost of a `node:validate` claim — the exact resource whose absence
  # starved five tickets on 2026-08-28.
  - id: ready-for-review
    type: agent
    prompt_ref: pr-ready
    station_ref: pr-ready
    description: Re-run the acceptance suite, write the PR description artifact, drop .lore/dod.md.

  - id: await-pr
    # Parks with no Agent CR; pr-ready-check resumes it. success = green with no
    # unresolved threads; changes_requested = red CI, which fix-ci owns; failed =
    # unresolved threads the review round-trip did not clear, which a human owns.
    type: pr_review
    route: "{args.pr_url}"
    description: Waiting on CI and review threads — the PR view is the station.

  - id: fix-ci
    type: agent
    prompt_ref: fix-ci
    station_ref: fix-ci
    model: claude-sonnet-4-6
    description: Reproduce the red build locally, fix it, push, and go back to waiting.

  - id: retrospective
    type: retrospective
    description: Episode + curated memory.

  - id: done
    type: retrospective
    description: Terminal marker.

edges:
  - from: dod
    to: open-pr
    on: success
  - from: dod
    to: dod
    on: failed
    iteration_max: 1
  # "This ticket cannot be expressed as acceptance tests" is a scoping verdict,
  # not a failure. A retry cannot make an unclear ticket clear; a human must.
  - from: dod
    to: retrospective
    on: changes_requested

  - from: open-pr
    to: tdd-round
    on: success
  # No PR means await-pr's route resolves to nothing and the run would park
  # forever on a node the reaper deliberately never times out.
  - from: open-pr
    to: retrospective
    on: failed
  - from: open-pr
    to: retrospective
    on: changes_requested

  # Both outcomes mean the same thing now — the round pushed, and CI decides
  # what that push was worth. The round no longer judges its own acceptance
  # bar, so it has no way to tell "done" from "more to do" that is worth
  # routing on; the build can.
  - from: tdd-round
    to: await-ci
    on: success
  - from: tdd-round
    to: await-ci
    on: changes_requested
  # Stuck, or the pod died. There is nothing to judge, so nothing to wait for.
  - from: tdd-round
    to: retrospective
    on: failed

  - from: await-ci
    to: ready-for-review
    on: success
  # The round budget lives HERE, not on a tdd-round self-edge: the counter keys
  # on `${from}->${to}`, and every round now leaves through the wait, so this is
  # the edge every round comes back on. Twelve rounds on one ticket means it was
  # mis-sized and its acceptance tests should have been split, so the budget
  # failing IS the diagnosis. The loader demands no bound on a human-gated
  # cycle; the runtime enforces this one because it is declared.
  - from: await-ci
    to: tdd-round
    on: changes_requested
    iteration_max: 12
  # A build that stayed red across a round that pushed nothing. Another round
  # would re-derive the same verdict, so this is a human's.
  - from: await-ci
    to: retrospective
    on: failed

  - from: ready-for-review
    to: await-pr
    on: success
  - from: ready-for-review
    to: ready-for-review
    on: failed
    iteration_max: 1
  - from: ready-for-review
    to: retrospective
    on: changes_requested

  - from: await-pr
    to: retrospective
    on: success
  # Red CI is the one blocking condition this line can act on. The loader would
  # not demand a budget here (await-pr is a human station, which exempts the
  # cycle), but the runtime enforces any declared one — and without it a
  # permanently red PR ping-pongs forever.
  - from: await-pr
    to: fix-ci
    on: changes_requested
    iteration_max: 3
  # Unresolved threads the choreography did not clear: a human conversation,
  # not a build.
  - from: await-pr
    to: retrospective
    on: failed

  # Straight back to the wait, not through validate: fix-ci pushes its own fix,
  # the PR updates itself, and pr-ready-check re-reads the NEW head sha. CI is
  # the validator on this half of the line — re-running the in-pod one would
  # cost a pod to answer a question the build is already answering. Human-gated
  # (await-pr is a pr_review station), so the loader demands no budget; the one
  # on await-pr -> fix-ci is what bounds the ping-pong.
  - from: fix-ci
    to: await-pr
    on: success
  - from: fix-ci
    to: retrospective
    on: failed
  - from: fix-ci
    to: retrospective
    on: changes_requested

  - from: retrospective
    to: done
    on: always
