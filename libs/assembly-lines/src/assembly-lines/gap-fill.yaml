name: gap-fill
description: Draft missing context as docs, validate, push. No human review on the auto-merge path.
version: 1
entry: draft
exit: done

nodes:
  - id: draft
    type: agent
    prompt_ref: gap-fill
    model: claude-haiku-4-5-20251001
    description: LLM drafts the missing CLAUDE.md / ADR / runbook content.

  - id: validate
    type: validate
    description: Leaves lint + typecheck to the PR's CI; runs nothing in the pod.

  - id: push
    type: agent
    prompt_ref: push-only
    description: Open or update the PR.

  # CI judges what `push` opened: `validate` no longer runs the repo's checks in
  # the pod (2026-09-29), so without this wait the line would push and finish on
  # a build nobody read. The pr-ready-check sweep resumes it.
  - id: await-ci
    type: ci_check
    route: "{args.pr_url}"
    description: Waiting on the PR's CI — GitHub Actions is the judge.

  - id: fix-ci
    type: agent
    prompt_ref: fix-ci
    station_ref: fix-ci
    model: claude-sonnet-4-6
    description: Fix what CI reported red, push, and go back to waiting.

  - id: retrospective
    type: retrospective
    description: Write episode + curated memory.

  - id: done
    type: retrospective
    description: Terminal marker (the executor halts on exit).

edges:
  - from: draft
    to: validate
    on: success
  - from: draft
    to: retrospective
    on: changes_requested
  - from: draft
    to: draft
    on: failed
    iteration_max: 1
  - from: validate
    to: push
    on: success
  - from: validate
    to: draft
    on: failed
    iteration_max: 1
  - from: push
    to: await-ci
    on: always
  - from: await-ci
    to: retrospective
    on: success
  # Red after a push, and red again on a sha already reported: both are fix-ci's,
  # on one budget (the counter keys on from->to).
  - from: await-ci
    to: fix-ci
    on: changes_requested
    iteration_max: 2
  - from: await-ci
    to: fix-ci
    on: failed
    iteration_max: 2
  - from: fix-ci
    to: await-ci
    on: success
  - from: fix-ci
    to: retrospective
    on: failed
  - from: fix-ci
    to: retrospective
    on: changes_requested
  - from: retrospective
    to: done
    on: always
