name: issue-triage
description: Automatically reproduce, diagnose, and verify bug reports before handing off to maintainers.
version: 1
entry: reproduce
exit: done

nodes:
  - id: reproduce
    type: agent
    prompt_ref: general
    station_ref: general
    model: claude-sonnet-4-6
    required_tags: ["sandbox"]
    description: Clone and run the reproduction repository in a secure sandbox.

  - id: diagnose
    type: agent
    prompt_ref: general
    station_ref: general
    model: claude-sonnet-4-6
    description: Instrument the codebase to trace the root cause of the reproduced failure.

  - id: verify
    type: agent
    prompt_ref: general
    station_ref: general
    model: claude-sonnet-4-6
    description: Cross-reference the diagnosed behavior against existing specs and documentation.

  - id: human-gate
    type: human
    route: /issues/triage-gate
    description: A maintainer reviews the diagnosis and applies lore:implementation to proceed.

  - id: close-obsolete
    type: service
    route: /api/stations/close-obsolete
    description: Close the issue if verified as obsolete.

  - id: decompose
    type: agent
    prompt_ref: feature-decompose
    station_ref: feature-decompose
    model: claude-sonnet-4-6
    description: Split large issues into smaller tasks.

  - id: issues
    type: issues
    description: File the Issues + spec-tasks the decomposition calls for.

  - id: done
    type: retrospective
    description: Terminal marker.

edges:
  - from: reproduce
    to: diagnose
    on: success
  - from: reproduce
    to: done
    on: unable-to-reproduce
  - from: reproduce
    to: done
    on: needs-reproduction
  - from: reproduce
    to: done
    on: skipped
  - from: reproduce
    to: done
    on: changes_requested
  - from: reproduce
    to: done
    on: failed
    iteration_max: 3

  - from: diagnose
    to: verify
    on: success
  - from: diagnose
    to: done
    on: changes_requested
  - from: diagnose
    to: done
    on: failed
    iteration_max: 3

  - from: verify
    to: human-gate
    on: success
  - from: verify
    to: close-obsolete
    on: obsolete
  - from: verify
    to: decompose
    on: large-issue
  - from: verify
    to: done
    on: changes_requested
  - from: verify
    to: done
    on: not-actionable
  - from: verify
    to: done
    on: failed
    iteration_max: 3

  - from: close-obsolete
    to: done
    on: always

  - from: decompose
    to: issues
    on: success
  - from: decompose
    to: done
    on: changes_requested
  - from: decompose
    to: done
    on: failed

  - from: issues
    to: done
    on: success
  - from: issues
    to: decompose
    on: changes_requested
    iteration_max: 1
  - from: issues
    to: done
    on: failed

  - from: human-gate
    to: done
    on: success
  - from: human-gate
    to: done
    on: changes_requested
  - from: human-gate
    to: done
    on: failed
