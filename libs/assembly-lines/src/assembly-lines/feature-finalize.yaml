name: feature-finalize
description: >
  Turn the accepted plan into spec files: decide which specs to amend and which to
  create (analyse), apply that change set (write), then push so the watcher opens
  the spec PR. No code.
version: 1
entry: analyse
exit: done

nodes:
  - id: analyse
    type: agent
    prompt_ref: spec-analysis
    model: claude-sonnet-4-6
    description: >
      Decide which specs this feature changes. Emits spec-plan.json, which the Floor
      merges into the line as args.spec_plan for the write node.

  - id: write
    type: agent
    prompt_ref: feature-finalize
    model: claude-sonnet-4-6
    description: Apply the change set — amend what it says to amend, create what it says to create.

  - id: push
    type: agent
    prompt_ref: push-only
    description: Commit + open/update the PR branch.

  - id: done
    type: retrospective
    description: Terminal marker.

edges:
  - from: analyse
    to: write
    on: success

  # analyse has no upstream NODE — its input is the plan a human accepted. When that
  # plan cannot be turned into a spec change set, the only party who can fix it is the
  # author, so the line ends and settle-task returns the feature to awaiting-input
  # carrying the objection. Looping here would have the pipeline argue with itself
  # about a question only a person can answer.
  - from: analyse
    to: done
    on: changes_requested

  - from: analyse
    to: done
    on: failed

  - from: write
    to: push
    on: success

  # The change set was unusable — a spec path that does not exist, or an instruction
  # to amend a spec that does not cover the area. The objection rides back through
  # args and analyse re-runs against it. ONE correction: a second objection exhausts
  # the budget and fails the line, because two agents disagreeing without a referee
  # will do so all day.
  - from: write
    to: analyse
    on: changes_requested
    iteration_max: 1

  - from: write
    to: done
    on: failed

  - from: push
    to: done
    on: always
