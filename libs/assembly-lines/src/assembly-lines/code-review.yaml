name: code-review
description: Review a PR — assess the diff and emit structured findings; the Floor posts them as suggestion-only Conventional Comments. Fixes are human-gated via replies.
version: 1
entry: review
exit: done

nodes:
  - id: review
    type: agent
    prompt_ref: code-review
    model: claude-sonnet-4-6
    description: Assess the diff; emit REVIEW_FINDINGS (structured) + a REVIEW_RESULT verdict. Does not post or commit.

  - id: done
    type: retrospective
    description: Terminal marker.

edges:
  - from: review
    to: done
    on: success
  - from: review
    to: done
    on: changes_requested
  # A failed review visit gets ONE retry — the common failure is a findings
  # block that did not parse (PR #1714 merged five minutes after exactly that),
  # and a fresh pass usually publishes fine. A second identical failure fails
  # the RUN (iteration_max), so the check stays honestly red instead of the
  # line completing as if a review had happened.
  - from: review
    to: review
    on: failed
    iteration_max: 1
