name: review
description: Context optimized for code review tasks.
sections:
  - header: "Directory Rules"
    source: rules
    priority: 1
    max_tokens: 2000

  - header: "Conventions & Code Standards"
    source: repo
    priority: 1
    max_tokens: 5000

  - header: "Relevant Code"
    source: code
    priority: 1
    max_tokens: 4000

  - header: "Architecture Decisions"
    source: adrs
    priority: 1
    max_tokens: 4000

  # Spec rules + tests coupled to the code under review, flagged where violated
  # or untested. Deterministic; empty when LORE_DGRAPH_HTTP is not wired.
  - header: "Coupled Spec & Tests"
    source: coupling
    priority: 1
    max_tokens: 3000

  - header: "Review Patterns & Feedback"
    source: memories
    priority: 2
    max_tokens: 3000

  - header: "Related Entities"
    source: graph
    priority: 3
    max_tokens: 2000
