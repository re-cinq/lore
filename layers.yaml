# The folder layering, enforced by `lore/no-cross-layer-import`.
#
# Each package maps a folder to the folders it may import. Four rules:
#   1. A key matches the folder it names and everything under it; `*` is one segment.
#   2. A folder may always import itself and its own descendants.
#   3. It may import what its list names, and nothing else.
#   4. The most specific matching key wins, so `jobs/lib` beats `jobs/*`.
#
# Sibling isolation needs no syntax: `jobs/*` lists `jobs/lib`, so `jobs/review`
# reaches lib and itself while `jobs/merge` is simply not on the list.
#
# A package absent from this file is not checked, so packages join one at a
# time. Inside a package that IS here, a folder with no entry may import
# nothing — that is what stops the file rotting as folders are added.
#
# npm and `node:` specifiers are never governed; package.json owns those.

layers:
  # The Floor is three event-bus layers over a shared substrate (ADR-015):
  # listeners write rows, the loop dispatches them, jobs handle them. `kernel`
  # is the substrate and reaches nothing; `delivery` is the process entry tier,
  # reachable only from index.ts because nothing else lists it.
  apps/floor:
    ".":
      - composition
      - delivery
      - jobs
      - kernel
      - listeners
      - main-loop
      - "@re-cinq/lore-shared"
    kernel:
      - "@re-cinq/lore-shared"
    listeners:
      - kernel
      - main-loop
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    main-loop:
      - jobs
      - kernel
      - listeners
      - "@re-cinq/lore-shared"
    composition:
      - jobs
      - kernel
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    delivery:
      - composition
      - jobs
      - kernel
      - listeners
      - main-loop
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The registry lives here, so the files directly under jobs/ wire handlers
    # to the loop; the per-domain folders below are narrower.
    jobs:
      - jobs/lib
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
      - "@re-cinq/lore-stations"
    # A leaf: shared helpers for the job domains, never a domain itself. It reads
    # the assembly-line definitions because the set of line names decides job
    # routing — the watcher and the wiring root are its only callers.
    jobs/lib:
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The walk is a coordinator, not a peer (ADR-024): it sequences the domains
    # and reacts to what a node finished with, so it posts a review, closes a
    # loop run, settles a task. It may reach a sibling domain; the reverse stays
    # forbidden by `jobs/*` below, which is what keeps this a tier rather than a
    # free-for-all — a domain that needs the walk has the dependency backwards.
    jobs/assembly-run:
      - jobs
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
      - "@re-cinq/lore-stations"
    # One domain per folder: a domain reaches lib and the substrate, never a
    # sibling domain, and never back up into the loop that dispatches it.
    jobs/*:
      - jobs/lib
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
      - "@re-cinq/lore-stations"

  # The event-router is the bus's sole writer (ADR-044). Its shape is already
  # the one the Floor is being refactored towards: an entry, a transport tier,
  # and an outbound tier that reaches nothing above it.
  apps/event-router:
    ".":
      - transport
      - "@re-cinq/lore-shared"
    transport:
      - outbound
      - "@re-cinq/lore-shared"
    outbound:
      - "@re-cinq/lore-shared"

  # One cluster-agent per cluster: it watches Agent CRs and claims work. `kernel`
  # currently reaches `delivery` and `reap`, which is the substrate importing
  # upward — stated here as a leaf so the finding is visible rather than settled
  # by writing the tangle down.
  apps/cluster-agent:
    ".":
      - transport
      - events
      - work
      - outbound
      - "@re-cinq/lore-shared"
    transport:
      - domain
      - outbound
      - lib
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    # `listeners/` (the Agent-CR watch) and `claim/` (registration, heartbeat,
    # the claim loop) — both are how work arrives, so both are this tier.
    events:
      - work
      - domain
      - outbound
      - lib
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    work:
      - domain
      - outbound
      - lib
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    # Shared is listed because the CR contracts reference shared's pod/agent TYPES.
    # A package is not a tier above, so this is not an upward edge — but it is the
    # edge that closes properly only once libs/shared is itself tiered.
    domain:
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    outbound:
      - domain
      - lib
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    lib:
      - "@re-cinq/lore-shared"
    # A suite whose subject IS the collaboration between two tiers has to see
    # both; the repo already treats `integration-tests` as that place.
    integration-tests:
      - work
      - domain
      - outbound
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"

  # The pooled station service. `kernel` reaches `delivery` and `stations` today,
  # the same substrate-imports-upward shape as cluster-agent.
  apps/stations:
    ".":
      - transport
      - events
      - outbound
      - "@re-cinq/lore-shared"
    transport:
      - events
      - work
      - domain
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # Holds `runner/` as well as the drain loop. The runner picks a station and
    # invokes it, which is dispatch, not work — `work/` is one folder per station
    # and `registry.test.ts` enforces exactly that by enumerating the folder.
    events:
      - work
      - domain
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    work:
      - domain
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    domain: []
    outbound:
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"

  # The light business logic both deployables import (ADR-032).
  libs/server-core:
    ".":
      - platform
    platform:
      - "@re-cinq/lore-shared"
    features:
      - "."
      - platform
      - "@re-cinq/lore-shared"

  libs/assembly-lines:
    ".":
      - relay
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    relay:
      - "@re-cinq/lore-shared"

  # The stdio MCP adapter (ADR-032): it holds no pool, so every folder above
  # `features` is transport and the data work is a proxy call.
  apps/mcp-server:
    ".":
      - transport
      - "@re-cinq/lore-server-core"
    # The MCP protocol surface: 27 tool registrations, the server factory both
    # entry points call, the HTTP gateway and the skills registry it serves.
    # A way in, like http or cli elsewhere.
    transport:
      - work
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    work:
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"

  # The remote REST backend. `http` is the route-authoring toolkit — error
  # envelope, bearer scopes, zod request/response wiring, token + rate-limit
  # checks — which every route and the server both use; it lived under `server/`
  # and `api/routes/`, which made every route import the server it mounts into.
  # `server` builds the hapi tree, so it is the composition root and reaches the
  # routes; the routes must not reach back.
  apps/lore-api:
    ".":
      - app
      - outbound
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    # The hapi server and its plugins — the composition root, above transport
    # rather than inside it, so a route can never import the server that mounts it.
    app:
      - transport
      - work
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    # Routes, the HTTP plumbing they share (auth, rate-limit, zod), and the
    # OpenAPI document generated from them. `tests` is what a *.test.ts here may
    # ALSO reach: 54 route tests inject through the built server, which is the
    # hapi idiom for exercising a route in situ. One list cannot say both.
    transport:
      imports:
        - work
        - outbound
        - "@re-cinq/lore-assembly-lines"
        - "@re-cinq/lore-server-core"
        - "@re-cinq/lore-shared"
      tests:
        - app
        - integration-tests
    work:
      - outbound
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    outbound:
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    integration-tests:
      - transport
      - app
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"

  # The deliberately-wrong fixture package behind scripts/check-eslint-canaries.sh.
  # `kernel` is a leaf here so that src/kernel/a.ts importing ../jobs/ MUST be
  # reported; if it ever stops being reported, a rule has gone quiet.
  tools/eslint-canaries/pkg:
    kernel: []
    jobs:
      - kernel

  # The Next app. `lib` is the data and pure-logic tier, `components` the shared
  # presentational atoms, `app` the routes that compose them. Today all three
  # import each other; stated one-way so the cycle is a finding rather than a
  # description.
  apps/web-ui:
    lib:
      - "@re-cinq/lore-shared"
    components:
      - lib
      - "@re-cinq/lore-shared"
    app:
      - components
      - lib
      - "@re-cinq/lore-shared"

# A package that imports through a tsconfig path alias needs it declared, or the
# rule sees a bare specifier and skips it — 639 of web-ui's imports look like
# `@/lib/x`, so without this the package would be adopted and unchecked.
aliases:
  apps/web-ui:
    "@/": ""
