# The folder layering, enforced by `lore/no-cross-layer-import`.
#
# Each package maps a folder to the folders it may import. Four rules:
#   1. A key matches the folder it names and everything under it; `*` is one segment.
#   2. A folder may always import itself and its own descendants.
#   3. It may import what its list names, and nothing else.
#   4. The most specific matching key wins, so `jobs/lib` beats `jobs/*`.
#
# Sibling isolation needs no syntax: `jobs/*` lists `jobs/lib`, so `jobs/review`
# reaches lib and itself while `jobs/merge` is simply not on the list.
#
# A package absent from this file is not checked, so packages join one at a
# time. Inside a package that IS here, a folder with no entry may import
# nothing — that is what stops the file rotting as folders are added.
#
# npm and `node:` specifiers are never governed; package.json owns those.

layers:
  # The Floor is three event-bus layers over a shared substrate (ADR-015):
  # listeners write rows, the loop dispatches them, jobs handle them. `kernel`
  # is the substrate and reaches nothing; `delivery` is the process entry tier,
  # reachable only from index.ts because nothing else lists it.
  apps/floor:
    ".":
      - composition
      - delivery
      - jobs
      - kernel
      - listeners
      - main-loop
      - "@re-cinq/lore-shared"
    kernel:
      - "@re-cinq/lore-shared"
    listeners:
      - kernel
      - main-loop
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    main-loop:
      - jobs
      - kernel
      - listeners
      - "@re-cinq/lore-shared"
    composition:
      - jobs
      - kernel
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    delivery:
      - composition
      - jobs
      - kernel
      - listeners
      - main-loop
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The registry lives here, so the files directly under jobs/ wire handlers
    # to the loop; the per-domain folders below are narrower.
    jobs:
      - jobs/lib
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
      - "@re-cinq/lore-stations"
    # A leaf: shared helpers for the job domains, never a domain itself. It reads
    # the assembly-line definitions because the set of line names decides job
    # routing — the watcher and the wiring root are its only callers.
    jobs/lib:
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The walk is a coordinator, not a peer (ADR-024): it sequences the domains
    # and reacts to what a node finished with, so it posts a review, closes a
    # loop run, settles a task. It may reach a sibling domain; the reverse stays
    # forbidden by `jobs/*` below, which is what keeps this a tier rather than a
    # free-for-all — a domain that needs the walk has the dependency backwards.
    jobs/assembly-run:
      - jobs
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
      - "@re-cinq/lore-stations"
    # One domain per folder: a domain reaches lib and the substrate, never a
    # sibling domain, and never back up into the loop that dispatches it.
    jobs/*:
      - jobs/lib
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
      - "@re-cinq/lore-stations"

  # The event-router is the bus's sole writer (ADR-044). Its shape is already
  # the one the Floor is being refactored towards: an entry, a delivery tier,
  # and a substrate that reaches nothing above it.
  apps/event-router:
    ".":
      - delivery
      - "@re-cinq/lore-shared"
    delivery:
      - kernel
      - "@re-cinq/lore-shared"
    kernel:
      - "@re-cinq/lore-shared"

  # One cluster-agent per cluster: it watches Agent CRs and claims work. `kernel`
  # currently reaches `delivery` and `reap`, which is the substrate importing
  # upward — stated here as a leaf so the finding is visible rather than settled
  # by writing the tangle down.
  apps/cluster-agent:
    ".":
      - claim
      - delivery
      - inputs
      - kernel
      - listeners
      - reap
      - "@re-cinq/lore-shared"
    kernel:
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    listeners:
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    catalog:
      - claim
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"
    claim:
      - catalog
      - kernel
      - "@re-cinq/lore-shared"
    inputs:
      - kernel
      - listeners
      - "@re-cinq/lore-shared"
    reap:
      - claim
      - kernel
      - "@re-cinq/lore-shared"
    delivery:
      - kernel
      - "@re-cinq/agent-contracts"
      - "@re-cinq/lore-shared"

  # The pooled station service. `kernel` reaches `delivery` and `stations` today,
  # the same substrate-imports-upward shape as cluster-agent.
  apps/stations:
    ".":
      - delivery
      - drain
      - kernel
      - "@re-cinq/lore-shared"
    kernel:
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    stations:
      - kernel
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    drain:
      - kernel
      - stations
      - "@re-cinq/lore-shared"
    delivery:
      - kernel
      - "@re-cinq/lore-shared"
    cli:
      - stations
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"

  # The light business logic both deployables import (ADR-032).
  libs/server-core:
    ".":
      - platform
    platform:
      - "@re-cinq/lore-shared"
    features:
      - "."
      - platform
      - "@re-cinq/lore-shared"

  libs/assembly-lines:
    ".":
      - relay
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    relay:
      - "@re-cinq/lore-shared"
