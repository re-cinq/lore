# The folder layering, enforced by `lore/no-cross-layer-import`.
#
# Each package maps a folder to the folders it may import. Four rules:
#   1. A key matches the folder it names and everything under it; `*` is one segment.
#   2. A folder may always import itself and its own descendants.
#   3. It may import what its list names, and nothing else.
#   4. The most specific matching key wins, so `jobs/lib` beats `jobs/*`.
#
# Sibling isolation needs no syntax: `jobs/*` lists `jobs/lib`, so `jobs/review`
# reaches lib and itself while `jobs/merge` is simply not on the list.
#
# A package absent from this file is not checked, so packages join one at a
# time. Inside a package that IS here, a folder with no entry may import
# nothing — that is what stops the file rotting as folders are added.
#
# npm and `node:` specifiers are never governed; package.json owns those.

layers:
  # The pooled station service. `kernel` reaches `delivery` and `stations` today,
  # the same substrate-imports-upward shape.
  apps/stations:
    ".":
      - transport
      - events
      - outbound
      - code-review
      - planning
      - merge
      - digest
      - onboard
      - implementation-loop
      - spec-upkeep
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the code-review lines, one
    # folder each. They claim their own work from the floor's queue, so nothing
    # in `events/` or `transport/` reaches them.
    code-review:
      - domain
      - outbound
      - "@re-cinq/floor-client"
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the feature-planning line,
    # one folder each — the same claim-your-own-work shape as code-review. The
    # issue-filing logic lives beside its station, in `planning/file-issues`.
    planning:
      - domain
      - outbound
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the merge line: one handle
    # around the step logic beside it, registered once per step. `work` is
    # reached for what the merge-check sweep already knows about a merged task.
    merge:
      - outbound
      - work
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the daily-digest line, one
    # folder each, sharing one composition root.
    digest:
      - outbound
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the onboard line, one
    # folder each.
    onboard:
      - outbound
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the implementation-loop
    # line, one folder each.
    implementation-loop:
      - domain
      - outbound
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-shared"
    # The stations the external floor dispatches for the spec-upkeep line, one
    # folder each. `onboard` is reached for the request-review station, which
    # this line registers under its own name.
    spec-upkeep:
      - domain
      - outbound
      - onboard
      - "@re-cinq/floor-station"
      - "@re-cinq/lore-shared"
    transport:
      - events
      - work
      - domain
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    # Holds `runner/` as well as the drain loop. The runner picks a station and
    # invokes it, which is dispatch, not work — `work/` is one folder per station
    # and `registry.test.ts` enforces exactly that by enumerating the folder.
    events:
      - work
      - domain
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    work:
      - domain
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    domain: []
    outbound:
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"

  # The light business logic both deployables import (ADR-032).
  # libs/shared has the tier FOLDERS (transport / outbound / work / domain / lib)
  # but deliberately no entry yet. Thirteen modules still cross the wrong way —
  # `outbound/project/trace/trace-port.ts` needs `TraceDocument`, which lives in
  # `work/spec-trace/`, and twelve more of that shape. They are contracts two
  # tiers share, so they belong in `domain`; moving them is a refactor, not a
  # rename, and it is the follow-up that earns this package its entry.
  #
  # Adding the entry first would mean listing `work` under `outbound` to make
  # the errors go away, which is writing the tangle down rather than untangling
  # it. Until then shared stays the one surface the rule does not check.

  # The package every other one imports, tiered by the same vocabulary so the
  # rule reaches THROUGH it rather than stopping at its edge. Until now shared
  # was the one surface no entry described, which made it a way to reach any
  # tier from any tier.
  #
  # The 70 files still loose at src/ are deliberately not listed: they are the
  # `.` layer for now, and sorting them is the follow-up where the duplicate
  # hunting actually pays off.
  libs/shared:
    ".":
      - transport
      - outbound
      - work
      - domain
      - lib
    # Inbound request helpers — bearer checks, error envelopes, raw-body reads.
    # A way IN, which is why it is not filed with the adapters below.
    transport:
      - outbound
      - domain
      - lib
    # Every way out: the Project facade and its adapters, the pg pool, the
    # Kubernetes and Dgraph clients, the LLM providers, embeddings.
    # `outbound/floor` is the one importer of the floor's client: everything else
    # in Lore reaches the external floor through it.
    outbound:
      - domain
      - lib
      - test-helpers
      - "@re-cinq/agent-contracts"
      - "@re-cinq/floor-client"
    work:
      - outbound
      - domain
      - lib
      - test-helpers
      - "@re-cinq/agent-contracts"
      - "@re-cinq/floor-client"
    domain:
      - lib
      - "@re-cinq/agent-contracts"
    lib: []
    # In-memory doubles and fixtures. A leaf that only tests reach — listed so it
    # has an entry at all, since an unlisted folder may import nothing.
    test-helpers:
      - domain
      - lib

  libs/server-core:
    ".":
      - outbound
      - work
      - "@re-cinq/lore-shared"
    work:
      - outbound
      - "@re-cinq/lore-shared"
    outbound:
      - "@re-cinq/lore-shared"
    test-helpers: []

  libs/assembly-lines:
    ".":
      - relay
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-shared"
    relay:
      - "@re-cinq/lore-shared"
    floor-pipelines:
      - "@re-cinq/lore-shared"

  # The stdio MCP adapter (ADR-032): it holds no pool, so every folder above
  # `features` is transport and the data work is a proxy call.
  apps/mcp-server:
    ".":
      - transport
      - "@re-cinq/lore-server-core"
    # The MCP protocol surface: 27 tool registrations, the server factory both
    # entry points call, the HTTP gateway and the skills registry it serves.
    # A way in, like http or cli elsewhere.
    transport:
      - work
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    work:
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"

  # The remote REST backend. `http` is the route-authoring toolkit — error
  # envelope, bearer scopes, zod request/response wiring, token + rate-limit
  # checks — which every route and the server both use; it lived under `server/`
  # and `api/routes/`, which made every route import the server it mounts into.
  # `server` builds the hapi tree, so it is the composition root and reaches the
  # routes; the routes must not reach back.
  apps/lore-api:
    ".":
      - app
      - outbound
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
    # The hapi server and its plugins — the composition root, above transport
    # rather than inside it, so a route can never import the server that mounts it.
    app:
      - transport
      - work
      - outbound
      - "@re-cinq/lore-assembly-lines"
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
      - "@re-cinq/planning-sync"
    # Routes, the HTTP plumbing they share (auth, rate-limit, zod), and the
    # OpenAPI document generated from them. `tests` is what a *.test.ts here may
    # ALSO reach: 54 route tests inject through the built server, which is the
    # hapi idiom for exercising a route in situ. One list cannot say both.
    transport:
      imports:
        - work
        - outbound
        - "@re-cinq/lore-assembly-lines"
        - "@re-cinq/lore-server-core"
        - "@re-cinq/lore-shared"
        - "@re-cinq/planning-document"
      tests:
        - app
        - integration-tests
    # Plans are hosted by the published @re-cinq/planning-* packages
    # (planning-station); the ports and the plan contract are ordinary imports.
    work:
      - outbound
      - "@re-cinq/floor-client"
      - "@re-cinq/floor-pipeline"
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
      - "@re-cinq/planning-document"
      - "@re-cinq/planning-sync"
    outbound:
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
      - "@re-cinq/planning-document"
      - "@re-cinq/planning-sync"
      - "@re-cinq/planning-yjs"
    # A store adapter is proven against a real database, so its contract test
    # lives here and reaches the adapter directly.
    integration-tests:
      - transport
      - app
      - work
      - outbound
      - "@re-cinq/lore-server-core"
      - "@re-cinq/lore-shared"
      - "@re-cinq/planning-sync"

  # The deliberately-wrong fixture package behind scripts/check-eslint-canaries.sh.
  # `kernel` is a leaf here so that src/kernel/a.ts importing ../jobs/ MUST be
  # reported; if it ever stops being reported, a rule has gone quiet.
  tools/eslint-canaries/pkg:
    kernel: []
    jobs:
      - kernel

  # The Next app — the system's `ui` tier, and the one package the service
  # vocabulary does not describe. `transport / events / work / outbound` are
  # shapes a service has; a browser app has none of them, and bending it into
  # those names would say something untrue about every folder in it.
  #
  # Its internals keep the names they had: `lib` is the data and pure-logic
  # tier, `components` the shared presentational atoms, `app` the routes that
  # compose them. They are already one-way and already enforced, so refining
  # them into micro-tiers is a separate step, not a prerequisite for naming what
  # this package is.
  apps/web-ui:
    # Next.js pins the middleware to the source root; it reads the session rules from lib.
    ".":
      - lib
    # The plan contract (@re-cinq/planning-document) is data and logic, so lib
    # may read it; the editor (@re-cinq/planning-editor) is UI, so only the
    # routes that mount it may (ADR-047).
    lib:
      - "@re-cinq/lore-shared"
      - "@re-cinq/planning-document"
    components:
      - lib
      - "@re-cinq/lore-shared"
    app:
      - components
      - lib
      - "@re-cinq/lore-shared"
      - "@re-cinq/planning-document"
      - "@re-cinq/planning-editor"

# A package that imports through a tsconfig path alias needs it declared, or the
# rule sees a bare specifier and skips it — 639 of web-ui's imports look like
# `@/lib/x`, so without this the package would be adopted and unchecked.
aliases:
  apps/web-ui:
    "@/": ""
