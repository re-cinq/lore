name: Build and push Lore Floor

on:
  push:
    branches: [main]
    paths:
      - 'apps/floor/**'
      # The compiled `shared` package is bundled into the image — a shared-only
      # change must rebuild + redeploy, or the cluster runs stale shared code
      # while main is green (rediscovered 2026-06-11).
      - 'libs/shared/**'
      # The compiled assembly-lines kernel is bundled too (the agent imports
      # @re-cinq/lore-assembly-lines) — an assembly-lines-only change must rebuild + redeploy.
      - 'libs/assembly-lines/**'
      # The station registry is COMPILED INTO this image (the walk reads a node's
      # runtime from it / lore-api derives its maintenance jobs from it), so a
      # registry change must rebuild it — a filter that missed this would leave
      # CI green while the fix never ships.
      - 'apps/stations/**'
      # Chart or workflow changes need a redeploy too.
      - 'infra/terraform/modules/gke-mcp/lore-platform/charts/floor-helm/**'
      # Parent umbrella chart — a Chart.yaml/values.yaml change redeploys.
      - 'infra/terraform/modules/gke-mcp/lore-platform/Chart.yaml'
      - 'infra/terraform/modules/gke-mcp/lore-platform/values.yaml'
      - '.github/workflows/build-floor.yml'
      # task-types.yaml ships to the cluster as the lore-floor-config ConfigMap
      # via deploy-lore-platform.sh --set-file — a prompt edit must redeploy or
      # pods serve stale prompts (incident history in deploy-lore-platform.sh; #866).
      - 'scripts/task-types.yaml'
      - 'scripts/ci/deploy-lore-platform.sh'
  workflow_dispatch:

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-floor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/floor/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Serialize on Helm's release lock (retry while another service's deploy
      # holds it) instead of a GitHub concurrency group, which would cancel the
      # middle of 3 simultaneous deploys. See the script header.
      #
      # The resources block is passed as a -f overlay so it outranks the
      # release's stored user-supplied values — the release carries a legacy
      # lore-floor block that shadows values.yaml resource edits under
      # --reset-then-reuse-values (2026-08-03: the #1024 memory bump deployed
      # green and changed nothing, same class as the 2026-07-16 ai-agents
      # incident). Deliberately NARROW — only .resources, unlike the ai-agents
      # full-file overlay: a full lore-floor overlay would clobber the
      # terraform-supplied env and secret names (e.g. dbPasswordSecret is
      # lore-db-password in terraform vs lore-floor-db-password chart default).
      - name: Deploy floor into the umbrella release
        run: |
          yq -o=json '{"lore-floor": {"resources": .resources, "cronJobDefaults": {"resources": .cronJobDefaults.resources}}}' \
            infra/terraform/modules/gke-mcp/lore-platform/charts/floor-helm/values.yaml \
            > /tmp/floor-overlay.json
          bash scripts/ci/deploy-lore-platform.sh lore-floor "${{ needs.build.outputs.image_tag }}" lore-floor lore-floor "" /tmp/floor-overlay.json

  smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for rollout
        run: sleep 30
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
