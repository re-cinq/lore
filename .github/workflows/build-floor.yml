name: Build and push Lore Floor

on:
  push:
    branches: [main]
    paths:
      - 'apps/floor/**'
      # The compiled `shared` package is bundled into the image — a shared-only
      # change must rebuild + redeploy, or the cluster runs stale shared code
      # while main is green (rediscovered 2026-06-11).
      - 'libs/shared/**'
      # The compiled `runner` kernel is bundled too (the agent imports
      # @re-cinq/lore-runner) — a runner-only change must rebuild + redeploy.
      - 'libs/runner/**'
      # Chart or workflow changes need a redeploy too.
      - 'infra/terraform/modules/gke-mcp/lore-platform/charts/floor-helm/**'
      # Parent umbrella chart — a Chart.yaml/values.yaml change redeploys.
      - 'infra/terraform/modules/gke-mcp/lore-platform/Chart.yaml'
      - 'infra/terraform/modules/gke-mcp/lore-platform/values.yaml'
      - '.github/workflows/build-floor.yml'
  workflow_dispatch:

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-floor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/floor/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # All three service deploys upgrade the SAME umbrella release; serialize them
    # across workflows so two helm upgrades never collide ("another operation in
    # progress"). cancel-in-progress: false → queue, never drop a deploy.
    concurrency:
      group: helm-lore-platform-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Recover wedged release
        run: |
          # An interrupted prior deploy can strand the umbrella release in a
          # pending-* state that blocks the next upgrade ("another operation in
          # progress"). Clear the stranded revision record (in the lore-floor
          # home namespace) so the upgrade reconciles forward — live workloads
          # are left untouched.
          status=$(helm status lore-platform -n lore-floor -o json 2>/dev/null | jq -r '.info.status' || echo none)
          echo "[lore] current release status: ${status}"
          case "$status" in
            pending-*)
              echo "[lore] release wedged in ${status}; deleting stranded revision record."
              kubectl delete secret -n lore-floor -l "owner=helm,name=lore-platform,status=${status}" ;;
          esac

      - name: Helm upgrade (floor subchart of the umbrella release)
        run: |
          # ONE umbrella release for the whole platform; bump ONLY this service's
          # image tag. --reset-then-reuse-values (helm 3.14+) keeps the other
          # subcharts' tags and the terraform-supplied config intact. No --wait
          # (Autopilot wedges on it — see build-ui.yml); rollout gated below.
          helm upgrade --install lore-platform ./infra/terraform/modules/gke-mcp/lore-platform \
            --namespace lore-floor \
            --set lore-floor.image.tag=${{ needs.build.outputs.image_tag }} \
            --reset-then-reuse-values \
            --cleanup-on-fail

      - name: Wait for rollout
        run: kubectl rollout status deployment/lore-floor -n lore-floor --timeout=5m

  smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for rollout
        run: sleep 30
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
