name: Build and push Lore MCP gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_build-image.yml'
      - "apps/mcp-server/**"
      # The compiled shared + server-core packages are bundled into the image —
      # a lib-only change must rebuild + redeploy or the gateway runs stale code.
      - "libs/shared/**"
      - "libs/server-core/**"
      - "deploy/chart/charts/lore-mcp-helm/**"
      - "deploy/chart/Chart.yaml"
      - "deploy/chart/values.yaml"
      - ".github/workflows/build-mcp-server.yml"
      - "scripts/ci/bump-image-tag.sh"
  pull_request:
    paths:
      - '.github/workflows/_build-image.yml'
      - "apps/mcp-server/**"
      - "libs/shared/**"
      - "libs/server-core/**"
      - "deploy/chart/charts/lore-mcp-helm/**"
      - "deploy/chart/Chart.yaml"
      - "deploy/chart/values.yaml"
      - ".github/workflows/build-mcp-server.yml"
      - "scripts/ci/bump-image-tag.sh"
  workflow_dispatch:

concurrency:
  group: build-mcp-server-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-mcp

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: re-cinq/lore-mcp
      dockerfile: apps/mcp-server/Dockerfile
    secrets: inherit

  deploy:
    # A newer build of main supersedes an older one still waiting to deploy,
    # so a burst of merges ends in one tag bump per service.
    concurrency:
      group: deploy-lore-mcp-gateway
      cancel-in-progress: true
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # main takes only pull requests; bump-image-tag.sh opens and merges one.
      pull-requests: write
      # report-deploy-failure.sh files/updates a `deploy-failed` issue when this
      # job's deploy fails, so a service left on an old image is visible
      # outside the Actions tab (#1650).
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      # Argo CD on the cluster deploys the new tag from main (re-cinq/infrastructure, docs/deploying.md).
      - name: Record the lore-mcp image tag for Argo CD
        # Args: <subchart> <tag> <deployment> <namespace> <image_repo>. The gateway
        # Deployment is named lore-mcp but lives in the lore-api namespace (it reuses
        # that namespace's lore-ingest-token + ghcr-pull-secret), so NS is lore-api.
        run: bash scripts/ci/bump-image-tag.sh lore-mcp-gateway "${{ needs.build.outputs.image_tag }}"
