name: Build and push Lore Stations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_build-image.yml'
      - 'apps/stations/**'
      # The compiled `shared` package is bundled into the image — a shared-only
      # change must rebuild + redeploy, or the cluster runs stale shared code
      # while main is green.
      - 'libs/shared/**'
      # Compiled into this image: the review stations read its verdict parser.
      - 'libs/assembly-lines/**'
      - 'deploy/chart/charts/stations-helm/**'
      # Parent umbrella chart — a Chart.yaml/values.yaml change redeploys.
      - 'deploy/chart/Chart.yaml'
      - 'deploy/chart/values.yaml'
      - '.github/workflows/build-stations.yml'
      - 'scripts/ci/bump-image-tag.sh'
  workflow_dispatch:

concurrency:
  group: build-stations-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-stations

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: re-cinq/lore-stations
      dockerfile: apps/stations/Dockerfile
    secrets: inherit

  deploy:
    # A newer build of main supersedes an older one still waiting to deploy,
    # so a burst of merges ends in one tag bump per service.
    concurrency:
      group: deploy-lore-stations
      cancel-in-progress: true
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # main takes only pull requests; bump-image-tag.sh opens and merges one.
      pull-requests: write
      # report-deploy-failure.sh files/updates a `deploy-failed` issue when this
      # job's deploy fails, so a service left on an old image is visible
      # outside the Actions tab (#1650).
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      # Argo CD on the cluster deploys the new tag from main (re-cinq/infrastructure, docs/deploying.md).
      - name: Record the stations image tag for Argo CD
        run: |
          bash scripts/ci/bump-image-tag.sh lore-stations "${{ needs.build.outputs.image_tag }}"
