name: Lore test-report

# Spec-traceability test-report ingest for THIS repo, via the portable
# lore-code-trace binary — the same orchestrator onboarded repos download. CI sets
# up the toolchain (the manifest's list/run use node+vitest), fetches the binary
# from the mcp /dist route, and runs it --post, which POSTs the report to the Floor
# ci-tests ingress. Runs on push to main (the merged state) only.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lore-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-report:
    runs-on: ubuntu-latest
    # A cold runner takes ~24 minutes for the suite plus the per-file coverage
    # runs; the old 30 killed one merge in four before the report ever posted
    # (the ingest self-heals on the next success, but "one in four" was the
    # normal rate, not an outlier).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The incremental ingest diffs HEAD against the commit Lore last
          # absorbed; a shallow clone cannot reach it and would fall back to a
          # full report on every push.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The manifest's list/run scripts (node shared/scripts/trace/*.mjs) need the
      # deps + the built shared dist. mcp no longer builds here — the Go binary
      # replaces the trace:run-tests CLI.
      # --ignore-scripts (#1062): dep lifecycle scripts were the supply-chain
      # execution vector; nothing in the tree needs them (esbuild's binary comes
      # via optionalDependencies).
      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/web-ui --ignore-scripts

      - name: Build trace tooling
        run: npm run build -w @re-cinq/lore-shared

      # Fetch the orchestrator from the host this repo already talks to (mcp).
      - name: Fetch lore-code-trace
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
        run: |
          if [ -z "${LORE_API_URL}" ]; then
            echo "::warning::LORE_API_URL not set — skipping test ingest"; exit 0
          fi
          # Soft-fail the download: during the cutover rollout the mcp image may not
          # be serving /dist yet. Warn + skip (the run step is gated on the file)
          # rather than redden main; a later push picks it up once deployed.
          if ! curl -fsSL "${LORE_API_URL}/dist/lore-code-trace/linux-amd64" -o lore-code-trace; then
            echo "::warning::lore-code-trace not served at ${LORE_API_URL}/dist yet — skipping (pending mcp deploy)"
            rm -f lore-code-trace; exit 0
          fi
          curl -fsSL "${LORE_API_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          echo "$(awk '/ linux-amd64$/{print $1}' checksums.txt)  lore-code-trace" | sha256sum -c -
          chmod +x lore-code-trace

      - name: Run tests + ingest
        if: hashFiles('lore-code-trace') != ''
        env:
          # Incremental path: state fetch + delta POST to lore-api (no pods).
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          # Chunked-webhook fallback for a lore-api that predates the route.
          LORE_WEBHOOK_URL: ${{ vars.LORE_WEBHOOK_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          # Cold CI runners are slower than dev machines; give the full-suite list +
          # per-file coverage runs headroom over the 120s default.
          LORE_TRACE_TIMEOUT_MS: "600000"
        run: |
          if [ -z "${LORE_API_URL}" ] && [ -z "${LORE_WEBHOOK_URL}" ]; then
            echo "::warning::neither LORE_API_URL nor LORE_WEBHOOK_URL set — skipping test ingest"; exit 0
          fi
          # Hard-fail: a swallowed warning here let the ci-tests ingest 404 silently
          # for weeks (ingress only routed /api/webhook/github) and starved the
          # spec-impact graph. This runs on push to main only — red is pure signal.
          if ! ./lore-code-trace --post; then
            echo "::error::Lore test ingest failed — the spec-traceability graph is NOT receiving coverage"
            exit 1
          fi
