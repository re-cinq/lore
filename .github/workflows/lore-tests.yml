name: Lore test-report

# Spec-traceability test-report ingest for THIS repo, via the portable
# lore-code-trace binary — the same orchestrator onboarded repos download. CI sets
# up the toolchain (the manifest's list/run use node+vitest), fetches the binary
# from lore-api's /dist route, and runs it --post, which POSTs the report to
# lore-api's delta route. It runs on main only: coverage is ingested for the
# merged state, and a pull request's own CI already runs its tests. A push runs
# only the test files the change affects (the manifest's `related`); the weekly
# run and a dispatch run the whole suite, which heals anything the module graph
# missed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: lore-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-report:
    runs-on: ubuntu-latest
    # The whole suite with per-file coverage took ~24 minutes when 45 was
    # chosen; by 2026-10-02 it took 40 on a quiet runner and was cancelled at 45
    # when a merge started nine other workflows beside it. A push now runs only
    # the affected files, but the weekly full run, and a push that changes a
    # lockfile or the vitest setup, still run everything. Every run gets GitHub's
    # 6-hour maximum: a run uploads the whole difference since the commit Lore
    # last recorded, an upload cut short advances nothing, and a recorded commit
    # that fell far behind made every push upload the whole suite and be cut off
    # at 90 minutes (2026-10-27). A run that is caught up still takes minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The incremental ingest diffs HEAD against the commit Lore last
          # absorbed; a shallow clone cannot reach it and would fall back to a
          # full report on every push.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-ui/package-lock.json

      # The manifest's list/run scripts (node shared/scripts/trace/*.mjs) need the
      # deps + the built shared dist. mcp no longer builds here — the Go binary
      # replaces the trace:run-tests CLI.
      # --ignore-scripts (#1062): dep lifecycle scripts were the supply-chain
      # execution vector; nothing in the tree needs them (esbuild's binary comes
      # via optionalDependencies).
      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/web-ui --ignore-scripts

      - name: Build trace tooling
        run: npm run build -w @re-cinq/lore-shared

      # Fetch the orchestrator from the host this repo already talks to (lore-api).
      - name: Fetch lore-code-trace
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: |
          if [ -z "${LORE_INGEST_URL}" ]; then
            echo "::warning::LORE_INGEST_URL not set — skipping test ingest"; exit 0
          fi
          # Soft-fail the download: during the cutover rollout the mcp image may not
          # be serving /dist yet. Warn + skip (the run step is gated on the file)
          # rather than redden main; a later push picks it up once deployed.
          if ! curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o lore-code-trace; then
            echo "::warning::lore-code-trace not served at ${LORE_INGEST_URL}/dist yet — skipping (pending mcp deploy)"
            rm -f lore-code-trace; exit 0
          fi
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          echo "$(awk '/ linux-amd64$/{print $1}' checksums.txt)  lore-code-trace" | sha256sum -c -
          chmod +x lore-code-trace

      - name: Run tests + ingest
        if: hashFiles('lore-code-trace') != ''
        env:
          LORE_API_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          # Cold CI runners are slower than dev machines; give the full-suite list +
          # per-file coverage runs headroom over the 120s default.
          LORE_TRACE_TIMEOUT_MS: "600000"
          FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--full' || '' }}
        run: |
          ./lore-code-trace --post ${FULL} || echo "::warning::Lore test ingest failed"
