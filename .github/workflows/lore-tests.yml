name: Lore test-report

# Spec-traceability test-report ingest for THIS repo. Onboarded repos get an
# equivalent workflow seeded from LORE_TESTS_INSTRUCTION (shared/src/
# lore-tests-instruction.ts), which inlines the manifest list/run + POST
# because they don't ship the CLI. The platform repo DOES ship the CLI, so the
# proper form here reuses its own blessed entry point — `trace:run-tests
# --post` (mcp-server/package.json) — driven by .lore/test-commands.yml. It
# runs every test file once with V8 coverage and POSTs {commit,branch,tests,
# results} to /api/repos/<owner>/<repo>/test-report.
#
# Runs on push to main only (the merge commit) so the graph records the
# authoritative MERGED state, not transient PR branches — and full per-file
# coverage across all four packages is too heavy to run on every PR commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight graph-recording run on main.
  group: lore-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Workspaces (shared, agent, mcp-server) install from the root lockfile;
      # web-ui is not a workspace and has its own lockfile (see test.yml).
      - name: Install deps
        run: |
          npm ci
          npm install --prefix web-ui

      # shared/dist feeds the trace `list`/`run` scripts; mcp-server/dist is the
      # `trace:run-tests` CLI itself.
      - name: Build trace tooling
        run: |
          npm run build -w @re-cinq/lore-shared
          npm run build -w @re-cinq/lore-mcp

      - name: Collect coverage and POST test-report
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          # Cold CI runners are slower than dev machines; give the full-suite
          # list + per-file coverage runs headroom over the 120s default.
          LORE_TRACE_TIMEOUT_MS: "600000"
        # Soft-fail: a Lore outage must never fail this repo's own CI.
        run: npm run trace:run-tests -w @re-cinq/lore-mcp -- --post || echo "::warning::Lore test-report ingest failed"
