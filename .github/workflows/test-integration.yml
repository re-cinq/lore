name: Integration Tests

on:
  # No `branches` filter (#1146): stacked PRs must run the gate too, and
  # base-retarget after the parent merges emits only `edited`, which never
  # triggers. No `push: main` trigger — branch protection requires PRs, so the
  # PR run is the gate. A second run on the squash-merge commit would
  # be testing the same code (rediscovered 2026-04-29).
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR
# branch. Saves CI minutes during rapid-fire pushes.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lore
          POSTGRES_USER: lore
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --ignore-scripts

      # The integration suite imports lore-api's real route tree, which pulls in
      # the compiled @re-cinq/lore-shared + @re-cinq/lore-server-core via package
      # subpaths (e.g. @re-cinq/lore-server-core/platform/db.js → dist). Both libs
      # must be built before the suite runs (same rationale as test.yml).
      - name: Build libs
        run: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-server-core

      # The schema comes from the SAME place production gets it: the baseline
      # setup-*.sh scripts plus ui-helm/migrations in filename order, which is
      # exactly what scripts/infra/setup-local-schema.sh runs for local dev. It
      # used to be ~100 lines of DDL hand-written into this file, which meant
      # anything outside that subset could not be tested here at all (the
      # assembly-run tables, for one) and what WAS there could drift from
      # production silently — a test passing against an invented schema reports
      # confidence it has not earned.
      #
      # `tcp` transport because a job has no docker CLI for the service
      # container; the superuser is whatever POSTGRES_USER the service was given.
      # The database must be named `lore`: the setup-*.sh scripts connect with
      # `-d lore` by name, matching the cluster.
      - name: Set up test database (same source as production)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: lore
          PGPASSWORD: test
          PGDATABASE: lore
          LORE_SCHEMA_TRANSPORT: tcp
          LORE_SCHEMA_SUPERUSER: lore
        run: bash scripts/infra/setup-local-schema.sh

      # The port contract suite (specs/6-dark-factory FR6.43) runs its Postgres
      # half only against a migrated database. LORE_REQUIRE_PG_CONTRACT makes a
      # skip here a FAILURE — this job is the environment that is supposed to
      # exercise the SQL, so it must never quietly stop.
      - name: Port contract suite against real Postgres
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: lore
          PGPASSWORD: test
          PGDATABASE: lore
          LORE_REQUIRE_PG_CONTRACT: "1"
        run: npx vitest run --root libs/shared src/project/assembly-runs/assembly-runs.contract.test.ts


      - name: Run integration tests
        working-directory: apps/lore-api
        env:
          LORE_DB_HOST: localhost
          LORE_DB_PORT: 5432
          LORE_DB_NAME: lore
          LORE_DB_USER: lore
          LORE_DB_PASSWORD: test
        run: npx vitest run --config vitest.integration.config.ts
