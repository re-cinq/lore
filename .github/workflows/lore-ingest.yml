# lore-ingest-version: 3
# Lore's own ingest workflow — a deliberate superset of the canonical
# template (extra paths, hard-fail on unset URL). The version marker above
# is what the dashboard reads to mark this repo's ingest workflow aligned.
name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'adrs/**'
      - 'runbooks/**'
      - 'specs/**'
      - 'teams/**'
      - '.specify/**'
      - 'scripts/agent-prompts/**'
      - '.claude/skills/**'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changes
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Submit to Lore ingest API
        if: steps.changes.outputs.files != '[]'
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Misconfiguration (unset URL) is a hard error — a missing var must
          # never silently fall back to a placeholder and report success.
          if [ -z "${LORE_API_URL}" ]; then
            echo "::error::LORE_API_URL repository variable is not set — context was NOT ingested"
            exit 1
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${LORE_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"files\": ${FILES},
              \"repo\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\"
            }" \
            "${LORE_API_URL}/api/ingest" \
            || echo "::warning::Lore ingest endpoint returned an error (transient — not blocking merge)"

  # Spec/ADR → spec-traceability graph projection. Each kind is its own job
  # (parallel via the matrix) so specs and ADRs project independently. The CI
  # ingress is the Floor event bus: this POST registers an internal.ingest.spec_trace
  # event and the Floor loop projects it (no pipeline task). Soft-fail.
  graph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [specs, adrs]
    steps:
      - name: Project ${{ matrix.kind }} into the graph
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_WEBHOOK_URL: ${{ vars.LORE_WEBHOOK_URL }}
        run: |
          # Canary: doc projection moved to the Floor event-bus ingress. Until the
          # operator provisions LORE_WEBHOOK_URL (+ exposes the Floor ingress), this
          # repo hasn't cut over yet — warn and skip (the nightly reindex backstops),
          # don't red-fail main. A SET-but-broken URL still surfaces via curl below.
          if [ -z "${LORE_WEBHOOK_URL}" ]; then
            echo "::warning::LORE_WEBHOOK_URL not set — ${{ matrix.kind }} projection skipped (pending Floor ci-ingest cutover)"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${LORE_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"${{ github.repository }}\", \"kinds\": [\"${{ matrix.kind }}\"], \"commit\": \"${{ github.sha }}\"}" \
            "${LORE_WEBHOOK_URL}/api/webhook/ci-ingest" \
            || echo "::warning::Lore ci-ingest endpoint returned an error for ${{ matrix.kind }} (transient — not blocking merge)"
