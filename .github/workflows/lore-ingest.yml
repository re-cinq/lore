# lore-ingest-version: 5
# Lore's own ingest workflow — a deliberate superset of the canonical
# template (extra paths, manual dispatch, the lore-code-trace graph job)
# carrying the v4 hardened error handling in
# its ingest step. The version marker above is what the dashboard reads to
# mark this repo's ingest workflow aligned.
name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'adrs/**'
      - 'runbooks/**'
      - 'specs/**'
      - 'teams/**'
      - '.specify/**'
      # Which files are specs and ADRs; a change re-selects the whole corpus.
      - '.lore/ingest.yml'
      - 'scripts/agent-prompts/**'
      - '.claude/skills/**'
  # Manual lever: a push-to-main can silently fail to dispatch (a dropped GitHub
  # delivery leaves the ingested copy — and every derived spec-status pill —
  # stale until the next push). Dispatch re-ingests on demand: an empty `files`
  # input re-projects every tracked doc path (full refresh); a JSON array
  # re-ingests just those files.
  workflow_dispatch:
    inputs:
      files:
        description: 'JSON array of files to ingest; empty = re-ingest all tracked doc paths'
        required: false
        default: ''
      force_graph:
        description: 'Re-project every spec and ADR into the graph, even unchanged ones (after a parser change)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Get changed files
        id: changes
        env:
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_FILES}" ]; then
              FILES="${INPUT_FILES}"
            else
              # Full refresh: every tracked doc path in the tree (not a push diff),
              # so a manual run re-projects stale statuses regardless of what the
              # last commit touched.
              FILES=$(git ls-files -- \
                CLAUDE.md AGENTS.md adrs runbooks specs teams .specify \
                scripts/agent-prompts .claude/skills \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            fi
          else
            # --no-renames: a moved file must arrive as its old path (a delete)
            # plus its new path, or the old path's chunks outlive the file.
            FILES=$(git diff --name-only --no-renames HEAD~1 HEAD | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Submit to Lore ingest API
        if: steps.changes.outputs.files != '[]'
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Misconfiguration (unset URL) is a hard error — a missing var must
          # never silently fall back to a placeholder and report success.
          if [ -z "${LORE_API_URL}" ]; then
            echo "::error::LORE_API_URL repository variable is not set — context was NOT ingested"
            exit 1
          fi
          # Same class of misconfiguration: an unset token means every POST is
          # rejected with 401, which must never pass as a green run.
          if [ -z "${LORE_INGEST_TOKEN}" ]; then
            echo "::error::LORE_INGEST_TOKEN repository secret is not set — context was NOT ingested"
            exit 1
          fi
          # The Authorization header rides in a file so the token never
          # appears on the curl command line.
          AUTH_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${AUTH_FILE}" "${BODY_FILE}"' EXIT
          printf 'Authorization: Bearer %s\n' "${LORE_INGEST_TOKEN}" > "${AUTH_FILE}"
          # Capture the HTTP status instead of curl -f: a blanket warning once
          # masked a permanent 401 (unset token) as transient for a repo's
          # entire history. curl exits non-zero here only when no HTTP
          # response arrived, where -w prints 000.
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "${BODY_FILE}" -w "%{http_code}" -X POST \
            -H @"${AUTH_FILE}" \
            -H "Content-Type: application/json" \
            -d "{
              \"files\": ${FILES},
              \"repo\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\"
            }" \
            "${LORE_API_URL}/api/ingest") || CURL_EXIT=$?
          echo "Lore ingest endpoint returned HTTP ${HTTP_STATUS:-000} (curl exit ${CURL_EXIT})"
          # Prefix each body line with '| ': the runner strips leading
          # whitespace before parsing ::workflow-commands::, so only a
          # non-whitespace prefix stops a response body from forging one. The
          # echo keeps the annotations below on a fresh line even when the
          # body has no trailing newline.
          head -c 4096 "${BODY_FILE}" | sed 's/^/| /'
          echo
          # A URL that cannot be parsed (exit 3) or resolved (exit 6) is a
          # misconfigured LORE_API_URL, not a transient blip — hard-fail like
          # the unset checks above.
          if [ "${CURL_EXIT}" = "3" ] || [ "${CURL_EXIT}" = "6" ]; then
            echo "::error::curl could not reach ${LORE_API_URL} (exit ${CURL_EXIT}) — context was NOT ingested"
            exit 1
          fi
          case "${HTTP_STATUS}" in
            2??)
              ;;
            5??|408|429|000|"")
              # Server-side or network trouble is plausibly transient — warn,
              # and rely on the next doc push (or a manual dispatch) to retry.
              # This workflow runs on push to main and never blocks a merge.
              echo "::warning::Lore ingest endpoint returned HTTP ${HTTP_STATUS:-000} (transient — next doc push retries)"
              ;;
            *)
              # Anything else (4xx auth/config, unexpected redirects) is
              # permanent — a retry will not fix it, so fail the run.
              echo "::error::Lore ingest endpoint returned HTTP ${HTTP_STATUS} — context was NOT ingested"
              exit 1
              ;;
          esac

  # Spec/ADR → spec-traceability graph. lore-code-trace posts the changed
  # specs and ADRs, content inline, to lore-api, which projects them in-process
  # (specs/ci-incremental-ingest FR8): no event, no assembly run, no pod. The
  # graph holds one copy per repo, so only the default branch may write it.
  graph:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      # Full history: the delta is a diff against the last commit Lore ingested,
      # which a shallow clone cannot reach.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch lore-code-trace
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
        run: |
          if [ -z "${LORE_API_URL}" ]; then
            echo "::error::LORE_API_URL repository variable is not set — specs and ADRs were NOT projected"
            exit 1
          fi
          curl -fsSL "${LORE_API_URL}/dist/lore-code-trace/linux-amd64" -o lore-code-trace
          curl -fsSL "${LORE_API_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          echo "$(awk '/ linux-amd64$/{print $1}' checksums.txt)  lore-code-trace" | sha256sum -c -
          chmod +x lore-code-trace

      - name: Project specs and ADRs into the graph
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          FORCE: ${{ github.event.inputs.force_graph }}
        run: |
          # A binary older than the docs subcommand ignores the argument and
          # runs the test suite instead. Printing the selection proves the
          # subcommand exists before anything is posted.
          if ! ./lore-code-trace docs | jq -e 'has("specs") and has("adrs")' > /dev/null; then
            echo "::error::the served lore-code-trace has no docs subcommand — specs and ADRs were NOT projected"
            exit 1
          fi
          if [ "${FORCE}" = "true" ]; then
            ./lore-code-trace docs --post --force
          else
            ./lore-code-trace docs --post
          fi
