name: Release

# Pushing a tag vX.Y.Z on a commit of main gives every Lore image that version
# tag. Nothing is rebuilt: scripts/ci/release-images.sh adds the tag to the
# images the cluster values file says our own cluster runs.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Tag is vMAJOR.MINOR.PATCH
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH, e.g. v1.0.0"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not on main. Tag a commit of main."
            exit 1
          fi

      - name: Install chart pins this version
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/ci/check-install-pins.sh "$TAG"

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      table: ${{ steps.release.outputs.table }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Tag the images
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/ci/release-images.sh "$TAG" | tee release.log
          {
            echo "table<<EOF"
            grep '^|' release.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify every version tag has its source digest
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/ci/release-images.sh "$TAG" --verify

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TABLE: ${{ needs.images.outputs.table }}
        run: |
          printf 'Images, all at `%s`:\n\n%s\n' "$TAG" "$TABLE" > notes.md
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --notes-file notes.md
