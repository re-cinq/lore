name: Build and push Lore Cluster Agent

on:
  push:
    branches: [main]
    paths:
      - 'apps/cluster-agent/**'
      # The compiled `shared` package is bundled into the image — a shared-only
      # change must rebuild + redeploy, or the cluster runs stale shared code
      # while main is green.
      - 'libs/shared/**'
      - 'infra/terraform/modules/gke-mcp/lore-platform/charts/cluster-agent-helm/**'
      # Parent umbrella chart — a Chart.yaml/values.yaml change redeploys.
      - 'infra/terraform/modules/gke-mcp/lore-platform/Chart.yaml'
      - 'infra/terraform/modules/gke-mcp/lore-platform/values.yaml'
      - '.github/workflows/build-cluster-agent.yml'
      - 'scripts/ci/deploy-lore-platform.sh'
      - 'scripts/ci/helm-lock-contention.sh'
  workflow_dispatch:

concurrency:
  group: build-cluster-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-cluster-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cluster-agent/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Serialized on Helm's release lock inside the script, not by a GitHub
      # concurrency group — see the script header for why.
      - name: Deploy cluster-agent into the umbrella release
        run: |
          bash scripts/ci/deploy-lore-platform.sh \
            lore-cluster-agent "${{ needs.build.outputs.image_tag }}" \
            lore-cluster-agent lore-cluster-agent ghcr.io/re-cinq/lore-cluster-agent
