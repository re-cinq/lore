name: Agent PR Review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  review:
    if: contains(github.event.label.name, 'agent-generated')
    runs-on: ubuntu-latest
    steps:
      # PR-controlled values (title, branch) come from env so they are never
      # interpolated into the shell command, and jq JSON-encodes them so they
      # cannot break out of the request body either.
      - name: Trigger review agent
        env:
          LORE_MCP_ENDPOINT: ${{ secrets.LORE_MCP_ENDPOINT }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        # shell: bash enables pipefail, so a jq failure is not masked by curl.
        shell: bash
        run: |
          jq -n \
            --arg description "Review PR #${PR_NUMBER}: ${PR_TITLE}. Check against Lore context, ADRs, and conventions. Post review comments on the PR." \
            --arg repo "$REPO" \
            --arg branch "$HEAD_REF" \
            '{
              jsonrpc: "2.0",
              id: 1,
              method: "tools/call",
              params: {
                name: "lore_create_pipeline_task",
                arguments: {
                  description: $description,
                  task_type: "review",
                  target_repo: $repo,
                  context: {
                    branch: $branch
                  }
                }
              }
            }' \
          | curl -sf -X POST "$LORE_MCP_ENDPOINT/mcp" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d @- || echo "Warning: Could not reach Lore MCP endpoint"
