name: Build and push Lore UI

on:
  push:
    # No `paths:` filter here on purpose. GitHub's push-event path filtering
    # silently skipped this workflow on the #524 merge (2026-06-10), leaving
    # the cluster on a 5-day-old UI image with no failure anywhere. The one
    # workflow that DEPLOYS must never be gated by a mechanism that can no-show
    # without a trace, so we always trigger on main and decide build-vs-skip in
    # the `changes` job below with a deterministic in-runner git diff.
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/_build-image.yml'
      - 'apps/web-ui/**'
      - 'deploy/chart/charts/ui-helm/**'
      - 'deploy/chart/Chart.yaml'
      - 'deploy/chart/values.yaml'
      - '.github/workflows/build-ui.yml'
  workflow_dispatch:

concurrency:
  group: build-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-ui

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: diff
        run: |
          # PR runs are already path-filtered by the trigger; dispatch is manual.
          case "${{ github.event_name }}" in
            workflow_dispatch|pull_request)
              echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          base="${{ github.event.before }}"
          # Unknown/absent base (first push, force-push) → build to be safe.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" \
               | grep -qE '^(apps/web-ui/|deploy/chart/(charts/ui-helm/|Chart\.yaml|values\.yaml)|\.github/workflows/(build-ui|_build-image)\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: re-cinq/lore-ui
      context: apps/web-ui
      dockerfile: apps/web-ui/Dockerfile
      build_args: GIT_SHA=${{ needs.changes.outputs.short_sha }}
    secrets: inherit

  deploy:
    # A newer build of main supersedes an older one still waiting to deploy,
    # so a burst of merges ends in one tag bump per service.
    concurrency:
      group: deploy-lore-ui
      cancel-in-progress: true
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # main takes only pull requests; bump-image-tag.sh opens and merges one.
      pull-requests: write
      # report-deploy-failure.sh files/updates a `deploy-failed` issue when this
      # job's deploy fails, so a service left on an old image is visible
      # outside the Actions tab (#1650).
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      # Argo CD on the cluster deploys the new tag from main (re-cinq/infrastructure, docs/deploying.md).
      - name: Record the ui image tag for Argo CD
        run: bash scripts/ci/bump-image-tag.sh lore-ui "${{ needs.build.outputs.image_tag }}"

      - name: Notify Slack
        if: always()
        env:
          # Reuse the Lore Slack bot (one Slack identity). chat.postMessage takes
          # a channel ID, so this can target any channel the bot is a member of.
          TOKEN: ${{ secrets.LORE_SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.LORE_DEPLOY_SLACK_CHANNEL }}
          STATUS: ${{ job.status }}
          SHA: ${{ needs.build.outputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No-op when the token/channel aren't configured, so the deploy never
          # fails just because notifications aren't wired up.
          if [ -z "$TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "[lore] LORE_SLACK_BOT_TOKEN or LORE_DEPLOY_SLACK_CHANNEL unset; skipping deploy notification."
            exit 0
          fi
          text="lore-ui deploy *${STATUS}* — \`${SHA}\` (<${RUN_URL}|run log>)"
          payload=$(printf '{"channel":"%s","text":"%s"}' "$CHANNEL" "$text")
          # chat.postMessage returns HTTP 200 even on logical failure, so assert ok:true.
          resp=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$payload" || echo '{"ok":false,"error":"curl_failed"}')
          echo "$resp" | grep -q '"ok":true' \
            || echo "[lore] Slack notification failed (non-fatal): ${resp}"

  smoke:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the live UI is serving the built commit
        env:
          UI_URL: ${{ vars.LORE_UI_URL }}
          EXPECTED: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$UI_URL" ]; then
            echo "[lore] LORE_UI_URL var unset; skipping version assertion."
            exit 0
          fi
          # The public LB may briefly serve the old pod during rollover; poll.
          for attempt in $(seq 1 12); do
            live=$(curl -sf "${UI_URL%/}/api/version" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "[lore] attempt ${attempt}: live=${live:-<none>} expected=${EXPECTED}"
            [ "$live" = "$EXPECTED" ] && { echo "[lore] live UI serves ${EXPECTED}."; exit 0; }
            sleep 15
          done
          echo "[lore] live UI never reported ${EXPECTED} (deploy lagging or failed)."
          exit 1
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
