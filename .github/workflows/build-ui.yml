name: Build and push Lore UI

on:
  push:
    # No `paths:` filter here on purpose. GitHub's push-event path filtering
    # silently skipped this workflow on the #524 merge (2026-06-10), leaving
    # the cluster on a 5-day-old UI image with no failure anywhere. The one
    # workflow that DEPLOYS must never be gated by a mechanism that can no-show
    # without a trace, so we always trigger on main and decide build-vs-skip in
    # the `changes` job below with a deterministic in-runner git diff.
    branches: [main]
  pull_request:
    paths:
      - 'apps/web-ui/**'
      - 'infra/terraform/modules/gke-mcp/ui-helm/**'
      - '.github/workflows/build-ui.yml'
  workflow_dispatch:

concurrency:
  group: build-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-ui

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: diff
        run: |
          # PR runs are already path-filtered by the trigger; dispatch is manual.
          case "${{ github.event_name }}" in
            workflow_dispatch|pull_request)
              echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          base="${{ github.event.before }}"
          # Unknown/absent base (first push, force-push) → build to be safe.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" \
               | grep -qE '^(apps/web-ui/|infra/terraform/modules/gke-mcp/ui-helm/|\.github/workflows/build-ui\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/web-ui
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short_sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          # --reset-then-reuse-values (helm 3.14+) preserves user --set
          # overrides while picking up new chart defaults from values.yaml.
          helm upgrade --install lore-ui ./infra/terraform/modules/gke-mcp/ui-helm \
            --namespace lore-ui \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --reset-then-reuse-values \
            --wait --timeout 10m

      - name: Notify Slack
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          STATUS: ${{ job.status }}
          SHA: ${{ needs.build.outputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No-op when the webhook secret isn't configured, so the deploy never
          # fails just because notifications aren't wired up.
          [ -n "$WEBHOOK" ] || { echo "[lore] SLACK_DEPLOY_WEBHOOK unset; skipping deploy notification."; exit 0; }
          text="lore-ui deploy *${STATUS}* — \`${SHA}\` (<${RUN_URL}|run log>)"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${text}\"}" "$WEBHOOK" \
            || echo "[lore] Slack notification failed (non-fatal)."

  smoke:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the live UI is serving the built commit
        env:
          UI_URL: ${{ vars.LORE_UI_URL }}
          EXPECTED: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$UI_URL" ]; then
            echo "[lore] LORE_UI_URL var unset; skipping version assertion."
            exit 0
          fi
          # The public LB may briefly serve the old pod during rollover; poll.
          for attempt in $(seq 1 12); do
            live=$(curl -sf "${UI_URL%/}/api/version" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "[lore] attempt ${attempt}: live=${live:-<none>} expected=${EXPECTED}"
            [ "$live" = "$EXPECTED" ] && { echo "[lore] live UI serves ${EXPECTED}."; exit 0; }
            sleep 15
          done
          echo "[lore] live UI never reported ${EXPECTED} (deploy lagging or failed)."
          exit 1
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
