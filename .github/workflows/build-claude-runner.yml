name: Build and push Claude Runner

on:
  push:
    branches: [main]
    paths:
      - 'infra/docker/claude-runner/**'
      - 'apps/mcp-server/src/features/repo/repo-validation.ts'
      - 'apps/mcp-server/src/features/repo/repo-validation-cli.ts'
      - 'apps/agent/**'
      - 'libs/shared/**'
      - 'libs/runner/**'
      - 'scripts/task-types.yaml'
  workflow_dispatch:

concurrency:
  group: build-claude-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-claude-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load locally for smoke tests; push only on main)
        id: build
        # Single build step that loads to the local Docker daemon AND
        # conditionally pushes to GHCR. buildx supports `load: true` +
        # `push: true` together, so the smoke-tested image is byte-
        # identical to the pushed image. Two separate build-push-action
        # invocations would risk drift if anything between them changed.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/claude-runner/Dockerfile
          load: true
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image ref for smoke tests
        id: tag
        # Reference the built image by its image ID, not by a tag.
        # `meta.outputs.tags` is multi-line, and `type=sha,prefix=`
        # emits the SHORT sha (e.g. 3691a16) while `github.sha` is the
        # full 40-char sha — reconstructing the tag from `github.sha`
        # asks Docker for a manifest that was never built (exit 125).
        # The image ID from the build step is unambiguous and tag-
        # independent, so `docker run` always hits the just-built image.
        run: |
          echo "image=${{ steps.build.outputs.imageid }}" >> "$GITHUB_OUTPUT"

      - name: Smoke test — runner-cli env-missing → exit 9
        # Exercises that /app/dist/delivery/runner-cli.js is present
        # and the documented exit-code matrix (PR #310 review fix) is
        # honored. Running with no env vars + LORE_DARK_FACTORY_WORKFLOW
        # unset triggers MissingEnvError → exit 9.
        run: |
          set +e
          docker run --rm --entrypoint node "${{ steps.tag.outputs.image }}" \
            /app/dist/delivery/runner-cli.js
          rc=$?
          set -e
          if [ "$rc" != "9" ]; then
            echo "expected exit 9 (env_missing) from runner-cli with no env, got $rc"
            exit 1
          fi
          echo "runner-cli exit-code matrix verified (env_missing → 9)"

      - name: Smoke test — workflow YAMLs present
        # Confirms libs/runner/src/workflows/*.yaml made it to
        # /app/libs/runner/dist/workflows/ — the path loadBuiltinWorkflows()
        # resolves relative to its compiled module. If the runner kernel's
        # copy:workflows build step is dropped, runner-cli would exit 3
        # (workflow_load_failed) on every invocation.
        run: |
          docker run --rm --entrypoint sh "${{ steps.tag.outputs.image }}" -c \
            'ls /app/libs/runner/dist/workflows/*.yaml' \
            | tee /tmp/workflows.txt
          test -s /tmp/workflows.txt

      - name: Smoke test — runtime imports load + workflow lookup runs
        # The previous two tests cover "files exist" but not "the import
        # graph actually resolves." If `pg`, `@kubernetes/client-node`,
        # or any transitive runtime dep was lost during the prune step,
        # runner-cli would crash at module-load before requireEnv ever
        # ran — and exit-9 would hide it. This one provides all required
        # env vars + a fake git workdir, points at a workflow that
        # doesn't exist, expects exit 4 (workflow_not_found). Reaching
        # that branch proves: deps imported, loadTaskTypes ran,
        # loadWorkflowDir found the YAML directory, and the workflow
        # registry is queryable.
        run: |
          set +e
          docker run --rm \
            -e LORE_DARK_FACTORY_WORKFLOW=does-not-exist \
            -e LORE_TASK_ID=t1 \
            -e TARGET_REPO=x/y \
            -e BRANCH_NAME=lore/test/x \
            -e TASK_DESCRIPTION=d \
            -e TASK_TYPE=gap-fill \
            -e WORKDIR=/tmp/repo \
            --entrypoint sh \
            "${{ steps.tag.outputs.image }}" -c \
            'mkdir -p /tmp/repo/.git && exec node /app/dist/delivery/runner-cli.js'
          rc=$?
          set -e
          if [ "$rc" != "4" ]; then
            echo "expected exit 4 (workflow_not_found), got $rc"
            echo "  rc=1 → uncaught exception (likely missing runtime dep)"
            echo "  rc=2 → workdir guard fired before workflow lookup (.git mkdir failed?)"
            echo "  rc=3 → loadWorkflowDir threw (YAMLs missing or unparseable)"
            echo "  rc=9 → MissingEnvError (env wiring bug in this step)"
            exit 1
          fi
          echo "runtime-imports + workflow loader verified (workflow_not_found → 4)"
