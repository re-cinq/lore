name: Unit Tests

on:
  pull_request:
    branches: [main]
  # No `push: main` trigger — branch protection requires PRs, so the PR run
  # is the gate (same rationale as test-integration.yml). Integration tests
  # (Postgres-backed) live in test-integration.yml, not here.
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One independent run per subproject — a red suite must not mask the others.
      fail-fast: false
      matrix:
        include:
          - name: shared
            test: npm test -w @re-cinq/lore-shared
          # The runner imports compiled @re-cinq/lore-shared (via subpaths),
          # so shared must be built before its suite runs.
          - name: runner
            build: npm run build -w @re-cinq/lore-shared
            test: npm run test:coverage -w @re-cinq/lore-runner
          # server-core imports compiled @re-cinq/lore-shared, so shared first.
          - name: server-core
            build: npm run build -w @re-cinq/lore-shared
            test: npm test -w @re-cinq/lore-server-core
          # mcp-server (local adapter) and lore-api (remote REST) both import the
          # compiled @re-cinq/lore-shared + @re-cinq/lore-server-core, so both
          # libs must be built before their suites run.
          - name: mcp-server
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-server-core
            test: npm test -w @re-cinq/lore-mcp
          - name: lore-api
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-server-core
            test: npm test -w @re-cinq/lore-api
          # agent also imports the compiled @re-cinq/lore-runner kernel, so
          # both shared and runner must be built before its suite runs.
          - name: agent
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-runner
            test: npm run test:coverage -w @re-cinq/lore-floor
          # Catalog drift guard. The seeded ai-agents-helm catalog.yaml is generated
          # from scripts/task-types.yaml by floor's gen:catalog; this fails the moment
          # a recipe edit lands without regenerating the catalog. The script builds
          # floor + regenerates itself, so it only needs shared + runner prebuilt.
          - name: catalog-drift
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-runner
            test: bash scripts/check-catalog-drift.sh
          # web-ui is NOT an npm workspace — it has its own lockfile and does
          # not depend on @re-cinq/lore-shared. Install and test in-place.
          - name: web-ui
            install: npm install --prefix apps/web-ui
            # Run with coverage so the vitest.config.ts thresholds gate CI.
            test: npm run test:coverage --prefix apps/web-ui
          # Type-mirror drift guard. web-ui can't import @re-cinq/lore-shared, so it
          # hand-mirrors the feature-planning types — this typecheck fails the moment
          # the canonical shared types gain a key (or a status union changes) the
          # mirror lacks. Reads both trees' source directly; no build needed.
          - name: type-drift
            test: npm run typecheck:drift

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: ${{ matrix.install || 'npm install' }}

      - name: Build shared
        if: ${{ matrix.build }}
        run: ${{ matrix.build }}

      - name: Run tests
        run: ${{ matrix.test }}
