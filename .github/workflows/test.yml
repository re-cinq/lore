name: Unit Tests

on:
  pull_request:
    branches: [main]
  # No `push: main` trigger — branch protection requires PRs, so the PR run
  # is the gate (same rationale as test-integration.yml). Integration tests
  # (Postgres-backed) live in test-integration.yml, not here.
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One independent run per subproject — a red suite must not mask the others.
      fail-fast: false
      matrix:
        include:
          - name: shared
            test: npm test -w @re-cinq/lore-shared
          # mcp-server and agent import the compiled @re-cinq/lore-shared,
          # so shared must be built before their suites run.
          - name: mcp-server
            build: npm run build -w @re-cinq/lore-shared
            test: npm test -w @re-cinq/lore-mcp
          - name: agent
            build: npm run build -w @re-cinq/lore-shared
            test: npm test -w @re-cinq/lore-agent
          # web-ui is NOT an npm workspace — it has its own lockfile and does
          # not depend on @re-cinq/lore-shared. Install and test in-place.
          - name: web-ui
            install: npm install --prefix web-ui
            test: npm test --prefix web-ui

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: ${{ matrix.install || 'npm install' }}

      - name: Build shared
        if: ${{ matrix.build }}
        run: ${{ matrix.build }}

      - name: Run tests
        run: ${{ matrix.test }}
