name: Build and push Lore MCP server

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      # The compiled `shared` package is bundled into the image — a shared-only
      # change must rebuild + redeploy, or the cluster runs stale shared code
      # while main is green (rediscovered 2026-06-11: AC-traceability fix lived
      # in shared/ only, so mcp/agent never rebuilt and prod stayed broken).
      - 'shared/**'
      # Chart or workflow changes need a redeploy too — without this,
      # a chart-only PR merges to main and nothing redeploys, leaving
      # the cluster on old code forever (rediscovered 2026-04-29).
      - 'infra/terraform/modules/gke-mcp/mcp-helm/**'
      - '.github/workflows/build-mcp.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'shared/**'
      - 'infra/terraform/modules/gke-mcp/mcp-helm/**'
      - '.github/workflows/build-mcp.yml'
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref —
# but never cancel the deploy on main, that always runs to completion.
concurrency:
  group: build-mcp-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mcp-server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          # --reset-then-reuse-values (helm 3.14+) preserves user --set
          # overrides while picking up new chart defaults from values.yaml.
          # Plain --reuse-values would skip new chart-level additions like
          # podDisruptionBudget and crash on nil-pointer evals.
          helm upgrade --install lore-mcp ./infra/terraform/modules/gke-mcp/mcp-helm \
            --namespace mcp-servers \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --reset-then-reuse-values \
            --wait --timeout 5m

  smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for rollout
        run: sleep 30
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
