name: DB Migrations

# Guards against a migration that would fail the ui-helm pre-install/pre-upgrade
# hook Job and wedge the UI deploy (helm upgrade --wait). Reproduces the COMPLETE
# baseline (setup-local-schema.sh runs the real setup-*-schema.sh via a
# kubectl->docker shim) and then applies every migration in filename order the
# same way the hook does — as role `lore`, single transaction, tracked in
# lore.schema_migrations — then re-applies the newest file to prove idempotency.
# Zero baseline duplication: it uses the same scripts as local dev / the cluster.
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/modules/gke-mcp/lore-platform/charts/ui-helm/migrations/**'
      - 'scripts/infra/setup-*.sh'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      LORE_PG_CONTAINER: lore-postgres
      MIGRATIONS_DIR: infra/terraform/modules/gke-mcp/lore-platform/charts/ui-helm/migrations
    steps:
      - uses: actions/checkout@v5

      - name: Start Postgres (pgvector) as a named docker container
        run: |
          docker run -d --name "$LORE_PG_CONTAINER" \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lore \
            pgvector/pgvector:pg16
          for i in $(seq 1 60); do
            docker exec "$LORE_PG_CONTAINER" pg_isready -U postgres -d lore >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Apply full baseline + all migrations (real path, as role lore)
        run: bash scripts/infra/setup-local-schema.sh

      # 0035 runs against an empty lore.repos during the pass above, so its
      # data movement is exercised here: seed the legacy-row shape from issue
      # #979, prove the ungranted runner skips WITHOUT deleting anything, then
      # apply the one-time operator grant from migrations/README.md, re-apply
      # the file directly (same pattern as the idempotency step), and assert
      # the move semantics.
      - name: Fixture — 0035 moves legacy org_shared rows into the team schema
        run: |
          set -eu
          docker exec -i "$LORE_PG_CONTAINER" psql -U postgres -d lore -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON org_shared.chunks FROM lore;
          INSERT INTO lore.repos (owner, name, full_name, team)
          VALUES ('re-cinq', 'fixture-979', 're-cinq/fixture-979', 'platform');
          INSERT INTO platform.chunks (id, content, content_type, team, repo, file_path, metadata)
          VALUES ('11111111-1111-1111-1111-111111111111', 'fresh spec chunk', 'spec', 'platform',
                  're-cinq/fixture-979', 'specs/x/spec.md', '{"ingested_by": "reindex-job"}'::jsonb);
          INSERT INTO org_shared.chunks (id, content, embedding, content_type, team, repo, file_path, ingested_at, metadata)
          VALUES ('22222222-2222-2222-2222-222222222222', 'stale duplicate spec chunk',
                  array_fill(0.25::float8, ARRAY[768])::vector, 'spec', 'org_shared',
                  're-cinq/fixture-979', 'specs/x/spec.md', now() - interval '400 days', NULL),
                 ('33333333-3333-3333-3333-333333333333', 'legacy code chunk only in org_shared',
                  array_fill(0.5::float8, ARRAY[768])::vector, 'code', 'org_shared',
                  're-cinq/fixture-979', 'src/main.ts', now() - interval '400 days', NULL),
                 ('44444444-4444-4444-4444-444444444444', 'legacy rule chunk with a pseudo path',
                  NULL, 'rule', 'org_shared',
                  're-cinq/fixture-979', 'rules/team-conventions', now() - interval '400 days', NULL);
          SQL
          echo "[migrate] applying 0035 as role lore WITHOUT the DML grant — must skip, never delete"
          docker exec -i "$LORE_PG_CONTAINER" psql -U lore -d lore -v ON_ERROR_STOP=1 --single-transaction -f - \
            < "$MIGRATIONS_DIR/0035_migrate_legacy_org_shared_chunks.sql"
          docker exec -i "$LORE_PG_CONTAINER" psql -U postgres -d lore -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM org_shared.chunks WHERE repo = 're-cinq/fixture-979') <> 3
               OR (SELECT count(*) FROM platform.chunks WHERE repo = 're-cinq/fixture-979') <> 1 THEN
              RAISE EXCEPTION 'the ungranted run must leave both tables untouched';
            END IF;
          END $$;
          SQL
          echo "[migrate] granting DML per migrations/README.md, then re-applying 0035 as role lore"
          docker exec -i "$LORE_PG_CONTAINER" psql -U postgres -d lore -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, DELETE ON ALL TABLES IN SCHEMA org_shared, platform, payments, mobile, data TO lore;"
          docker exec -i "$LORE_PG_CONTAINER" psql -U lore -d lore -v ON_ERROR_STOP=1 --single-transaction -f - \
            < "$MIGRATIONS_DIR/0035_migrate_legacy_org_shared_chunks.sql"
          docker exec -i "$LORE_PG_CONTAINER" psql -U postgres -d lore -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            leftover INTEGER;
            files INTEGER;
            rows_total INTEGER;
            moved RECORD;
            rule_row RECORD;
          BEGIN
            SELECT count(*) INTO leftover FROM org_shared.chunks WHERE repo = 're-cinq/fixture-979';
            IF leftover <> 0 THEN
              RAISE EXCEPTION 'org_shared still holds % rows for the fixture repo', leftover;
            END IF;

            SELECT count(*), count(DISTINCT file_path) INTO rows_total, files
            FROM platform.chunks WHERE repo = 're-cinq/fixture-979';
            IF rows_total <> 3 OR files <> 3 THEN
              RAISE EXCEPTION 'expected one platform row per file_path (3 files), got % rows / % files', rows_total, files;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM platform.chunks
              WHERE id = '11111111-1111-1111-1111-111111111111'
                AND file_path = 'specs/x/spec.md' AND content = 'fresh spec chunk'
            ) THEN
              RAISE EXCEPTION 'the fresh team-schema spec row was not preserved';
            END IF;

            SELECT * INTO moved FROM platform.chunks
            WHERE id = '33333333-3333-3333-3333-333333333333';
            IF moved IS NULL THEN
              RAISE EXCEPTION 'the non-duplicated org_shared code row did not keep its id in platform';
            END IF;
            IF moved.embedding IS NULL
               OR moved.embedding <> array_fill(0.5::float8, ARRAY[768])::vector THEN
              RAISE EXCEPTION 'the moved row lost its embedding';
            END IF;
            IF moved.metadata->>'ingested_by' IS DISTINCT FROM 'reindex-job'
               OR moved.metadata->>'migrated_from' IS DISTINCT FROM 'org_shared' THEN
              RAISE EXCEPTION 'the moved row is missing ingested_by/migrated_from markers: %', moved.metadata;
            END IF;
            IF moved.team IS DISTINCT FROM 'platform' THEN
              RAISE EXCEPTION 'the moved row did not get its team column rewritten (got %)', moved.team;
            END IF;
            IF moved.ingested_at > now() - interval '399 days' THEN
              RAISE EXCEPTION 'the moved row did not keep its original ingested_at (got %)', moved.ingested_at;
            END IF;

            SELECT * INTO rule_row FROM platform.chunks
            WHERE id = '44444444-4444-4444-4444-444444444444';
            IF rule_row IS NULL THEN
              RAISE EXCEPTION 'the pseudo-path rule row was not relocated';
            END IF;
            IF rule_row.metadata ? 'ingested_by' THEN
              RAISE EXCEPTION 'a non-classifiable content_type must not be adopted into reindex ownership: %', rule_row.metadata;
            END IF;
            IF rule_row.metadata->>'migrated_from' IS DISTINCT FROM 'org_shared' THEN
              RAISE EXCEPTION 'the relocated rule row is missing the migrated_from marker: %', rule_row.metadata;
            END IF;
          END $$;
          SQL
          echo "[migrate] 0035 fixture assertions OK"

      - name: Re-apply the newest migration (idempotency must hold)
        run: |
          set -eu
          newest=$(ls "$MIGRATIONS_DIR"/*.sql | sort | tail -1)
          echo "[migrate] re-applying $(basename "$newest") as role lore"
          docker exec -i "$LORE_PG_CONTAINER" psql -U lore -d lore -v ON_ERROR_STOP=1 --single-transaction -f - < "$newest"
          echo "[migrate] idempotent re-apply OK"
