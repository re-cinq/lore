name: Build and push Lore API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_build-image.yml'
      - 'apps/lore-api/**'
      # The compiled `shared` + `server-core` packages are bundled into the
      # image — a lib-only change must rebuild + redeploy, or the cluster runs
      # stale lib code while main is green (rediscovered 2026-06-11: AC-traceability
      # fix lived in shared/ only, so the server never rebuilt and prod stayed broken).
      - 'libs/shared/**'
      - 'libs/server-core/**'
      # The floor pipeline files are bundled into this image and put to the
      # floor at boot — a pipeline-only change must rebuild + redeploy, or the
      # floor keeps the old line (2026-09-30: the fix for a refused pipeline
      # merged and never shipped).
      - 'libs/assembly-lines/**'
      # The station registry is COMPILED INTO this image (the walk reads a node's
      # runtime from it / lore-api derives its maintenance jobs from it), so a
      # registry change must rebuild it — a filter that missed this would leave
      # CI green while the fix never ships.
      - 'apps/stations/**'
      # The lore-code-trace Go binary is baked into this image and served at
      # /dist — a binary-only change must rebuild + redeploy, or every repo's
      # CI keeps downloading the old binary (rediscovered 2026-07-24: the
      # 5xx-retry fix merged but never shipped until an unrelated rebuild).
      - 'apps/lore-code-trace/**'
      # Chart or workflow changes need a redeploy too — without this,
      # a chart-only PR merges to main and nothing redeploys, leaving
      # the cluster on old code forever (rediscovered 2026-04-29).
      - 'deploy/chart/charts/lore-api-helm/**'
      - 'deploy/chart/Chart.yaml'
      - 'deploy/chart/values.yaml'
      - '.github/workflows/build-lore-api.yml'
      - 'scripts/ci/bump-image-tag.sh'
  pull_request:
    paths:
      - '.github/workflows/_build-image.yml'
      - 'apps/lore-api/**'
      - 'libs/shared/**'
      - 'libs/server-core/**'
      - 'libs/assembly-lines/**'
      # The station registry is COMPILED INTO this image (the walk reads a node's
      # runtime from it / lore-api derives its maintenance jobs from it), so a
      # registry change must rebuild it — a filter that missed this would leave
      # CI green while the fix never ships.
      - 'apps/stations/**'
      - 'apps/lore-code-trace/**'
      - 'deploy/chart/charts/lore-api-helm/**'
      - 'deploy/chart/Chart.yaml'
      - 'deploy/chart/values.yaml'
      - '.github/workflows/build-lore-api.yml'
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref —
# but never cancel the deploy on main, that always runs to completion.
concurrency:
  group: build-lore-api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-api

jobs:
  sha:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: sha
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: re-cinq/lore-api
      dockerfile: apps/lore-api/Dockerfile
      build_args: GIT_SHA=${{ needs.sha.outputs.short_sha }}
    secrets: inherit

  deploy:
    # A newer build of main supersedes an older one still waiting to deploy,
    # so a burst of merges ends in one tag bump per service.
    concurrency:
      group: deploy-lore-api
      cancel-in-progress: true
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # main takes only pull requests; bump-image-tag.sh opens and merges one.
      pull-requests: write
      # report-deploy-failure.sh files/updates a `deploy-failed` issue when this
      # job's deploy fails, so a service left on an old image is visible
      # outside the Actions tab (#1650).
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      # Argo CD on the cluster deploys the new tag from main (re-cinq/infrastructure, docs/deploying.md).
      - name: Record the lore-api image tag for Argo CD
        run: bash scripts/ci/bump-image-tag.sh lore-api "${{ needs.build.outputs.image_tag }}"

  smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for rollout
        run: sleep 30
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
