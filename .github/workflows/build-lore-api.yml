name: Build and push Lore API

on:
  push:
    branches: [main]
    paths:
      - 'apps/lore-api/**'
      # The compiled `shared` + `server-core` packages are bundled into the
      # image — a lib-only change must rebuild + redeploy, or the cluster runs
      # stale lib code while main is green (rediscovered 2026-06-11: AC-traceability
      # fix lived in shared/ only, so the server never rebuilt and prod stayed broken).
      - 'libs/shared/**'
      - 'libs/server-core/**'
      # Chart or workflow changes need a redeploy too — without this,
      # a chart-only PR merges to main and nothing redeploys, leaving
      # the cluster on old code forever (rediscovered 2026-04-29).
      - 'infra/terraform/modules/gke-mcp/lore-platform/charts/lore-api-helm/**'
      - 'infra/terraform/modules/gke-mcp/lore-platform/Chart.yaml'
      - 'infra/terraform/modules/gke-mcp/lore-platform/values.yaml'
      - '.github/workflows/build-lore-api.yml'
      # task-types.yaml ships to the cluster as the lore-api ConfigMap via
      # deploy-lore-platform.sh --set-file — a prompt edit must redeploy or
      # pods serve stale prompts (rediscovered 2026-07-17).
      - 'scripts/task-types.yaml'
      - 'scripts/ci/deploy-lore-platform.sh'
  pull_request:
    paths:
      - 'apps/lore-api/**'
      - 'libs/shared/**'
      - 'libs/server-core/**'
      - 'infra/terraform/modules/gke-mcp/lore-platform/charts/lore-api-helm/**'
      - 'infra/terraform/modules/gke-mcp/lore-platform/Chart.yaml'
      - 'infra/terraform/modules/gke-mcp/lore-platform/values.yaml'
      - '.github/workflows/build-lore-api.yml'
      - 'scripts/task-types.yaml'
      - 'scripts/ci/deploy-lore-platform.sh'
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref —
# but never cancel the deploy on main, that always runs to completion.
concurrency:
  group: build-lore-api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/lore-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lore-api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Serialize on Helm's release lock (retry while another service's deploy
      # holds it) instead of a GitHub concurrency group, which would cancel the
      # middle of 3 simultaneous deploys. See the script header.
      - name: Deploy lore-api into the umbrella release
        run: bash scripts/ci/deploy-lore-platform.sh lore-api "${{ needs.build.outputs.image_tag }}" lore-api lore-api "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

  smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for rollout
        run: sleep 30
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
