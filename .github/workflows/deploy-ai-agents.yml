# Deploys the ai-agents subchart when its chart changes on main. Unlike the
# service workflows (build-floor/lore-api/ui) there is no image build here: the
# controller + agent images are digest-pinned in the subchart's values.yaml
# (bumped by PR when the ai-agent-subsystem releases), so a deploy is just a
# helm upgrade of the umbrella with the checked-out chart — the "-" tag tells
# the deploy script to skip the image override.
name: Deploy ai-agents

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/modules/gke-mcp/lore-platform/charts/ai-agents-helm/**"
      - ".github/workflows/deploy-ai-agents.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: europe-west1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Serialize on Helm's release lock (retry while another service's deploy
      # holds it) instead of a GitHub concurrency group, which would cancel the
      # middle of simultaneous deploys. See the script header.
      #
      # The subchart's own values.yaml is passed as a -f overlay so it outranks
      # the release's stored user-supplied values — the release carries a full
      # legacy ai-agents block that otherwise shadows every values.yaml edit
      # (digests, resources) under --reset-then-reuse-values.
      #
      # But that same precedence makes the overlay clobber the keys terraform
      # owns. loreMcpUrl / loreSkillsUrl are per-cluster URLs the chart cannot
      # know, so their values.yaml defaults are "" — and shipping "" at higher
      # precedence than the stored values switches the MCP + skills seams OFF on
      # every ai-agents deploy, until someone happens to run terraform apply
      # again. That is what caused the 2026-08-10 agent-node outage (#1126):
      # v0.8.1 shipped via this workflow while loreSkillsUrl stayed empty, and
      # the Claude adapter emits --settings for a file the init only writes when
      # a skills_source is set.
      #
      # So drop the terraform-owned keys from the overlay. Everything the
      # overlay exists for (image digests, resources) still outranks the stored
      # block; the two URLs fall through to the stored values terraform applied.
      # Any key added here that terraform also sets must be added to the del().
      - name: Deploy ai-agents into the umbrella release
        run: |
          yq -o=json '{"ai-agents": (del(.loreMcpUrl, .loreSkillsUrl))}' \
            infra/terraform/modules/gke-mcp/lore-platform/charts/ai-agents-helm/values.yaml \
            > /tmp/ai-agents-overlay.json
          bash scripts/ci/deploy-lore-platform.sh ai-agents - agent-controller ai-agents "" /tmp/ai-agents-overlay.json
