name: Build and push the Lore agent image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_build-image.yml'
      - 'apps/agent-image/**'
      - '.github/workflows/build-agent-image.yml'
  pull_request:
    paths:
      - '.github/workflows/_build-image.yml'
      - 'apps/agent-image/**'
      - '.github/workflows/build-agent-image.yml'
  workflow_dispatch:

concurrency:
  group: build-agent-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: re-cinq/lore-agent
      context: apps/agent-image
      dockerfile: apps/agent-image/Dockerfile
      smoke_command: >-
        jq --version && yq --version && rg --version >/dev/null &&
        git --version && curl --version >/dev/null && sed --version >/dev/null &&
        python3 --version && make --version >/dev/null && unzip -v >/dev/null &&
        tree --version && file --version >/dev/null && less --version >/dev/null &&
        java -version && javac -version
    secrets: inherit
