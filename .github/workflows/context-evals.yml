name: Context evals

# Every night, for every onboarded repository: does Lore hand back the right
# document when asked about it (specs/context-evals)? The runner only samples,
# asks lore-api and reports; the questions are written and judged by lore-api,
# so this job holds no model key.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Evaluate one repository (owner/name). Empty: every onboarded repository."
        required: false
        default: ""
      sample:
        description: "Documents per repository"
        required: false
        default: "20"

# Read-only token (#1062). Nothing here pushes, comments or installs a package.
permissions:
  contents: read

jobs:
  repos:
    name: repositories
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/context-evals

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: List the repositories to evaluate
        id: list
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          EVAL_REPO: ${{ inputs.repo }}
        # Two lines on purpose: a failure inside $(...) on an echo line is swallowed.
        run: |
          repos="$(node scripts/context-evals/repos.mjs)"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  evals:
    name: ${{ matrix.repo }}
    needs: repos
    runs-on: ubuntu-latest
    # One repository below the bar must not cancel the others' runs.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJson(needs.repos.outputs.repos) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/context-evals

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Evaluate
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          EVAL_REPO: ${{ matrix.repo }}
          EVAL_SAMPLE: ${{ inputs.sample || '20' }}
        run: node scripts/context-evals/run.mjs --repo "$EVAL_REPO" --sample "$EVAL_SAMPLE"
