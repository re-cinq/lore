name: Spec link upkeep

# A pull request repoints only the spec links it writes (`no-stale-spec-links`
# with `scope: "authored"`), so it carries no link churn of its own. This job
# repoints the rest after each merge to main, in one pull request of its own:
# every link into a file that moved gets the line its content hash now sits on,
# a link without a hash gets one, and a test renamed or moved is followed from
# the main commit this job last processed (`refs/spec-link-upkeep/base`), which
# is the merge base `re-lint-reanchor` heals renames against. The diff touches
# nothing but link anchors, so the job merges it itself; then it moves the base.
#
# GITHUB_TOKEN's merge starts no workflow, so neither this job nor any build
# runs again for it. The graph and Utopia read the new anchors with the next
# push's test-report upload, which sends everything since the last one.

# Every push: a link can cite any file in the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queued, never cancelled: each run starts from the base the previous one moved.
concurrency:
  group: spec-link-upkeep
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: lore/spec-link-upkeep
  BASE_REF: refs/spec-link-upkeep/base

jobs:
  upkeep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The token rides in a one-off header, never in .git/config, so the npm
      # install and the tool run below never see it.
      - name: Fetch the processed base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            fetch --quiet origin "+${BASE_REF}:${BASE_REF}" \
            || echo "[lore] no processed base on origin yet"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Repoint the links
        id: repoint
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          if git rev-parse --quiet --verify "${BASE_REF}" >/dev/null && git merge-base --is-ancestor "${BASE_REF}" HEAD; then
            BASE="$(git rev-parse "${BASE_REF}")"
          else
            echo "[lore] no processed base yet: hashing every link against main itself"
            BASE="${HEAD_SHA}"
          fi
          echo "[lore] repointing spec links from ${BASE} to ${HEAD_SHA}"
          # Exit 1 means some link nothing can repoint, which a person fixes by
          # hand; every link it could repoint is rewritten either way.
          npx re-lint-reanchor --all --hash-all "${BASE}" || true
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[lore] every spec link is up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat | tail -1
          fi

      # The write token enters only here, after every npm install and tool run.
      - name: Open or update the pull request and merge it
        if: steps.repoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.repoint.outputs.head }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git switch --quiet -C "${BRANCH}"
          git commit --quiet -am "Repoint spec links to their content hashes after ${HEAD_SHA:0:9}"
          git push --quiet --force origin "${BRANCH}"
          PR="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${PR}" ]; then
            PR="$(gh pr create --head "${BRANCH}" --base main \
              --title "Repoint spec links" \
              --body "Generated by \`spec-link-upkeep.yml\` after ${HEAD_SHA}. Only spec link anchors change: each link points at the line its content hash now sits on, and a link without a hash gets one. A pull request repoints only the links it writes; this one repoints the rest." \
              | grep -oE '[0-9]+$')"
          fi
          echo "[lore] merging #${PR}"
          gh pr merge "${PR}" --squash --delete-branch --match-head-commit "$(git rev-parse HEAD)"

      - name: Move the processed base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.repoint.outputs.head }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --quiet --force origin "${HEAD_SHA}:${BASE_REF}"
          echo "[lore] processed base is now ${HEAD_SHA}"
