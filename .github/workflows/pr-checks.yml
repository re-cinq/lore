name: PR Checks

# Runs prettier FIRST (auto-formatting the PR branch and committing back), then the
# unit-test matrix on the formatted commit. `test` jobs `needs: format` so they run in
# the same workflow run, after `format` pushes — each re-checks-out the head ref, which
# now includes the format commit. GITHUB_TOKEN's anti-loop rule only blocks *new* runs,
# not needs-ordered jobs in the current run, so no App token is required. `[skip ci]` on
# the format commit prevents a redundant second run; the current run's test jobs are
# unaffected by it. Replaces the standalone test.yml (its matrix moved here verbatim).

on:
  pull_request:
    # No `branches` filter (#1146): stacked PRs (base = another feature branch) are
    # part of what eventually lands in main, and a filter here silently skips their
    # whole matrix. Retargeting to main (which only happens when the parent's branch
    # is deleted on merge) emits only `edited`, so the gap never self-heals.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default (#1062). Only the format job needs write, scoped below.
permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the reformat back to the PR branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Don't leave the write token in .git/config while npm installs and
          # prettier/eslint run third-party code (#1062) — the push step below
          # re-authenticates explicitly, after all of that has finished.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts (#1062): dep lifecycle scripts were the supply-chain
      # execution vector; nothing in the tree needs them.
      - name: Install deps
        run: npm ci --ignore-scripts && npm ci --prefix apps/web-ui --ignore-scripts

      # eslint-plugin-lore's require-spec-link rule imports the compiled
      # @re-cinq/lore-shared at config load, so shared must be built before any
      # eslint run (the lint matrix job builds too; format was the last eslint
      # entrypoint that didn't).
      - name: Build shared
        run: npm run build -w @re-cinq/lore-shared

      - name: Prettier + eslint --fix
        run: npm run format

      # The write token enters the job only here — after every npm install and
      # every third-party tool run — and only for the auto-commit push. Both push
      # steps skip when the branch being pushed is main itself — a main → feature
      # sync PR (in scope now that any-base PRs trigger) or a dispatch on main —
      # since branch protection would reject the push and fail the whole needs-chain.
      - name: Authenticate push
        if: github.head_ref != 'main' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Commit formatting
        if: github.head_ref != 'main' && github.ref != 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: prettier [skip ci]"

  test:
    name: ${{ matrix.name }}
    needs: format # run after formatting, on the formatted head
    runs-on: ubuntu-latest
    strategy:
      # One independent run per subproject — a red suite must not mask the others.
      fail-fast: false
      matrix:
        include:
          # 17 files / 130 tests self-skip unless a Dgraph answers on :8081, so the
          # whole spec-traceability graph walk was green-by-skip in CI until now.
          - name: shared
            dgraph: true
            test: npm test -w @re-cinq/lore-shared
          # The assembly-lines kernel imports compiled @re-cinq/lore-shared (via subpaths),
          # so shared must be built before its suite runs.
          - name: assembly-lines
            build: npm run build -w @re-cinq/lore-shared
            test: npm run test:coverage -w @re-cinq/lore-assembly-lines
          # The station registry and its guards — the compile-time link between the
          # loader's NodeType enum and the set of station modules that can serve it.
          # That guard is the reason the registry exists, so it has to run here:
          # every OTHER entry below merely BUILDS this package to satisfy an import,
          # which typechecks it and never executes one of its tests.
          - name: stations
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-assembly-lines
            test: npm test -w @re-cinq/lore-stations
          # server-core imports compiled @re-cinq/lore-shared, so shared first.
          - name: server-core
            build: npm run build -w @re-cinq/lore-shared
            test: npm test -w @re-cinq/lore-server-core
          # mcp-server (local adapter) and lore-api (remote REST) both import the
          # compiled @re-cinq/lore-shared + @re-cinq/lore-server-core, so both
          # libs must be built before their suites run.
          - name: mcp-server
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-server-core
            test: npm test -w @re-cinq/lore-mcp
          # lore-api imports the compiled @re-cinq/lore-assembly-lines kernel too,
          # for the enriched run read's station resolution — so it must be built
          # here as it is for the floor entry below.
          # lore-api resolves the station registry for its maintenance jobs, and
          # floor for a node's runtime — both import @re-cinq/lore-stations, so it
          # must be COMPILED before either typechecks.
          - name: lore-api
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-server-core && npm run build -w @re-cinq/lore-assembly-lines && npm run build -w @re-cinq/lore-stations
            test: npm test -w @re-cinq/lore-api
          # agent also imports the compiled @re-cinq/lore-assembly-lines kernel, so
          # both shared and assembly-lines must be built before its suite runs.
          - name: agent
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-assembly-lines && npm run build -w @re-cinq/lore-stations
            test: npm run test:coverage -w @re-cinq/lore-floor
          # web-ui's builtin assembly-line graphs are GENERATED from the YAMLs —
          # it is outside the workspace and carries no YAML parser, so it needs a
          # copy, and the hand copy rotted (feature-planning claimed 2 nodes while
          # the YAML had 9, and 8 lines were missing outright). This fails the moment
          # a definition changes without regenerating.
          - name: builtin-definitions-drift
            build: npm run build -w @re-cinq/lore-shared
            test: bash scripts/check-builtin-definitions-drift.sh
          # The OpenAPI artifact + the client types generated from it. web-ui's Docker
          # context (apps/web-ui) cannot reach lore-api at build time, so both are
          # COMMITTED rather than generated during the image build — which means only
          # a guard keeps them honest. This fails the moment a route's shape changes
          # without regenerating. Needs shared + server-core prebuilt; the script
          # builds lore-api itself.
          - name: openapi-drift
            build: npm run build -w @re-cinq/lore-shared && npm run build -w @re-cinq/lore-server-core && npm run build -w @re-cinq/lore-assembly-lines && npm run build -w @re-cinq/lore-stations
            test: bash scripts/check-openapi-drift.sh
          # Skill-docs guard. /lore-help renders each platform skill from that
          # skill's own `## Help` block, so a skill without one is invisible in
          # the index. Pure markdown check — no build needed.
          - name: skill-help
            test: bash scripts/check-skill-help.sh
          # The scripts' OWN tests. `scripts/**/*.test.mjs` had no CI home at all:
          # install-contract, lore-merge-settings and (until this entry) the deploy
          # classifier ran nowhere, so a broken guard stayed green. Only
          # check-bootstrap-columns ran, and only from migrations.yml.
          # Files are passed explicitly via find: node 22 resolves a bare directory
          # as a module entry point and dies with MODULE_NOT_FOUND, the same trap
          # the eslint-rules entry below documents.
          - name: scripts
            test: find scripts -name '*.test.mjs' -print0 | xargs -0 node --test
          # The lint rules' OWN tests. Every rule in tools/eslint-plugin-lore has a
          # RuleTester suite, and until now nothing ran them — so a rule could start
          # over-reporting, stop reporting, or crash on an edge-case AST and nothing
          # would notice. Several are at `error` repo-wide, where a crashing rule
          # red-lights every PR with a stack trace instead of a finding. Plain
          # `node --test` on .mjs sources: no build, no install, no workspace deps.
          # The script passes the test files EXPLICITLY rather than the rules/
          # directory: node 22 (this runner) resolves a bare directory as a module
          # entry point and dies with MODULE_NOT_FOUND, while node 20 (local) scans
          # it — so the directory form passes locally and fails here.
          # Needs shared BUILT: three rules read spec status/coverage through
          # rules/lib/lore-shared.mjs, which imports @re-cinq/lore-shared/dist. Same
          # dependency the lint-web-ui entry documents.
          - name: eslint-rules
            build: npm run build -w @re-cinq/lore-shared
            test: npm test --prefix tools/eslint-plugin-lore
          # web-ui is NOT an npm workspace — it has its own lockfile and does
          # not depend on @re-cinq/lore-shared. Install and test in-place.
          - name: web-ui
            install: npm ci --prefix apps/web-ui --ignore-scripts
            # Run with coverage so the vitest.config.ts thresholds gate CI.
            test: npm run test:coverage --prefix apps/web-ui
          # The Next production build. Nothing else in this matrix can see the
          # SERVER/CLIENT boundary: vitest imports every module happily under jsdom,
          # and eslint's no-io-in-view only catches a DIRECT `@/lib/db` import — a
          # client component importing a pure-looking helper that transitively
          # reaches `db` compiles, tests green, and then dies at bundle time on
          # "Can't resolve 'fs'". Until now that only surfaced in the image build on
          # main, or on a developer's dev server.
          - name: web-ui-build
            install: npm ci --prefix apps/web-ui --ignore-scripts
            test: npm run build --prefix apps/web-ui
          # Type-mirror drift guard. web-ui can't import @re-cinq/lore-shared, so it
          # hand-mirrors the feature-planning types — this typecheck fails the moment
          # the canonical shared types gain a key (or a status union changes) the
          # mirror lacks. Reads both trees' source directly; no build needed.
          - name: type-drift
            test: npm run typecheck:drift
          # ESLint over the workspaces. Type-aware rules need the libs built so
          # cross-package imports resolve to their .d.ts. web-ui is linted
          # separately (it is not a workspace and has its own node_modules).
          - name: lint
            build: npm run build
            test: npx eslint . --ignore-pattern "apps/web-ui/**"
          # web-ui lint — install its own deps so react/next types resolve.
          # Build shared first: the flat config loads the lore plugin, whose
          # require-spec-link rule imports @re-cinq/lore-shared/dist at config load.
          - name: lint-web-ui
            install: npm ci --ignore-scripts && npm ci --prefix apps/web-ui --ignore-scripts
            build: npm run build -w @re-cinq/lore-shared
            test: npx eslint apps/web-ui

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }} # re-checkout head so tests see the format commit
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Booted before the install so the container warms up while npm ci runs.
      # Port 8081 is not a preference — it is the port dgraphReachable() probes.
      - name: Start Dgraph
        if: ${{ matrix.dgraph }}
        run: docker run -d --name lore-dgraph -p 8081:8080 dgraph/standalone:v24.0.0

      - name: Install deps
        run: ${{ matrix.install || 'npm ci --ignore-scripts' }}

      - name: Apply Dgraph schema
        if: ${{ matrix.dgraph }}
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8081/health >/dev/null && break
            sleep 2
          done
          # Fail loudly. A silent timeout here would restore exactly the
          # green-by-skip the service exists to eliminate.
          curl -sf http://localhost:8081/health >/dev/null \
            || { echo "::error::Dgraph never became healthy on :8081"; docker logs lore-dgraph; exit 1; }
          npm run dgraph:schema

      - name: Build shared
        if: ${{ matrix.build }}
        run: ${{ matrix.build }}

      - name: Run tests
        run: ${{ matrix.test }}

  # Nothing else in CI renders or lints the Helm charts, so a broken template was
  # caught at deploy time — or by whoever happened to run `helm template` by hand.
  # That is not hypothetical: a one-character Go-template chomp shipped
  # `emptyDir: {}---`, gluing two documents into one unparseable blob, with every
  # unit test in the repo green (#1372).
  #
  # Deliberately NOT in the `test` matrix: this needs helm and no node_modules,
  # so an `npm ci` for it would be pure wasted minutes.
  charts:
    name: charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # SHA-pinned like every other third-party action here: a tag is mutable,
      # and this one runs before any repo code does.
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.19.0

      - run: bash scripts/check-charts.sh
