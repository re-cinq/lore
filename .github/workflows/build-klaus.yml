name: Build and push Klaus

on:
  workflow_dispatch:
    inputs:
      klaus_ref:
        description: 'Klaus git ref to build (tag, branch, or commit)'
        default: 'main'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: re-cinq/klaus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clone Klaus source
        uses: actions/checkout@v4
        with:
          repository: giantswarm/klaus
          ref: ${{ inputs.klaus_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
