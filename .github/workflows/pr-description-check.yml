name: PR Description Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          FAILED=0
          WARNINGS=""

          # --- Check "## Why" section ---
          WHY_CONTENT=$(echo "$PR_BODY" | sed -n '/^## Why/,/^## /{ /^## /d; p; }')
          WHY_STRIPPED=$(echo "$WHY_CONTENT" | sed 's/<!--.*-->//g' | tr -d '[:space:]')

          if [ -z "$WHY_STRIPPED" ]; then
            WARNINGS="${WARNINGS}MISSING: '## Why' section is empty or missing. Explain what problem this solves.\n"
            FAILED=1
          fi

          # --- Check "## What Changed" section ---
          WHAT_CONTENT=$(echo "$PR_BODY" | sed -n '/^## What Changed/,/^## /{ /^## /d; p; }')
          WHAT_STRIPPED=$(echo "$WHAT_CONTENT" | sed 's/<!--.*-->//g' | tr -d '[:space:]')

          if [ -z "$WHAT_STRIPPED" ]; then
            WARNINGS="${WARNINGS}MISSING: '## What Changed' section is empty or missing. Describe what you changed.\n"
            FAILED=1
          fi

          # --- Check "## Testing" section ---
          TEST_CONTENT=$(echo "$PR_BODY" | sed -n '/^## Testing/,/^## /{ /^## /d; p; }')
          TEST_STRIPPED=$(echo "$TEST_CONTENT" | sed 's/<!--.*-->//g' | tr -d '[:space:]')

          if [ -z "$TEST_STRIPPED" ]; then
            WARNINGS="${WARNINGS}MISSING: '## Testing' section is empty or missing. Describe how you tested this.\n"
            FAILED=1
          fi

          # --- Report results ---
          if echo "$PR_BODY" | grep -q 'Lore-Task:'; then
            echo "PR was opened by Lore. Skipping description checks."
            exit 0
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "============================================"
            echo "PR description check found issues:"
            echo "============================================"
            echo -e "$WARNINGS"
            exit 1
          else
            echo "PR description looks good."
          fi
