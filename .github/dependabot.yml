# Weekly dependency update pull requests for the two npm lockfiles.
# The web UI is not an npm workspace and has its own lockfile, so it is listed
# separately from the root workspaces. Patch and minor updates arrive grouped
# in one pull request per directory; majors arrive one by one.
# The OpenTelemetry packages only build at matching versions, so they move
# together in one pull request, majors included. The team's own @re-cinq
# packages, whose 0.x minors can break, move in a pull request of their own.
# The minor-and-patch group excludes both, so neither lands there.
# Lore runs on Node 22, so @types/node stays on its 22 line.
# web-tree-sitter is held at 0.24: from 0.25 on it cannot load the grammars of
# tree-sitter-wasms 0.1.x, the newest there is, and the chunker and spec-trace
# would quietly fall back. It moves once the grammars come from elsewhere.
# GitHub Actions are left out: several workflows are managed by Lore.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      web-ui-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: web-tree-sitter
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      re-cinq:
        patterns: ["@re-cinq/*"]
      workspaces-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@opentelemetry/*", "@re-cinq/*"]
