# User-tier gemini-cli policy, loaded from ~/.gemini/policies/ and ranked above every
# built-in rule. Headless, the built-in rules deny every shell command unless --yolo
# applied ("Tool execution denied by policy."), and plan mode denies everything: a
# Lore agent pod is its own sandbox, so every tool runs in every approval mode. The
# BeforeTool guard in ../settings.json runs before this check and still refuses what
# the recipe's LORE_TEST_POLICY forbids.
[[rule]]
toolName = "*"
decision = "allow"
priority = 100
allowRedirection = true

# Nobody answers a headless pod: a question would wait forever.
[[rule]]
toolName = "ask_user"
decision = "deny"
priority = 200
