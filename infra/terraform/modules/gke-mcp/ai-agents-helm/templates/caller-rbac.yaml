# A narrow Role for in-cluster apps that only need to launch and inspect runs — no
# access to Jobs or pods. The Lore Floor (a cross-namespace ServiceAccount) is bound
# to this Role in templates/floor-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-launcher
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents"]
    verbs: ["create", "get", "list", "watch"]
