apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lore-api
  template:
    metadata:
      labels:
        app: lore-api
      annotations:
        # Roll the pods whenever the mounted task-types.yaml content changes —
        # without this a ConfigMap update leaves running pods on the old file.
        checksum/task-types: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: LORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret.name }}
                  key: {{ .Values.dbPasswordSecret.key }}
            - name: LORE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestTokenSecret.name }}
                  key: {{ .Values.ingestTokenSecret.key }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.appIdKey }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.privateKeyKey }}
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubAppSecret.name }}
                  key: {{ .Values.githubAppSecret.installationIdKey }}
            # The cluster-agent registration pre-shared token (FR1 of
            # specs/running-stations-in-any-k8s-cluster). NOT optional: every
            # cluster-agent registers, the central one included, so lore-api
            # answering 401 to every registration is a dead factory rather than
            # a disabled feature. It fails here the same way the agent fails
            # without it, which is the point — a pair where one end degrades
            # quietly and the other crashes is how the 2026-08-24 outage read.
            - name: LORE_CLUSTER_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterAgentRegistrationSecret.name }}
                  key: {{ .Values.clusterAgentRegistrationSecret.key }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lore-anthropic-key
                  key: anthropic-api-key
                  optional: true
            {{- if .Values.anthropicAdminKeySecret }}
            # The Anthropic ORG admin key, for the cost-sync maintenance job
            # (#1348). Distinct from the API key above: it reads the billing
            # reports and mints nothing. Optional — an unset key makes the job
            # report a skip rather than fail.
            - name: ANTHROPIC_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropicAdminKeySecret.name }}
                  key: {{ .Values.anthropicAdminKeySecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.webhookSecret }}
            - name: LORE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webhookSecret.name }}
                  key: {{ .Values.webhookSecret.key }}
            {{- end }}
            {{- if .Values.internalTokenSecret }}
            - name: LORE_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalTokenSecret.name }}
                  key: {{ .Values.internalTokenSecret.key }}
            {{- end }}
            {{- if .Values.slackSigningSecret }}
            - name: LORE_SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slackSigningSecret.name }}
                  key: {{ .Values.slackSigningSecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.slackBotTokenSecret }}
            - name: LORE_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slackBotTokenSecret.name }}
                  key: {{ .Values.slackBotTokenSecret.key }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.configMap.name }}
