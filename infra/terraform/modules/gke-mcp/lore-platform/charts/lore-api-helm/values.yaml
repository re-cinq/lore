# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-api

replicaCount: 1

# PodDisruptionBudget keeps at least one lore-api pod available during
# Autopilot node consolidation. Without this, scale-down evictions
# briefly take the API offline and local MCP clients silently fall
# back to file mode (writes never reach Postgres).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-api
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  PORT: "3000"
  CONTEXT_PATH: /context
  TASK_TYPES_PATH: /config/task-types.yaml
  LORE_TEAM: platform
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  # Shared Dgraph endpoint (memory + spec-trace graphs). Empty → /impact + graph
  # reads fail soft. Overridden by terraform set to the in-cluster service DNS.
  LORE_DGRAPH_HTTP: ""
  # Internal cluster URL for the lore-floor health server. lore-api
  # uses this to POST /api/trigger/review-reactor on GitHub webhooks.
  LORE_AGENT_URL: http://lore-floor.lore-floor.svc.cluster.local:8080

dbPasswordSecret:
  name: lore-api-db-password
  key: password

ingestTokenSecret:
  name: lore-ingest-token
  key: token

configMap:
  name: lore-api-config

githubAppSecret:
  name: github-app-credentials
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# HMAC secret for verifying GitHub webhook signatures.
webhookSecret:
  name: lore-webhook-secret
  key: secret

# Shared secret with lore-floor used to POST to
# /api/trigger/review-reactor in the lore-floor namespace.
internalTokenSecret:
  name: lore-agent-internal-token
  key: token

# Slack integration (optional — leave empty to disable)
slackSigningSecret:
  name: lore-slack-credentials
  key: signing-secret

slackBotTokenSecret:
  name: lore-slack-credentials
  key: bot-token

# The courier (#1357): CronJobs whose only job is to POST /api/assembly-runs and
# exit, so a scheduled job runs as an assembly line instead of as code inside a
# coordinator. Empty by default — an entry is added when its line exists.
#
# Each entry: name (k8s suffix), schedule (cron), path (the lore-api path to
# post to). Optional: body (object -> JSON payload), startingDeadlineSeconds,
# successfulJobsHistoryLimit, failedJobsHistoryLimit.
#
# path is per-entry because the two kinds of scheduled work land in different
# places: work with STEPS posts /api/assembly-runs and runs as a real assembly
# line; a single data operation posts /api/maintenance/<job> and runs inside
# lore-api. Neither runs in a coordinator, which is the point.
courier:
  # Pinned by DIGEST, not by tag: this container is handed the org ingest token,
  # and a tag is mutable — `8.11.1` can be repointed at a different image without
  # anything in this repo changing. The tag is kept alongside the digest for
  # human legibility; the digest is what Kubernetes resolves.
  image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
courierJobs: []
