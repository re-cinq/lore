{{- if .Values.migrations.enabled }}
# pre-install/pre-upgrade hook: apply DB migrations before the UI rolls out.
# Re-runs every deploy; lore.schema_migrations makes applied files a no-op.
# `helm upgrade --wait` blocks until this succeeds, so a bad migration fails
# the deploy before any new UI pods take traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-migrate
    spec:
      restartPolicy: Never
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.migrations.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[migrate] waiting for $PGUSER@$PGHOST:$PGPORT/$PGDATABASE ..."
              i=0
              until psql -c 'SELECT 1' >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge 30 ]; then
                  echo "[migrate] ERROR: database unreachable after 60s; last attempt:" >&2
                  psql -c 'SELECT 1' || true
                  exit 1
                fi
                sleep 2
              done
              psql -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS lore;" \
                -c "CREATE TABLE IF NOT EXISTS lore.schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
              for f in /migrations/*.sql; do
                v=$(basename "$f")
                applied=$(psql -tA -c "SELECT 1 FROM lore.schema_migrations WHERE version = '$v'")
                if [ "$applied" = "1" ]; then
                  echo "[migrate] skip   $v (already applied)"
                  continue
                fi
                echo "[migrate] apply  $v"
                psql -v ON_ERROR_STOP=1 --single-transaction \
                  -f "$f" \
                  -c "INSERT INTO lore.schema_migrations (version) VALUES ('$v')"
              done
              echo "[migrate] done"
          env:
            - name: PGHOST
              value: {{ .Values.env.LORE_DB_HOST | quote }}
            - name: PGPORT
              value: {{ .Values.env.LORE_DB_PORT | quote }}
            - name: PGDATABASE
              value: {{ .Values.env.LORE_DB_NAME | quote }}
            - name: PGUSER
              value: {{ .Values.migrations.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret.name }}
                  key: {{ .Values.dbPasswordSecret.key }}
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ .Chart.Name }}-migrations
{{- end }}
