# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-ui

replicaCount: 1

# PodDisruptionBudget keeps at least one UI pod available during
# Autopilot node consolidation.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-ui
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  # pg pool cap for the UI's connection pool (src/lib/db.ts). Matches the code
  # default; exposed here so it's tunable via standard deploy.
  LORE_DB_POOL_MAX: "20"
  # In-cluster MCP server URL — the /api/pipeline/[id]/timeline route proxies
  # here for the commit-walk + trailer parsing. Stays inside the cluster
  # rather than hairpinning through the public ingress.
  LORE_API_URL: http://lore-api.lore-api.svc.cluster.local:3000
  # In-cluster Floor URL — the /api/assembly-lines/[id]/nodes/[name]/logs route
  # proxies here to read live per-node pod logs from the cluster (the UI SA has
  # no Kubernetes access; the Floor brokers the read). Bearer LORE_INGEST_TOKEN.
  LORE_FLOOR_URL: http://lore-floor.lore-floor.svc.cluster.local:8080

# Schema migrations applied as a pre-install/pre-upgrade hook Job before the UI
# rolls out. SQL lives in migrations/*.sql; tracked in lore.schema_migrations.
# Connects as `lore`, which owns the database (terraform/lore-db.tf initdb
# owner), so DDL needs no superuser — reuses the same dbPasswordSecret the UI
# uses.
migrations:
  enabled: true
  image: ghcr.io/cloudnative-pg/postgresql:16-bookworm
  user: lore

dbPasswordSecret:
  name: lore-db-password
  key: password

ingestTokenSecret:
  name: lore-ingest-token
  key: token

# Admin-scoped token for server-to-server calls to the mcp-server's two-key-gated
# dark-factory settings endpoint (privileged per-repo settings writes). Optional:
# the deployment references it with optional: true, so a missing secret (before
# the operator mints the token + enables the ExternalSecret) does not stall the
# rollout — privileged saves just surface an "API not configured" notice.
adminTokenSecret:
  name: lore-admin-token
  key: token

githubAppSecret:
  name: github-app-credentials
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

oauthSecret:
  name: lore-ui-oauth
  clientIdKey: client-id
  clientSecretKey: client-secret
  nextauthSecretKey: nextauth-secret
