# Overlay for a laptop minikube (scripts/infra/setup-minikube-agents.sh).
#
# The hybrid local topology inverts one assumption the GKE defaults are built on:
# there, the Floor and Lore API are pods and a run pod reaches them over ClusterIP;
# here they are HOST processes (`npm start`) and a run pod reaches them at
# host.minikube.internal. Everything below follows from that.
#
# Not used on GKE — terraform/CI never reference this file.

# The run-pod egress posture assumes the Floor + Lore API are in-cluster: it denies
# all RFC1918 egress except their ClusterIPs. Locally they ARE RFC1918
# (host.minikube.internal), so the policy would drop precisely the traffic that must
# work. minikube's default CNI does not enforce NetworkPolicy anyway — applying it
# would only advertise a posture that is not actually running.
networkPolicy:
  enabled: false

# The host Floor's NDJSON cost sink (`npm start` serves :8080).
agentEventsUrl: http://host.minikube.internal:8080/api/agent-events

# The host skills registry (`npm start` serves it on :3002 — the mcp adapter in
# HTTP-gateway mode). A run pod's init fetches its skills AND its
# $HOME/.claude/settings.json from here; leaving this empty is not a no-op, it is
# fatal — the init skips the fetch, reports success, and the agent container then
# dies with "Settings file not found: /agent/.claude/settings.json". The registry
# is unauthenticated by design, so unlike loreMcpUrl this needs no headers secret.
loreSkillsUrl: http://host.minikube.internal:3002/skills

# The host Lore API the station recipes read/write through (dev-local runs it on
# :3001, not the in-cluster :3000).
loreApiUrl: http://host.minikube.internal:3001

# The host Dgraph the ingest-station recipes project into. docker compose publishes
# its HTTP port on :8081 (dodging the Floor's :8080), not the in-cluster :8080.
dgraphUrl: http://host.minikube.internal:8081

# A laptop has no org API credit and no ESO. The agent container runs the real `claude`
# CLI, which authenticates from CLAUDE_CODE_OAUTH_TOKEN just as happily as from an API
# key — so a local run bills the developer's own subscription. setup-minikube-agents.sh
# writes this same key into agent-secrets; the two must agree or the run pods fail to
# start. Mint the token with `claude setup-token` (npm run dev-setup does it for you).
agentLlmSecretKey: CLAUDE_CODE_OAUTH_TOKEN

# v0.10.2 controller + agent, pinned by digest as the PAIR the shared values.yaml
# insists on. Both halves are load-bearing for every capability here: the recipe
# fields (output.watch, resources.conversation) are read by the controller, and the
# files they name are read and written by the supervisor, which rides in the AGENT
# image. A half-bump renders the recipe field inert — a mismatch that presents as
# "the feature does nothing" rather than as an error. Local-only on purpose; the
# shared values.yaml still pins v0.8.1 for GKE, so bumping prod stays a deliberate,
# separate decision.
#   docker buildx imagetools inspect ghcr.io/re-cinq/ai-agent-controller:v0.10.2
controller:
  image:
    digest: "sha256:8162b3581084ed880e9afebd287d6efc5d6c7f135de041218dbc672b3e1bde56"
  # Nested under `controller` because that is where the template reads it
  # (.Values.controller.agentImage). A top-level key here is silently ignored and
  # falls back to the shared v0.8.1 digest — which injects a supervisor with no
  # file-watch, so the artifact event is never raised and the round dies exactly as
  # it did before the feature existed.
  agentImage: "ghcr.io/re-cinq/ai-agent@sha256:7b66e56518cb71061271fb36d70d5a3d8348d9c0d1260e32ba7bb829b1f451af"
