# Namespace for this subchart's own resources (controller, catalog, netpol, its RBAC).
namespace: ai-agents

# The kubectl image the crd-upgrade hook runs (templates/crd-upgrade-job.yaml):
# re-applies crds/*.yaml every deploy so schema changes reach live clusters —
# helm's native crds/ handling is install-only (#1134).
crdUpgrade:
  # The kubectl image the pre-upgrade CRD hook runs. `bitnami/kubectl:1.31` —
  # what this shipped as — does NOT EXIST: Bitnami retired the legacy Docker Hub
  # catalog, so the pull failed `NotFound`, the hook pod sat in ImagePullBackOff,
  # and the hook timed out. Because it is a PRE-upgrade hook, that blocked every
  # umbrella deploy (floor, api, ui, ai-agents), not just this subchart's.
  # registry.k8s.io is the Kubernetes project's own registry: the image is
  # guaranteed to exist for a released kubectl version, needs no Docker Hub
  # credentials, and has no anonymous pull-rate limit. Verify a bump with:
  #   curl -sIL https://registry.k8s.io/v2/kubectl/manifests/<tag>
  image: registry.k8s.io/kubectl:v1.31.0

# In-cluster egress target for the agent-events sink — must match the host:port of
# the events URL the cluster-agent renders into recipes (its `catalog.eventsUrl`).
# The run-pod NetworkPolicy denies all RFC1918 egress except this one ClusterIP:port
# (templates/networkpolicy.yaml).
floorSink:
  namespace: lore-floor
  port: 8080
  # Which workload actually receives the sink traffic. Centrally that is the
  # Floor itself; a SATELLITE points its events URL at its own cluster-agent,
  # which relays the batch onward through its event proxy — the Floor is not
  # reachable from a satellite's run pods, and the credential for it is one FR5
  # keeps central. Overridden together with namespace/port by the standalone
  # chart; the three must agree with that URL or the policy drops exactly
  # the traffic the sink needs.
  app: lore-floor

# The run-pod egress posture (templates/networkpolicy.yaml + ingest-station-egress.yaml).
# ON everywhere real. Turn OFF only for a laptop minikube (values.minikube.yaml): the
# deny-RFC1918 rule exists to stop a run pod reaching cluster-internal services, but in
# the hybrid local setup the Floor and Lore API ARE on the developer's host — an RFC1918
# host.minikube.internal — so the policy would drop exactly the traffic that must work.
# minikube's default CNI does not enforce NetworkPolicy anyway, so leaving these applied
# there would give a false sense of a posture that is not actually running.
networkPolicy:
  enabled: true

# NodeLocal DNSCache listen address. On clusters running NodeLocal DNS (GKE default),
# run pods resolve via this link-local IP instead of the kube-dns ClusterIP — and the
# metadata-endpoint block in the run-pod NetworkPolicy (169.254.0.0/16) would otherwise
# drop those queries. The chart allows port 53 to just this /32 (the metadata endpoint
# at 169.254.169.254 stays blocked). Empty string omits the rule for clusters without it.
nodeLocalDnsIp: 169.254.20.10

# In-cluster egress target for the station API calls — must match the host:port of
# the Lore API URL the cluster-agent renders into station recipes. IN-CLUSTER on
# purpose: Dataplane V2 short-circuits a VIP whose backend lives in this cluster, and
# the post-DNAT 10.x address hits the egress policy's RFC1918 except-list, so a run
# pod dialing a public Lore host just times out (proven live 2026-07-17, #1126).
apiSink:
  namespace: lore-api
  port: 3000

# In-cluster egress target for the lore-mcp gateway — must match the host:port of the
# cluster-agent's `catalog.mcpUrl` / `catalog.skillsUrl`. Covers both the agents' MCP
# transport and the init's skills+settings fetch; they are the same service.
mcpSink:
  namespace: lore-api
  port: 8080

controller:
  replicas: 1
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    # Pinned by digest (never a floating tag) — v0.11.6: a Gemini run's file tools can
    # read and write the input files beside its clone — the CLI confines them to the
    # clone, so every read_file/write_file of a planning pod's ../plan.md was refused
    # and the agent fell back to shell heredocs (ai-agent-subsystem#258). v0.11.5: an
    # init clone GitHub refuses
    # moments after the broker minted its token is run again (3 tries, 5s→10s) instead
    # of failing the run — ~35 pods a week died on "remote: Repository not found." for
    # repos that exist (ai-agent-subsystem#255). v0.11.4: a continued Gemini conversation
    # resumes `latest` instead of the caller's id, which gemini-cli never issued, so every
    # resumed Gemini pass exited 42 before its first turn (ai-agent-subsystem#250); a
    # watched file's upload carries X-Agent-Exit-Code, so the Floor can tell a failed
    # pass's untouched plan.md from an answer (#251). v0.11.3: a Gemini run's MCP servers
    # reach the CLI — v0.11.2 wrote them to gemini-cli's system settings, which the CLI
    # refuses unless the directory is root-owned (the pod is uid 1000), so every Gemini
    # pod still started with 0 tools; the init now merges them into the user settings
    # (ai-agent-subsystem#245, #246). v0.11.2: the servers are rendered for a Gemini run
    # at all — gemini-cli takes no MCP flag (#239, #240). v0.11.1: the supervisor retries a
    # watched file's upload through a receiver's rollout, so a Floor restart as the
    # run ends no longer costs the run its plan.md. v0.11.0: an Agent can take input
    # files by reference (spec.files, downloaded by the init after the clone) and a
    # watch can upload its file instead of inlining it (output.watch[].upload) — the
    # planning pod's plan.md travels both ways this way (ADR-047). It also bakes a
    # pinned Claude CLI into the agent image, so a run no longer downloads it (#231).
    # Earlier — v0.10.12: the init also persists
    # the clone token as an http.<origin>.extraheader (0600 .git/lore-auth.gitconfig,
    # pulled in by include.path). The Gemini CLI runs every shell command with
    # GIT_CONFIG_* entries that EMPTY credential.helper, so the helper below was
    # wiped before git asked it and gemini pushes still died on "could not read
    # Username" (run 9f5ab82d, 2026-09-10; ai-agent-subsystem#218).
    # Carries v0.10.11: the persisted clone
    # credential helper falls back to a 0600 token FILE inside .git/ when the
    # env var is scrubbed — gemini's run_shell_command spawns children with a
    # scrubbed environment, so every gemini push died on "terminal prompts
    # disabled" with the round complete and the branch undeliverable
    # (re-cinq/lore#1732, ai-agent-subsystem#215); a model-less gemini recipe
    # also stops falling back to the retired gemini-2.5 family.
    # Carries v0.10.10: the GeminiAgent
    # passes --skip-trust — workspace trust gates STARTUP separately from
    # approvals, and a run pod's fresh clone is always "untrusted", so every
    # headless gemini run died at exit 55 even with --yolo. Carries v0.10.9's
    # installer fix (the @google/gemini-cli npm tarball via curl+tar; the
    # v0.10.8 installer URL never existed).
    # v0.10.8 added the GeminiAgent vendor itself, so gemini-* models route to
    # the gemini CLI instead of falling through to the Claude adapter ("Not
    # logged in · Please run /login", 2026-09-02).
    # Carries v0.10.6's persisted clone credential helper (ai-agent-subsystem#204,
    # re-cinq/lore#1329), v0.10.5's prune-before-reconcile, and the v0.9–v0.10
    # line: informer watch + cache reconcile, /healthz from bind, conversation
    # continuity, tar-free conversation archiving.
    # Digests come from the release's install.yaml
    # (https://github.com/re-cinq/ai-agent-subsystem/releases/tag/v0.11.6), or:
    #   skopeo inspect docker://ghcr.io/re-cinq/ai-agent-controller:v0.11.6
    digest: "sha256:b580a1229c81dfbbc7b91306c0fe362779b5e7599a272ca5f3838e52b1a336f2"
  # The image whose init container injects the agent runtime + supervisor into each run
  # pod. Controller + agent ship as a PAIR from the v-tag matrix — pinned to the v0.11.6
  # digest, paired with the controller above. The GeminiSetup installer lives in THIS
  # image (the init container is what installs the vendor CLI), so the pair must move
  # together or a gemini run still boots a pod with no gemini binary in it. The
  # push-token fixes live in this image too — the init writes v0.10.11's token file and
  # v0.10.12's http extraheader. v0.10.13 clones and pushes through lore-api's
  # git-credential broker when the run carries git_credential (#2015, #2016).
  # v0.11.0 downloads a run's input files and copies the baked Claude CLI; v0.11.1
  # retries a watched file's upload; v0.11.2 writes a Gemini run's MCP settings;
  # v0.11.3 writes them where gemini-cli reads them as uid 1000 (the user settings,
  # merged by `ai-agent-init mcp-settings`); v0.11.4 resumes a Gemini conversation by
  # `latest` and sends the agent's exit code with each upload; v0.11.5 retries the
  # clone GitHub refuses moments after minting. THIS image carries the init, so the
  # retry lives here.
  # v0.11.6 declares the workspace as one of gemini-cli's workspace directories.
  #   skopeo inspect --no-tags docker://ghcr.io/re-cinq/ai-agent:v0.11.6
  agentImage: "ghcr.io/re-cinq/ai-agent@sha256:dd7ad55176efaf0453fad0ea1486b33ef70fd1c93b49cd6320c08ee9feec8736"
  # Tail of run-pod log kept in Agent.status.output (bounds the object under etcd's limit).
  maxOutputBytes: "262144"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      # 128Mi OOMKilled the controller in prod (2026-07-16: exit 137 ~60s after start,
      # 67 restarts) once the startup reconcile replayed the accumulated Agent CRs.
      # 512Mi then did the same on a dev cluster (2026-08-30: 149 restarts, a fresh
      # exit 137 every ~9 minutes) for the SAME reason, which is the point worth
      # recording: raising this number is not the fix, it is the second stopgap.
      # The informer caches every Agent CR, each carrying up to `maxOutputBytes`
      # (256KiB) of run output — 176 of them measured 40MiB of raw JSON — and
      # nothing bounds that count. `successfulRunsHistoryLimit` cannot: it is
      # per-Station, and Lore mints a Station per task, so the denominator grows
      # with the numerator and the limit prunes almost nothing. Until the
      # cluster-agent's hourly reaper (#1674) deletes terminal CRs and their
      # per-task clones, any ceiling here is a future outage with a longer fuse.
      memory: 1Gi

imagePullSecrets:
  - name: ghcr-pull-secret

# NOTE: the `floor` and `mcpServer` cross-namespace RBAC that used to live here is
# gone (ADR-024, 2026-08-24). Neither the Floor nor lore-api talks to Kubernetes
# any more — `apps/cluster-agent` does, under its own Role in this namespace, and
# it is the only ServiceAccount that needs a binding here.

# The single ESO-managed Secret the run pods mount allowlisted keys from. The
# CLUSTER AGENT PATCHes short-lived per-task GitHub tokens into it (see
# re-cinq/lore#685); it used to be the Floor.
agentSecretsName: agent-secrets
