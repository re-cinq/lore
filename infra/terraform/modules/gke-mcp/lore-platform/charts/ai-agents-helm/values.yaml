# Namespace for this subchart's own resources (controller, catalog, netpol, its RBAC).
namespace: ai-agents

# The kubectl image the crd-upgrade hook runs (templates/crd-upgrade-job.yaml):
# re-applies crds/*.yaml every deploy so schema changes reach live clusters —
# helm's native crds/ handling is install-only (#1134).
crdUpgrade:
  image: bitnami/kubectl:1.31

# Seed the initial AgentDefinition/Station catalog from scripts/task-types.yaml
# (templates/catalog.yaml). Operators set this false after first install so they
# stop re-seeding — the web UI owns the recipes thereafter (re-cinq/lore#698).
seedCatalog: true

# Where seeded agents stream their NDJSON run output for cost accounting (D8, #687):
# the Floor's in-cluster /api/agent-events endpoint. The recipes carry an
# `agent-events-auth` headers_secret for the Authorization header.
agentEventsUrl: http://lore-floor.lore-floor.svc.cluster.local:8080/api/agent-events

# In-cluster egress target for the agent-events sink — must match the host:port in
# agentEventsUrl above. The run-pod NetworkPolicy denies all RFC1918 egress except
# this one ClusterIP:port (templates/networkpolicy.yaml).
floorSink:
  namespace: lore-floor
  port: 8080

# The run-pod egress posture (templates/networkpolicy.yaml + ingest-station-egress.yaml).
# ON everywhere real. Turn OFF only for a laptop minikube (values.minikube.yaml): the
# deny-RFC1918 rule exists to stop a run pod reaching cluster-internal services, but in
# the hybrid local setup the Floor and Lore API ARE on the developer's host — an RFC1918
# host.minikube.internal — so the policy would drop exactly the traffic that must work.
# minikube's default CNI does not enforce NetworkPolicy anyway, so leaving these applied
# there would give a false sense of a posture that is not actually running.
networkPolicy:
  enabled: true

# NodeLocal DNSCache listen address. On clusters running NodeLocal DNS (GKE default),
# run pods resolve via this link-local IP instead of the kube-dns ClusterIP — and the
# metadata-endpoint block in the run-pod NetworkPolicy (169.254.0.0/16) would otherwise
# drop those queries. The chart allows port 53 to just this /32 (the metadata endpoint
# at 169.254.169.254 stays blocked). Empty string omits the rule for clusters without it.
nodeLocalDnsIp: 169.254.20.10

# The image the seeded `def-*` station recipes run (non-LLM assembly-line nodes,
# ADR-031 amendment). CI bumps the tag alongside the other service images.
stationImage: ghcr.io/re-cinq/lore-station:latest

# Lore API base URL the seeded station recipes call (createStationProject reads,
# apiEmbed, payload-by-reference fetches). IN-CLUSTER on purpose: the external LB
# VIP is useless from a run pod — Dataplane V2 short-circuits a VIP whose backend
# lives in this cluster (DNAT to the backend pod IP), and the post-DNAT 10.x
# address hits the egress policy's RFC1918 except-list, so the connection just
# times out (proven live 2026-07-17: api.anthropic.com answered while both Lore
# VIPs dropped). The run-pod NetworkPolicy opens exactly this service via apiSink.
loreApiUrl: http://lore-api.lore-api.svc.cluster.local:3000

# PUBLIC HTTPS URL of the shared lore-mcp gateway that agent recipes point at
# (resources.mcp_servers). IN-CLUSTER, for exactly the reason loreApiUrl documents
# above — this was PUBLIC :443 until 2026-08-10 and never worked. Dataplane V2
# short-circuits a VIP whose backend lives in this cluster, and the post-DNAT 10.x
# address hits the egress policy's RFC1918 except-list, so a run pod reaching the
# public gateway host just hangs. Observed in an agent init as
#   curl: (28) Failed to connect to lore-mcp.gcp.re-cinq.com port 443 after 135111 ms
# after which the init reported success and left the agent without its settings file
# (#1126). agentEventsUrl is not a counter-example: it is in-cluster too, with its own
# floorSink hole. Anything hosted in this cluster is reached in-cluster and opened
# explicitly via a *Sink below. Empty = agent MCP off until the gateway is deployed AND
# the ai-agent-subsystem wires mcp_servers (ADR-030).
loreMcpUrl: ""

# IN-CLUSTER base URL of the gateway's /skills registry the agent init fetches skills +
# settings from (resources.skills_source). Same host and same reason as loreMcpUrl.
# Empty = skills off (the init skips the fetch). Normally `<loreMcpUrl host>/skills`.
loreSkillsUrl: ""

# In-cluster egress target for the station API calls — must match the host:port in
# loreApiUrl above (same pattern as floorSink/agentEventsUrl).
apiSink:
  namespace: lore-api
  port: 3000

# In-cluster egress target for the lore-mcp gateway — must match the host:port in
# loreMcpUrl / loreSkillsUrl above. Covers both the agents' MCP transport and the
# init's skills+settings fetch; they are the same service.
mcpSink:
  namespace: lore-api
  port: 8080

# The spec-traceability graph the ingest-station recipes project into. In-cluster for
# the same reason as loreApiUrl; ingest-station-egress opens exactly this service.
dgraphUrl: http://lore-dgraph-alpha.lore-dgraph.svc.cluster.local:8080

controller:
  replicas: 1
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    # Pinned by digest (never a floating tag) — v0.8.1: the init container fetches
    # each recipe's resources.skills + settings.json from resources.skills_source
    # into the run's $HOME/.claude (ai-agent-subsystem#180, inert until skillsSource
    # is set), and the supervisor now carries its own run deadline — a wedged agent is
    # forced down and still reports a terminal event instead of dying silently with the
    # pod at the Job deadline, with the agent's stderr forwarded to the pod log tagged
    # `[agent]` (ai-agent-subsystem#47/#48). Resolved via
    #   skopeo inspect docker://ghcr.io/re-cinq/ai-agent-controller:v0.8.1
    digest: "sha256:3e3d76897436c1926f18c774af1820b60b7322fc44bd739349be2045efeb4213"
  # The image whose init container injects the agent runtime + supervisor into each run
  # pod. Controller + agent ship as a PAIR from the v-tag matrix — pinned to the v0.8.1
  # digest, paired with the controller above. The deadline fix needs BOTH: the injection
  # is the controller's, the enforcement the supervisor's, which rides in this image.
  # Resolve with (needs ghcr read on the ai-agent package — not public):
  #   skopeo inspect --no-tags docker://ghcr.io/re-cinq/ai-agent:v0.8.1
  agentImage: "ghcr.io/re-cinq/ai-agent@sha256:defe3031ca44b0fbdf4fbbd06bcbd2b128d90cf78beba3c9759233bb9c4f1262"
  # Tail of run-pod log kept in Agent.status.output (bounds the object under etcd's limit).
  maxOutputBytes: "262144"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      # 128Mi OOMKilled the controller in prod (2026-07-16: exit 137 ~60s after start,
      # 67 restarts) once the startup reconcile replayed the accumulated Agent CRs.
      memory: 512Mi

imagePullSecrets:
  - name: ghcr-pull-secret

# The cross-namespace caller allowed to create/get/watch Agents and to update the
# single agent-secrets Secret (the Lore Floor). Its ServiceAccount lives in another
# namespace; we bind it to the in-namespace agent-launcher + secret-writer Roles.
floor:
  serviceAccount: lore-floor
  namespace: lore-floor

# The cross-namespace MCP server allowed to manage the catalog recipes — the /agents
# editor's saves apply AgentDefinition/Station CRDs here (re-cinq/lore#698). The
# lore-api pod runs under its namespace's default ServiceAccount.
mcpServer:
  serviceAccount: default
  namespace: lore-api

# The single ESO-managed Secret the run pods mount allowlisted keys from. The Floor
# PATCHes short-lived per-task GitHub tokens into it (see re-cinq/lore#685).
agentSecretsName: agent-secrets

# The agent-secrets key holding the agent's LLM credential, used as BOTH the secret key
# and the env var the run pod sees. The controller renders it as a non-optional
# secretKeyRef, so this key must exist in agent-secrets or every run pod fails
# CreateContainerConfigError — change it only together with what writes that Secret (ESO
# here, scripts/infra/setup-minikube-agents.sh on a laptop). The `claude` CLI accepts
# either credential from its environment; values.minikube.yaml swaps in
# CLAUDE_CODE_OAUTH_TOKEN so a laptop run bills a developer's subscription instead of
# org API credit.
agentLlmSecretKey: ANTHROPIC_API_KEY
