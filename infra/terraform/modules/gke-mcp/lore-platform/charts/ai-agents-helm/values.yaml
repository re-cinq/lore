# Namespace for this subchart's own resources (controller, catalog, netpol, its RBAC).
namespace: ai-agents

# Seed the initial AgentDefinition/Station catalog from scripts/task-types.yaml
# (templates/catalog.yaml). Operators set this false after first install so they
# stop re-seeding — the web UI owns the recipes thereafter (re-cinq/lore#698).
seedCatalog: true

# Where seeded agents stream their NDJSON run output for cost accounting (D8, #687):
# the Floor's in-cluster /api/agent-events endpoint. The recipes carry an
# `agent-events-auth` headers_secret for the Authorization header.
agentEventsUrl: http://lore-floor.lore-floor.svc.cluster.local:8080/api/agent-events

# In-cluster egress target for the agent-events sink — must match the host:port in
# agentEventsUrl above. The run-pod NetworkPolicy denies all RFC1918 egress except
# this one ClusterIP:port (templates/networkpolicy.yaml).
floorSink:
  namespace: lore-floor
  port: 8080

# NodeLocal DNSCache listen address. On clusters running NodeLocal DNS (GKE default),
# run pods resolve via this link-local IP instead of the kube-dns ClusterIP — and the
# metadata-endpoint block in the run-pod NetworkPolicy (169.254.0.0/16) would otherwise
# drop those queries. The chart allows port 53 to just this /32 (the metadata endpoint
# at 169.254.169.254 stays blocked). Empty string omits the rule for clusters without it.
nodeLocalDnsIp: 169.254.20.10

# The image the seeded `def-*` station recipes run (non-LLM assembly-line nodes,
# ADR-031 amendment). CI bumps the tag alongside the other service images.
stationImage: ghcr.io/re-cinq/lore-station:latest

controller:
  replicas: 1
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    # Pinned by digest (never a floating tag) — v0.4.0, which registers the `exec`
    # vendor (station recipes run as plain commands). Resolved via
    #   skopeo inspect docker://ghcr.io/re-cinq/ai-agent-controller:v0.4.0
    digest: "sha256:73a75fce24b5c5fdc0b5420427936bf918a972e2010dae1eef9d54d640b513e4"
  # The image whose init container injects the agent runtime + supervisor into each run
  # pod. Controller + agent ship as a PAIR from the v-tag matrix — pinned to the v0.4.0
  # digest, paired with the controller above. v0.4.0's `exec` vendor also carries the
  # no-op ExecSetup, so station pods skip the claude-CLI install. Resolve with (needs
  # ghcr read on the ai-agent package — not public):
  #   skopeo inspect --no-tags docker://ghcr.io/re-cinq/ai-agent:v0.4.0
  agentImage: "ghcr.io/re-cinq/ai-agent@sha256:9a945eb8bbd08b2f583f7ab98cf5271982002882ec40469eb82120248102ab5c"
  # Tail of run-pod log kept in Agent.status.output (bounds the object under etcd's limit).
  maxOutputBytes: "262144"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

imagePullSecrets:
  - name: ghcr-pull-secret

# The cross-namespace caller allowed to create/get/watch Agents and to update the
# single agent-secrets Secret (the Lore Floor). Its ServiceAccount lives in another
# namespace; we bind it to the in-namespace agent-launcher + secret-writer Roles.
floor:
  serviceAccount: lore-floor
  namespace: lore-floor

# The cross-namespace MCP server allowed to manage the catalog recipes — the /agents
# editor's saves apply AgentDefinition/Station CRDs here (re-cinq/lore#698). The
# lore-api pod runs under its namespace's default ServiceAccount.
mcpServer:
  serviceAccount: default
  namespace: lore-api

# The single ESO-managed Secret the run pods mount allowlisted keys from. The Floor
# PATCHes short-lived per-task GitHub tokens into it (see re-cinq/lore#685).
agentSecretsName: agent-secrets
