# Cross-namespace authz for the Lore Floor (ServiceAccount in {{ .Values.floor.namespace }}):
#   1. create/get/watch Agents here (bound to the agent-launcher Role), and
#   2. update ONLY the single agent-secrets Secret — to PATCH short-lived per-task
#      GitHub tokens in/out (re-cinq/lore#685). resourceNames scopes it to that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lore-floor-agent-launcher
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-launcher
subjects:
  - kind: ServiceAccount
    name: {{ .Values.floor.serviceAccount }}
    namespace: {{ .Values.floor.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-secret-writer
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.agentSecretsName }}"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lore-floor-agent-secret-writer
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-secret-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.floor.serviceAccount }}
    namespace: {{ .Values.floor.namespace }}
---
# The token provisioner clones per-task AgentDefinition/Station pairs from the
# def-* catalog (KubeTokenProvisioner.provision/cleanup), so the Floor needs
# catalog CRUD. Reuses lore-api's catalog-writer Role (DRY): it is broader than
# the provisioner's get/create/update/delete — it also grants list/patch and
# reaches the source def-* recipes and other runs' pt-* clones — so this is a
# pragmatic reuse, not least-privilege. A dedicated Role would tighten it.
# Without this binding every station dispatch dies on a 403 reading the catalog.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lore-floor-catalog-writer
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.floor.serviceAccount }}
    namespace: {{ .Values.floor.namespace }}
