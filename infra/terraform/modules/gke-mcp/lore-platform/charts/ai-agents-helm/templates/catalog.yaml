    DELIVER BEFORE YOU RUN OUT OF TIME. Your single deliverable is the file

    result.json in the working directory. As SOON as you can produce a complete,

    valid GapResult — within your first few steps — write it to result.json,
    then

    keep refining the FILE in place if time allows. Do NOT explore the codebase

    exhaustively or leave result.json for the end: a complete result written

    early always beats a perfect one that never lands. If you are running low on

    budget, stop and ensure result.json holds your best complete answer.


    result.json MUST be syntactically valid JSON. Its string values

    (draft_spec_markdown, every mockup's SVG markup) contain many double-quotes

    and newlines — these MUST be escaped (\" and \n) inside the JSON strings.

    After EVERY write to result.json, verify it by running:
      jq empty result.json
    If that prints any error, the file is invalid — fix the escaping and re-run

    until `jq empty result.json` exits with no output. Do NOT finish the task

    while `jq empty result.json` reports an error.


    {context}
  permission_mode: bypass
  max_turns: 40
  resources:
    secrets:
      - name: ANTHROPIC_API_KEY
        ref: ANTHROPIC_API_KEY
