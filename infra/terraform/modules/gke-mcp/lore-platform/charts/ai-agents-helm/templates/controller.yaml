apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
  namespace: {{ .Values.namespace }}
  labels:
    agents.re-cinq.com/component: controller
spec:
  # Two replicas for HA; only the leader-election Lease holder reconciles, a standby
  # takes over within the lease duration if the leader's pod dies.
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      agents.re-cinq.com/component: controller
  template:
    metadata:
      labels:
        agents.re-cinq.com/component: controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agent-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}@{{ .Values.controller.image.digest }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ .Values.namespace }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEALTH_PORT
              value: "8081"
            - name: AGENT_IMAGE
              value: "{{ .Values.controller.agentImage }}"
            - name: MAX_OUTPUT_BYTES
              value: "{{ .Values.controller.maxOutputBytes }}"
          ports:
            - name: health
              containerPort: 8081
          # Probe budgets sized for the STARTUP SYNC (#1290, 2026-08-18): the
          # controller reconciles its whole Agent inventory before the event
          # loop breathes, and the defaulted 1s probe timeout executed it ~80s
          # into a 2,657-CR sync — every restart regrew the pile the pruner
          # never lived to shrink. The startupProbe owns the boot window (up to
          # ~10 min of sync); liveness then watches for real wedges with a
          # timeout that tolerates a busy event loop.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
