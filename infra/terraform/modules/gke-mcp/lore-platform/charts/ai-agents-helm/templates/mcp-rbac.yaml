# Cross-namespace authz for the Lore MCP server (ServiceAccount in
# {{ .Values.mcpServer.namespace }}): manage the catalog AgentDefinition/Station recipes
# in this namespace, so the /agents editor's saves apply the source-of-truth CRDs
# (re-cinq/lore#698, ADR-031 D2). Scoped to the two recipe kinds; the controller keeps
# exclusive write access to Agents.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-writer
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agentdefinitions", "stations"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lore-mcp-catalog-writer
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.mcpServer.serviceAccount }}
    namespace: {{ .Values.mcpServer.namespace }}
