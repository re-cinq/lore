{{- if .Values.seedCatalog }}
# RBAC for the catalog-seed hook. The seeded objects are namespaced, so a Role is
# enough — unlike the crd-upgrade hook next door, whose CRDs are cluster-scoped.
# No resourceNames: the seed legitimately CREATES entries, and RBAC ignores
# resourceNames for creation, so naming them would only pretend to narrow this.
# Hook-weighted before the Job so the SA exists when it runs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-catalog-seed
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-catalog-seed
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agentdefinitions", "stations"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name }}-catalog-seed
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name }}-catalog-seed
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ .Chart.Name }}-catalog-seed
  apiGroup: rbac.authorization.k8s.io
{{- end }}
