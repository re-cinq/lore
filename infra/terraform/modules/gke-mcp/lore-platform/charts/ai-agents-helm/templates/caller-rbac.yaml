# A narrow Role for in-cluster apps that launch and inspect runs. Beyond the Agent
# CRs it also grants read-only access to the run pods and their logs, so the Floor
# can serve live per-node pod logs on-demand (Agent CR -> status.jobName -> pod ->
# logs). The Lore Floor (a cross-namespace ServiceAccount) is bound to this Role in
# templates/floor-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-launcher
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
