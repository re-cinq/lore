# The satellite cluster-agent. Note what is ABSENT: no database env, none of
# the central bus-wide ingest credential (FR5 keeps that central — the
# satellite reports with the per-agent token it received at registration),
# and no agent-events telemetry sink (ai-agents.agentEventsUrl is left unset
# in values.yaml, which the catalog's guard omits entirely — that sink's
# secret is the same class of bus-wide credential, #1575). The GitHub
# credential below is the one exception: it is per-satellite-operator, not
# bus-wide, so it is an explicit opt-in rather than something this chart
# withholds by design.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lore-cluster-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-cluster-agent
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, never RollingUpdate: this process is a singleton registrant. Two
  # overlapping pods each re-register, and every registration rotates the
  # per-agent token out from under the other — the loser's reports 401 until
  # it notices, and a terminal event can be dropped in that window (run
  # 595d2b0b, 2026-08-28). A few seconds of no claims beats a lost outcome.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lore-cluster-agent
  template:
    metadata:
      labels:
        app: lore-cluster-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: lore-cluster-agent
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: cluster-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: LORE_API_URL
              value: {{ required "loreApiUrl is required — the central lore-api base URL" .Values.loreApiUrl | quote }}
            - name: EVENT_ROUTER_URL
              value: {{ required "eventRouterUrl is required — the central event-router front door" .Values.eventRouterUrl | quote }}
            {{- if .Values.floorUrl }}
            # Where the agent-events relay forwards what this cluster's run
            # pods post to it. Its presence is what mounts the relay route at
            # all: a relay that accepts a batch with nowhere to send it is worse
            # than no relay, so the route 404s rather than dropping the batch.
            - name: LORE_FLOOR_URL
              value: {{ .Values.floorUrl | quote }}
            {{- end }}
            - name: LORE_CLUSTER_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lore-cluster-agent-registration
                  key: token
            - name: LORE_CLUSTER_AGENT_NAME
              value: {{ required "name is required — this cluster's unique registry name" .Values.name | quote }}
            - name: LORE_CLUSTER_AGENT_TAGS
              {{- if not .Values.tags }}
              {{- fail "tags is required — the capability tags this cluster offers, e.g. {node:agent,node:validate}" }}
              {{- end }}
              value: {{ join "," .Values.tags | quote }}
            - name: LORE_STATION_BACKEND
              value: "k8s"
            - name: LORE_AGENTS_NAMESPACE
              value: {{ .Values.agentsNamespace | quote }}
            # Identity persists through the Kubernetes Secret API (the
            # lore-cluster-agent-identity Role) — the container is read-only,
            # so a file path here would EROFS on the first save.
            - name: LORE_CLUSTER_AGENT_IDENTITY_SECRET
              value: {{ .Values.identity.secretName | quote }}
            - name: LORE_CLUSTER_AGENT_IDENTITY_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: LORE_CLUSTER_AGENT_IDENTITY_KEY
              value: {{ .Values.identity.fileName | quote }}
            # The per-task GitHub credential (#1575): this process mints the
            # installation token every claimed run's git push needs, and
            # without one every claim fails "GitHub not configured" after
            # launch — a silently wasted claim on a satellite. Optional and
            # deliberately not required: unlike the LLM credential, handing a
            # satellite a GitHub credential is the operator's call, made by
            # setting github.token (a scoped PAT is the least-privilege
            # choice) or the full github.app.* triple.
            {{- if .Values.github.token }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.secretName }}
                  key: token
            {{- else if .Values.github.app.appId }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.secretName }}
                  key: app-id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.secretName }}
                  key: private-key
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.secretName }}
                  key: installation-id
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The identity Secret, surfaced read-only for inspection; the
            # process reads AND writes it via the Kubernetes API (the
            # lore-cluster-agent-identity Role), never through this mount.
            # optional: it does not exist before the first registration.
            - name: identity
              mountPath: {{ .Values.identity.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: identity
          secret:
            secretName: {{ .Values.identity.secretName }}
            optional: true
