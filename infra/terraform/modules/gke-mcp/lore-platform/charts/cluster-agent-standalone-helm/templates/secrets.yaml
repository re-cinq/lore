# Chart-managed Secrets. On the central platform these arrive via ESO from
# GCP Secret Manager; a satellite has neither, so the chart writes them from
# required values. Note what is NOT here: no database credential, and not the
# central bus-wide ingest credential — FR5 keeps that central; the satellite
# reports with the per-agent token in {{ .Values.identity.secretName }}
# (which the POD creates, never this chart).
apiVersion: v1
kind: Secret
metadata:
  name: lore-cluster-agent-registration
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  token: {{ required "registrationToken is required — the pre-shared cluster-agent registration token" .Values.registrationToken | quote }}
---
{{- $username := required "ghcr.username is required — GHCR pull credentials" .Values.ghcr.username }}
{{- $token := required "ghcr.token is required — GHCR pull credentials" .Values.ghcr.token }}
{{- $dockerconfig := dict "auths" (dict "ghcr.io" (dict "auth" (printf "%s:%s" $username $token | b64enc))) | toJson }}
{{- range $ns := list .Values.namespace .Values.agentsNamespace }}
# Both charts' imagePullSecrets already point at this name.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ $ns }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $dockerconfig | quote }}
---
{{- end }}
# The run pods mount agent-secrets[{{ .Values.llm.secretKey }}] as their LLM
# credential (a non-optional secretKeyRef rendered by the ai-agents
# controller); the cluster-agent's provisioner PATCHes per-task GitHub tokens
# into this same Secret, which is why its Role grants patch on exactly this
# name.
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: {{ .Values.agentsNamespace }}
type: Opaque
stringData:
  {{ .Values.llm.secretKey }}: {{ required "llm.credential is required — the agent LLM credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN)" .Values.llm.credential | quote }}
{{- if or .Values.github.token .Values.github.app.appId }}
---
# The optional per-task GitHub credential (#1575): a PAT or the App triple,
# read by the cluster-agent process (never mounted into a run pod) to mint
# each claimed run's push credential. Absent unless the operator opted in.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.github.secretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{- if .Values.github.token }}
  token: {{ .Values.github.token | quote }}
  {{- else }}
  app-id: {{ .Values.github.app.appId | quote }}
  private-key: {{ required "github.app.privateKey is required when github.app.appId is set" .Values.github.app.privateKey | quote }}
  installation-id: {{ required "github.app.installationId is required when github.app.appId is set" .Values.github.app.installationId | quote }}
  {{- end }}
{{- end }}
