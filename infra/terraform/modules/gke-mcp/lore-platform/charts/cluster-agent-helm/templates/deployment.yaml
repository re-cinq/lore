apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-cluster-agent
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, never RollingUpdate: this process is a singleton registrant. Two
  # overlapping pods each re-register, and every registration rotates the
  # per-agent token out from under the other — the loser's reports 401 until
  # it notices, and a terminal event can be dropped in that window (run
  # 595d2b0b, 2026-08-28). A few seconds of no claims beats a lost outcome.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lore-cluster-agent
  template:
    metadata:
      labels:
        app: lore-cluster-agent
    spec:
      # This pod holds the only Kubernetes credentials in the platform, which
      # makes it the one worth hardening: a container escape here is cluster
      # authority, not a lost REST reply.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: lore-cluster-agent
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: cluster-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "lore-cluster-agent.env" . | nindent 12 }}
          # /healthz answers as soon as the process is serving; it deliberately
          # does NOT probe the apiserver. A blip would take the agent out of
          # rotation exactly when a caller most needs a real error from it, and
          # every route reports its own failure honestly.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The root filesystem is read-only above; Node still wants a writable
            # /tmp, and an emptyDir is the cheapest way to grant exactly that.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
