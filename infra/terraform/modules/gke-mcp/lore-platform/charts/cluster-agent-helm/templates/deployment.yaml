apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-cluster-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lore-cluster-agent
  template:
    metadata:
      labels:
        app: lore-cluster-agent
    spec:
      serviceAccountName: lore-cluster-agent
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: cluster-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "lore-cluster-agent.env" . | nindent 12 }}
          # /healthz answers as soon as the process is serving; it deliberately
          # does NOT probe the apiserver. A blip would take the agent out of
          # rotation exactly when a caller most needs a real error from it, and
          # every route reports its own failure honestly.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
