# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-cluster-agent

# The namespace it acts on. Must match the ai-agents subchart's namespace, since
# that is where Agent CRs, the token Secret and the catalog live.
agentsNamespace: ai-agents

# Stateless and idempotent — `create` is keyed on a deterministic name and
# returns created:false on 409 — so this could scale out. Kept at 1 because
# nothing needs it to yet.
replicaCount: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-cluster-agent
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "300m"
    # Pod logs are read tail-limited into memory (the tail is clamped at 10k
    # lines server-side), and CR lists are capped at one 100-item page.
    memory: 256Mi
  requests:
    cpu: "50m"
    memory: 128Mi

env:
  PORT: "8080"

# The token every caller (Floor, lore-api) presents. Same secret on both ends.
ingestTokenSecret:
  name: lore-agent-internal-token
  key: token

# The GitHub App triple. This service MINTS the per-task installation token
# itself, so no GitHub token ever crosses the network — the trade recorded in
# ADR-024 is that the App private key lives here as well as on the Floor.
githubAppSecret:
  name: lore-cluster-agent-github-app
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# The central claim loop (FR3 of specs/running-stations-in-any-k8s-cluster).
# The flip to pull-based dispatch means EVERY pod node queues for a claim —
# an umbrella deploy without this block leaves the queue with no claimant and
# every run dies at the queue-wait bound. Enabled by default: a central
# cluster that cannot claim is not a working factory.
claim:
  enabled: true
  # The registry name; the reaper resolves CR visibility by it
  # (LORE_CENTRAL_CLUSTER_AGENT_NAME defaults to "central" on the Floor).
  name: central
  # The central agent carries every tag, including the central-only ones
  # (node:ingest mounts LORE_INGEST_TOKEN) satellites never receive.
  tags: node:agent,node:validate,node:gate,node:retrospective,node:github_action,node:detect,node:ingest,node:comment-triage
  # In-cluster URL — registration/claim/heartbeat never leave the VPC here.
  loreApiUrl: http://lore-api.lore-api.svc.cluster.local:3000
  registrationTokenSecret:
    name: lore-cluster-agent-registration-token
    key: token
  # Identity {id, token} persists through the Kubernetes Secret API — the
  # container is readOnlyRootFilesystem (templates/rbac.yaml grants the one
  # named Secret).
  identitySecretName: lore-cluster-agent-identity

# Stream run-pod stdout to the bus as it happens (LORE_POD_LOG_STREAMING). OFF
# by default: this is the input that puts log VOLUME on pipeline.events. The
# central cluster needs it least — its pod logs are already readable live — so
# it is here for parity, not because it should be on.
podLogStreaming: false
