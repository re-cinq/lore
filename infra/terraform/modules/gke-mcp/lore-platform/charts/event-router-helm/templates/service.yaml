apiVersion: v1
kind: Service
metadata:
  name: lore-event-router
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-event-router
spec:
  type: {{ .Values.service.type }}
  selector:
    app: lore-event-router
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
