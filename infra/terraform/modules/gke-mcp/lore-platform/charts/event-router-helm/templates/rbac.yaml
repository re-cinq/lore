# The router WATCHES Agent CRs and does nothing else to them — no create, no
# update, no delete. Dispatch and pruning stay with the Floor, and this Role is
# where that boundary is actually enforced rather than merely intended.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lore-event-router-agent-watch
  namespace: {{ .Values.agentsNamespace | default "ai-agents" }}
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lore-event-router-agent-watch
  namespace: {{ .Values.agentsNamespace | default "ai-agents" }}
subjects:
  - kind: ServiceAccount
    name: lore-event-router
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: lore-event-router-agent-watch
  apiGroup: rbac.authorization.k8s.io
