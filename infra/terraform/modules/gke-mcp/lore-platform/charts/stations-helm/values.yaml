# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-stations

# One replica: each station carries an in-process latch that stops a second
# concurrent run of itself, and that guard is per-process. Two replicas would
# each hold their own, so a retried tick could sweep twice. Raising this needs a
# shared lock first.
replicaCount: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-stations
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "500m"
    # merge-check walks every mergeable task and talks to GitHub for each; the
    # ceiling is set by the widest sweep rather than steady state.
    memory: 512Mi
  requests:
    cpu: "50m"
    memory: 256Mi

# Annotations for the lore-stations KSA. Terraform sets the Workload Identity
# annotation here when enable_gcp_billing_export is on; empty otherwise.
serviceAccount:
  annotations: {}

env:
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  PORT: "8080"

# The external floor engine (its own namespace and Helm release). Off by default;
# terraform sets enabled from var.enable_external_floor.
floor:
  enabled: false
  apiUrl: http://floor-api.floor.svc.cluster.local:8080
  serviceTokenSecret:
    name: floor-service-token
    key: token

dbPasswordSecret:
  name: lore-stations-db-password
  key: password

# The token stations accept, and the one the Floor presents when it calls them.
# Both ends read the same secret.
ingestTokenSecret:
  name: lore-agent-internal-token
  key: token

# lore-api's own bearer token, presented as LORE_STATION_TOKEN by the stations
# that read and write through lore-api (createStationProject prefers it over
# LORE_INGEST_TOKEN, which here is the Floor<->stations token lore-api rejects).
# Optional: an unsynced secret leaves the variable unset instead of failing the
# pod, so this can merge before the terraform that syncs it.
stationTokenSecret:
  name: lore-ingest-token
  key: token

# GitHub App triple — merge-check merges PRs, comments on issues and reads CI.
githubAppSecret:
  name: lore-stations-github-app
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# Optional: auto-curation asks Haiku for a lesson after a merge. Absent → the
# episode is still written, the curation step is skipped.
anthropicKeySecret:
  name: lore-stations-anthropic-key
  key: anthropic-api-key

# Optional org Admin API key (sk-ant-admin…) for the anthropic-cost-sync station
# (moved here from lore-api in #1522). Absent → the sync skips and /spend degrades
# to Lore-computed costs. Same secret as above, second key.
anthropicAdminKeySecret:
  name: lore-stations-anthropic-key
  key: anthropic-admin-key

# Optional Slack bot token for the stations that post to Slack (escalation
# notify, the daily digest). Mirrored by the es_stations_slack ExternalSecret;
# absent, those stations report the missing token instead of posting.
slackBotTokenSecret:
  name: lore-stations-slack
  key: bot-token

# path is per-entry because the two kinds of scheduled work land in different
# places: work with STEPS posts /api/assembly-runs and runs as a real assembly
# line; a single data operation posts /api/stations/<job> and runs inside
# lore-api. Neither runs in a coordinator, which is the point.
courier:
  # Pinned by DIGEST, not by tag: this container is handed the org ingest token,
  # and a tag is mutable — `8.11.1` can be repointed at a different image without
  # anything in this repo changing. The tag is kept alongside the digest for
  # human legibility; the digest is what Kubernetes resolves.
  image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
courierJobs:
  # Was the Floor's memory_ttl CronJob (#1351): a single DELETE that had its own
  # pod built from the coordinator's image. Same hour, same work, two hops.
  - name: memory-ttl
    schedule: "0 * * * *"
    path: /api/stations/memory-ttl
  # Was the Floor's importance_decay CronJob (#1350).
  - name: importance-decay
    schedule: "0 5 * * *"
    path: /api/stations/importance-decay
  # Was the Floor's anthropic_cost_sync CronJob (#1348). Daily, deliberately:
  # the cost report only changes once a day (buckets close at UTC midnight and
  # the in-progress day is never emitted), so one sync after the day settles is
  # sufficient — see ADR-043.
  - name: anthropic-cost-sync
    schedule: "0 7 * * *"
    path: /api/stations/anthropic-cost-sync
  # Daily like the Anthropic sync, an hour after it: Google's billing export
  # closes days at UTC midnight and restates stragglers later, so one pull
  # after the day settles is enough and the 31-day window self-heals the rest.
  # Skips (never fails) until LORE_GCP_BILLING_PROJECT/_DATASET are set by
  # terraform (enable_gcp_billing_export) and the console-side export exists.
  - name: gcp-cost-sync
    schedule: "0 8 * * *"
    path: /api/stations/gcp-cost-sync
  # Was the Floor's consolidation CronJob, the last scheduled job that ran from
  # the Floor's image and did real work. Same hour. It calls a model, so the
  # post takes as long as those calls do: a few seconds per repository.
  - name: consolidation
    schedule: "30 5 * * *"
    path: /api/stations/consolidation
    # 10 to 17 seconds on a normal night; a retried post would store the same
    # patterns twice, so the post gets most of the job's deadline instead.
    maxTimeSeconds: 110
    retries: 0

