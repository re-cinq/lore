apiVersion: v1
kind: ServiceAccount
metadata:
  name: lore-stations
  namespace: {{ .Values.namespace }}
  {{- with .Values.serviceAccount.annotations }}
  # Workload Identity: iam.gke.io/gcp-service-account binds this KSA to a GCP
  # SA (the gcp-cost-sync station's BigQuery read). Set from terraform.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
