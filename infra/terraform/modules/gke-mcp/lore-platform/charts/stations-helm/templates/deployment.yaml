apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-stations
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lore-stations
  template:
    metadata:
      labels:
        app: lore-stations
    spec:
      serviceAccountName: lore-stations
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: stations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "lore-stations.env" . | nindent 12 }}
          # /healthz answers 503 while Postgres is unreachable — every station
          # here works by reading and writing the database, so a pool that
          # cannot answer means none of them can run.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
