apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: lore-floor
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lore-floor
  template:
    metadata:
      labels:
        app: lore-floor
      annotations:
        # Roll the pods whenever the mounted task-types.yaml content changes —
        # without this a ConfigMap update leaves running pods on the old file.
        checksum/task-types: {{ sha256sum (.Values.taskTypesConfig | default "") }}
    spec:
      serviceAccountName: lore-floor
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "lore-floor.env" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.configMap.name }}
