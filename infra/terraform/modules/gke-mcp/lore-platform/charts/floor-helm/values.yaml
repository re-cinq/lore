# Namespace this subchart's resources are deployed into (umbrella spans namespaces).
namespace: lore-floor

replicaCount: 1

# Agent is a singleton (job processors don't tolerate two writers
# claiming the same task). Use a PDB to block Autopilot from evicting
# without warning, but keep replicas at 1 — HA at the agent layer
# requires lease coordination that doesn't exist yet.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-floor
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  # Shared Dgraph endpoint (memory + spec-trace graphs). Empty → graph features
  # fail soft. Overridden by terraform set to the in-cluster service DNS.
  LORE_DGRAPH_HTTP: ""
  ANTHROPIC_MODEL: claude-haiku-4-5-20251001
  TASK_TYPES_PATH: /config/task-types.yaml
  PORT: "8080"
  LORE_INGEST_URL: ""
  LORE_LOG_BUCKET: ""
  # Web-UI base url. When set, task UUIDs in PR/issue bodies link to the
  # pipeline page (mcp-server/agent linkify). Empty → UUIDs stay plain text.
  LORE_UI_URL: ""
  # Business-hours gate for review-reactor safety cron. Override at
  # deploy time if the team isn't CET / Mon-Fri 9-18.
  LORE_BUSINESS_HOURS_TZ: Europe/Berlin
  LORE_BUSINESS_HOURS_START: "9"
  LORE_BUSINESS_HOURS_END: "18"
  LORE_BUSINESS_DAYS: "1,2,3,4,5"
  # Jobs that get 1-hour prompt-cache TTL (stable system prompt + bursty
  # calls amortize the 1.25x write premium). Use "none" to disable 1h
  # everywhere, "*" to enable for all jobs. See agent/src/lib/prompt-cache.ts.
  LORE_CACHE_1H_JOBS: "auto-curation,review_reactor,fact-extraction,graph-extraction"
  # Station execution backend (ADR-028). On the cluster, cluster tasks dispatch
  # Agent CRs to the ai-agent-subsystem (agent-cr); "k8s" is explicit here though
  # the in-cluster default (KUBERNETES_SERVICE_HOST present → k8s) resolves the
  # same. Only the feature-planning/finalize "inprocess" escape hatch reads this.
  LORE_STATION_BACKEND: "k8s"
  # Bot login the auto-merge gate accepts as the "bot APPROVED" review.
  # Must match the GitHub App slug installed on the org (visible in
  # the App's settings page). If misconfigured, no PR will satisfy
  # `require_bot_approval` and every dark-mode PR defers with
  # `deferred:bot_changes_requested`. See agent/src/lib/pr-policy.ts.
  LORE_REVIEW_BOT_LOGIN: "lore-agent[bot]"

dbPasswordSecret:
  name: lore-floor-db-password
  key: password

anthropicKeySecret:
  name: lore-floor-anthropic-key
  key: anthropic-api-key

# Optional Admin API key (sk-ant-admin…) for the anthropic-cost-sync cron.
# Absent → the cron no-ops and the /spend page degrades to Lore-computed costs.
anthropicAdminKeySecret:
  name: lore-floor-anthropic-key
  key: anthropic-admin-key

githubAppSecret:
  name: lore-floor-github-app
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# Shared secret with mcp-server used to authenticate
# POST /api/trigger/review-reactor (webhook → agent fan-out).
internalTokenSecret:
  name: lore-agent-internal-token
  key: token

configMap:
  name: lore-floor-config

# Slack integration (optional — for PR/failure notifications back to Slack)
slackBotTokenSecret:
  name: lore-slack-credentials
  key: bot-token

# HMAC secret for verifying GitHub webhook signatures (the webhook ingress moved
# into the Floor — POST /api/webhook/github). Optional: the env is mounted with
# optional:true so a pod can start before the ExternalSecret lands (the handler
# returns 503 until the secret is present).
webhookSecret:
  name: lore-floor-webhook-secret
  key: secret

gcpProject: ""

# K8s CronJob batch jobs (one pod per run, isolated from the Deployment).
# Each entry produces a CronJob that calls `node dist/delivery/job-runner.js {{ .job }}`
# inside the agent image, reusing the same env block as the Deployment
# (see templates/_env.tpl). Schedules match the in-process pre-split
# cadence one-for-one. Resources/deadlines override `cronJobDefaults`
# per entry — heavy LLM/embedding jobs (context_reindex, eval_runner,
# autoresearch) get bumped from the defaults below.
#
# Manual run for any of these:
#   kubectl create job --from=cronjob/<name> manual-$(date +%s)
cronJobDefaults:
  # concurrencyPolicy=Forbid mirrors the in-process scheduler's
  # "running" set — a tick that fires while the previous run is still
  # going is dropped, not queued. (5-lore-floor SC2.)
  concurrencyPolicy: Forbid
  # startingDeadlineSeconds gives K8s a window to launch a missed tick
  # after a brief outage, replacing scheduler.checkMissedRuns() for
  # CronJob-migrated jobs (FR1a). 10 min: long enough to bridge a pod
  # restart, short enough that the next tick isn't a duplicate of the
  # previous schedule slot.
  startingDeadlineSeconds: 600
  # backoffLimit + restartPolicy: Never => one retry on crash, then mark
  # the Job failed. Production hangs are caught by activeDeadlineSeconds.
  backoffLimit: 1
  # 1h wall-clock cap — sized for the lightweight jobs; heavy jobs
  # below override to longer.
  activeDeadlineSeconds: 3600
  # Successful runs to retain (Job objects) — keep 3 for forensic
  # access; failed runs keep more for postmortem.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi

cronJobs:
  # Lightweight cleanups (defaults are fine)
  - name: memory-ttl
    job: memory_ttl
    schedule: "0 * * * *"
  - name: importance-decay
    job: importance_decay
    schedule: "0 5 * * *"
  - name: consolidation
    job: consolidation
    schedule: "30 5 * * *"
  - name: gap-detection
    job: gap_detection
    schedule: "0 9 * * 1"
  - name: spec-drift
    job: spec_drift
    schedule: "0 10 * * 1"
  - name: spec-coverage-backfill
    job: spec_coverage_backfill
    schedule: "0 11 * * 1"
  - name: spec-coverage-validate
    job: spec_coverage_validate
    schedule: "0 6 * * *"
  - name: context-core-builder
    job: context_core_builder
    schedule: "0 4 * * *"
  - name: anthropic-cost-sync
    job: anthropic_cost_sync
    schedule: "0 7 * * *"  # daily, after the prior billing day settles

  # Heavy LLM / embedding jobs — bigger memory + longer deadline
  - name: context-reindex
    job: context_reindex
    schedule: "0 2 * * *"
    activeDeadlineSeconds: 10800  # 3h: full repo embedding refresh
    resources:
      requests:
        cpu: "200m"
        memory: 1Gi
      limits:
        cpu: "1000m"
        memory: 2Gi
  - name: eval-runner
    job: eval_runner
    schedule: "0 3 * * *"
    activeDeadlineSeconds: 7200  # 2h: per-team PromptFoo eval suites
    resources:
      requests:
        cpu: "200m"
        memory: 1Gi
      limits:
        cpu: "1000m"
        memory: 2Gi
  - name: autoresearch
    job: autoresearch
    schedule: "0 6 * * 1"
    activeDeadlineSeconds: 7200  # 2h: weekly LLM-driven research synthesis
    resources:
      requests:
        cpu: "200m"
        memory: 1Gi
      limits:
        cpu: "1000m"
        memory: 2Gi
