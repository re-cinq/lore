# CI fixture: exercises templates that render NOTHING under default values.
#
# `courierJobs` is empty by default, so a defaults-only render proves nothing
# about the courier CronJob template. Both entry shapes are covered here — a
# bodyless maintenance post and a body-carrying assembly-run start — because the
# body block and its Content-Type header are conditional.
courierJobs:
  - name: ci-bodyless
    schedule: "0 * * * *"
    path: /api/maintenance/ci-example
  - name: ci-with-body
    schedule: "30 5 * * *"
    path: /api/assembly-runs
    body:
      definition: ci-example
      repo: re-cinq/lore
      args:
        lookback_days: 7
