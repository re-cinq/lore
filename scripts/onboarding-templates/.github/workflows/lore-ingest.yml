name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'adrs/**'
      - 'runbooks/**'
      - 'teams/**'
      - '.specify/**'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | tr '\n' ',')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Trigger Lore ingestion
        if: steps.changes.outputs.files != ''
        run: |
          curl -sf -X POST "${{ secrets.LORE_MCP_ENDPOINT }}/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "delegate_task",
                "arguments": {
                  "task": "Incrementally ingest changed files: ${{ steps.changes.outputs.files }}",
                  "context": {
                    "branch": "main"
                  },
                  "priority": "normal"
                }
              }
            }' || echo "Warning: Could not reach Lore MCP endpoint"
