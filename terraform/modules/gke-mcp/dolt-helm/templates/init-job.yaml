apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              cd /var/lib/dolt
              if [ ! -d "beads-tasks/.dolt" ]; then
                mkdir -p beads-tasks
                cd beads-tasks
                dolt init --name "lore-platform" --email "platform@lore.dev"
                echo "Dolt database initialized"
              else
                echo "Database already exists, skipping init"
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/dolt
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-{{ .Release.Name }}-0
