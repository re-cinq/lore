apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: sql
      port: {{ .Values.service.sqlPort }}
      targetPort: sql
      protocol: TCP
    - name: remotesapi
      port: {{ .Values.service.remoteApiPort }}
      targetPort: remotesapi
      protocol: TCP
  selector:
    app: {{ .Release.Name }}
