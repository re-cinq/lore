image:
  repository: dolthub/dolt-sql-server
  tag: latest
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 10Gi
  storageClass: standard-rwo

service:
  type: ClusterIP
  sqlPort: 3306
  remoteApiPort: 50051

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

config:
  # dolt sql-server config.yaml
  log_level: info
  user:
    name: beads
    password: ""  # set via secret
  listener:
    host: "0.0.0.0"
    port: 3306
  remotesapi:
    port: 50051
  databases:
    - name: beads-tasks
      path: /var/lib/dolt/beads-tasks
