replicaCount: 1

image:
  repository: ghcr.io/re-cinq/klaus
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: "250m"
    memory: 512Mi

taskDefaults:
  timeoutMinutes: 30
  maxConcurrent: 5

serviceAccount:
  create: true
  name: klaus-agent
  annotations:
    iam.gke.io/gcp-service-account: lore-klaus-agent@PROJECT_ID.iam.gserviceaccount.com

env:
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: klaus-secrets
        key: anthropic-api-key
  - name: CLAUDE_MODEL
    value: claude-haiku-4-5-20251001
