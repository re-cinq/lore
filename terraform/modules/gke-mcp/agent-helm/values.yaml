replicaCount: 1

# Agent is a singleton (job processors don't tolerate two writers
# claiming the same task). Use a PDB to block Autopilot from evicting
# without warning, but keep replicas at 1 — HA at the agent layer
# requires lease coordination that doesn't exist yet.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/re-cinq/lore-agent
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

env:
  LORE_DB_HOST: lore-db-rw.lore-db.svc.cluster.local
  LORE_DB_PORT: "5432"
  LORE_DB_NAME: lore
  LORE_DB_USER: lore
  ANTHROPIC_MODEL: claude-haiku-4-5-20251001
  TASK_TYPES_PATH: /config/task-types.yaml
  PORT: "8080"
  LORE_INGEST_URL: ""
  LORE_LOG_BUCKET: ""
  # Business-hours gate for review-reactor safety cron. Override at
  # deploy time if the team isn't CET / Mon-Fri 9-18.
  LORE_BUSINESS_HOURS_TZ: Europe/Berlin
  LORE_BUSINESS_HOURS_START: "9"
  LORE_BUSINESS_HOURS_END: "18"
  LORE_BUSINESS_DAYS: "1,2,3,4,5"
  # Jobs that get 1-hour prompt-cache TTL (stable system prompt + bursty
  # calls amortize the 1.25x write premium). Use "none" to disable 1h
  # everywhere, "*" to enable for all jobs. See agent/src/lib/prompt-cache.ts.
  LORE_CACHE_1H_JOBS: "auto-curation,review_reactor,fact-extraction,graph-extraction"
  # Dark-factory cluster path gate (ADR-016, PR #310). When "true",
  # dark-mode repos route impl/general/review tasks through the in-pod
  # supervisor (`/app/dist/supervisor/runner-cli.js`); when "false",
  # those tasks continue through the legacy `claude --print` path.
  # Required state before flipping to "true": claude-runner image must
  # ship the agent dist (PR #311). The helm default stays "false" until
  # a pilot repo has soaked at "true" via override — see
  # runbooks/dark-factory-rollback.md → "Cluster path enablement".
  LORE_DARK_FACTORY_CLUSTER_ENABLED: "false"
  # Bot login the auto-merge gate accepts as the "bot APPROVED" review.
  # Must match the GitHub App slug installed on the org (visible in
  # the App's settings page). If misconfigured, no PR will satisfy
  # `require_bot_approval` and every dark-mode PR defers with
  # `deferred:bot_changes_requested`. See agent/src/lib/pr-policy.ts.
  LORE_REVIEW_BOT_LOGIN: "lore-agent[bot]"

dbPasswordSecret:
  name: lore-agent-db-password
  key: password

anthropicKeySecret:
  name: lore-agent-anthropic-key
  key: anthropic-api-key

githubAppSecret:
  name: lore-agent-github-app
  appIdKey: app-id
  privateKeyKey: private-key
  installationIdKey: installation-id

# Shared secret with mcp-server used to authenticate
# POST /api/trigger/review-reactor (webhook → agent fan-out).
internalTokenSecret:
  name: lore-agent-internal-token
  key: token

configMap:
  name: lore-agent-config

# Slack integration (optional — for PR/failure notifications back to Slack)
slackBotTokenSecret:
  name: lore-slack-credentials
  key: bot-token

gcpProject: ""
