{{/*
One CronJob per entry in .Values.cronJobs. Each pod runs
`node dist/job-runner.js <job>` inside the same agent image, with the
shared env from _env.tpl (no drift vs. the Deployment).

Per-entry overrides:
  .resources               — merged over .Values.cronJobDefaults.resources
  .activeDeadlineSeconds   — wall-clock cap (default from cronJobDefaults)
  .concurrencyPolicy       — default Forbid (override only if you mean it)
  .successfulJobsHistoryLimit / .failedJobsHistoryLimit
  .backoffLimit
  .startingDeadlineSeconds

Required per entry: .name (k8s CronJob name), .job (job-runner dispatch
key), .schedule (cron expression).
*/}}
{{- $root := . -}}
{{- $defaults := .Values.cronJobDefaults -}}
{{- range .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $root.Release.Name }}-{{ .name }}
  labels:
    app: lore-agent
    component: cronjob
    job: {{ .job }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: {{ default $defaults.concurrencyPolicy .concurrencyPolicy }}
  startingDeadlineSeconds: {{ default $defaults.startingDeadlineSeconds .startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ default $defaults.successfulJobsHistoryLimit .successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default $defaults.failedJobsHistoryLimit .failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ default $defaults.backoffLimit .backoffLimit }}
      activeDeadlineSeconds: {{ default $defaults.activeDeadlineSeconds .activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app: lore-agent
            component: cronjob
            job: {{ .job }}
        spec:
          serviceAccountName: lore-agent
          restartPolicy: Never
          {{- if $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml $root.Values.imagePullSecrets | nindent 12 }}
          {{- end }}
          containers:
            - name: job
              image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              command: ["node", "dist/job-runner.js", {{ .job | quote }}]
              env:
                {{- include "lore-agent.env" $root | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                {{- $merged := merge (deepCopy (default (dict) .resources)) $defaults.resources -}}
                {{- toYaml $merged | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ $root.Values.configMap.name }}
{{- end }}
