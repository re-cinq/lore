{{/*
  Nil-safe access — see mcp-helm/templates/pdb.yaml for rationale.
  CI's `helm upgrade --reuse-values` skips chart defaults.
*/}}
{{- if and .Values.podDisruptionBudget .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    app: lore-agent
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable | default 1 }}
  selector:
    matchLabels:
      app: lore-agent
{{- end }}
