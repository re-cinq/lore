<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#64748b"/></marker>
    <filter id="shadow2"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity=".08"/></filter>
  </defs>
  <style>
    .box{filter:url(#shadow2);rx:8}
    .label{font-weight:600;fill:#1e293b}
    .sub{fill:#64748b;font-size:12px}
    .conn{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow2)}
    .step{font-size:11.5px;fill:#334155}
    .dim{fill:#64748b;font-size:11.5px}
  </style>

  <!-- Web UI -->
  <rect class="box" x="180" y="20" width="320" height="44" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="340" y="40" text-anchor="middle">Web UI or API</text>
  <text class="sub" x="340" y="55" text-anchor="middle">(your-lore-ui.example.com)</text>

  <line class="conn" x1="340" y1="64" x2="340" y2="96"/>

  <!-- Task description -->
  <rect class="box" x="150" y="96" width="380" height="36" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="step" x="340" y="119" text-anchor="middle">Create task: "write a runbook for incident response"</text>

  <line class="conn" x1="340" y1="132" x2="340" y2="166"/>

  <!-- The Floor -->
  <rect class="box" x="80" y="166" width="520" height="190" fill="#fff" stroke="#94a3b8"/>
  <text class="label" x="340" y="192" text-anchor="middle">The Floor (coordinator)</text>
  <text class="dim" x="340" y="208" text-anchor="middle">claims the task from pipeline.tasks</text>

  <!-- Single-CR path -->
  <rect class="box" x="110" y="222" width="230" height="110" fill="#fefce8" stroke="#fde047"/>
  <text class="label" x="225" y="246" text-anchor="middle" fill="#854d0e" font-size="12">Single Agent CR</text>
  <text class="dim" x="225" y="264" text-anchor="middle">(onboard, runbook, review)</text>
  <text class="step" x="132" y="290">One Agent runs the whole task</text>
  <text class="step" x="132" y="308">Context pre-loaded from the API</text>

  <!-- Assembly-line path -->
  <rect class="box" x="370" y="222" width="210" height="110" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text class="label" x="475" y="246" text-anchor="middle" fill="#9d174d" font-size="12">Assembly line</text>
  <text class="dim" x="475" y="264" text-anchor="middle">(implementation, general)</text>
  <text class="step" x="390" y="290">One Agent CR per node</text>
  <text class="step" x="390" y="308">Event-driven walk advances it</text>

  <!-- Converge into execution -->
  <line class="conn" x1="225" y1="332" x2="225" y2="344" marker-end=""/>
  <line class="conn" x1="475" y1="332" x2="475" y2="344" marker-end=""/>
  <line stroke="#64748b" stroke-width="1.5" x1="225" y1="344" x2="475" y2="344"/>
  <line class="conn" x1="340" y1="356" x2="340" y2="382"/>

  <!-- Execution clusters -->
  <rect class="box" x="80" y="382" width="520" height="120" fill="#fff" stroke="#94a3b8"/>
  <text class="label" x="340" y="406" text-anchor="middle">Execution — ai-agent-subsystem</text>
  <text class="dim" x="340" y="422" text-anchor="middle">station runs queue; a cluster-agent claims them by capability tags</text>
  <rect class="box" x="110" y="434" width="230" height="52" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text class="step" x="225" y="456" text-anchor="middle" font-weight="600">Central cluster (GKE)</text>
  <text class="dim" x="225" y="472" text-anchor="middle">cluster-agent launches Agent pods</text>
  <rect class="box" x="370" y="434" width="210" height="52" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text class="step" x="475" y="456" text-anchor="middle" font-weight="600">Registered satellites</text>
  <text class="dim" x="475" y="472" text-anchor="middle">minikube, customer or GPU cluster</text>

  <line class="conn" x1="340" y1="502" x2="340" y2="524"/>

  <!-- Watcher -->
  <rect class="box" x="140" y="524" width="400" height="36" fill="#f0fdf4" stroke="#86efac"/>
  <text class="step" x="340" y="547" text-anchor="middle" font-weight="600" fill="#166534">Terminal phase reported via event-router — the watcher creates the PR</text>

  <line class="conn" x1="340" y1="560" x2="340" y2="576" marker-end=""/>

  <!-- PR result -->
  <rect class="box" x="200" y="576" width="280" height="36" fill="#ecfdf5" stroke="#34d399"/>
  <text class="label" x="340" y="599" text-anchor="middle" fill="#065f46">PR appears on target repo</text>
</svg>
