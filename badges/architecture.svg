<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 956" font-family="system-ui,-apple-system,sans-serif" font-size="12">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#94a3b8"/></marker>
    <filter id="shadow5"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity=".08"/></filter>
  </defs>
  <style>
    .zone{filter:url(#shadow5);rx:10}
    .svc{rx:6;filter:url(#shadow5)}
    .title{font-weight:700;fill:#1e293b;font-size:14px}
    .heading{font-weight:600;fill:#1e293b;font-size:13px}
    .item{fill:#475569;font-size:11px}
    .dim{fill:#94a3b8;font-size:10px}
    .conn{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arrow5)}
    .connDash{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:4,3;marker-end:url(#arrow5)}
  </style>

  <!-- ======================= Developer Machine ======================= -->
  <rect class="zone" x="20" y="16" width="720" height="140" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="title" x="40" y="40">Developer Machine</text>

  <rect class="svc" x="40" y="60" width="130" height="48" fill="#eef2ff" stroke="#818cf8"/>
  <text class="heading" x="105" y="88" text-anchor="middle" fill="#4338ca">Claude Code</text>

  <line class="conn" x1="170" y1="84" x2="215" y2="84"/>
  <text class="dim" x="192" y="78" text-anchor="middle">MCP</text>

  <rect class="svc" x="215" y="52" width="230" height="72" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="235" y="74">Lore MCP server (stdio)</text>
  <text class="item" x="235" y="92">context · memory · tasks</text>
  <text class="item" x="235" y="106">no DB — proxies everything</text>

  <line class="connDash" x1="445" y1="84" x2="490" y2="84"/>

  <rect class="svc" x="490" y="52" width="230" height="72" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="510" y="74">Local task runner</text>
  <text class="item" x="510" y="92">git worktrees · background</text>
  <text class="item" x="510" y="106">Claude Code · subscription-billed</text>

  <!-- MCP local -> Lore API -->
  <path class="conn" d="M330,124 V144 H256 V348 H220"/>
  <text class="dim" x="266" y="186">proxy all ops (LORE_API_URL)</text>

  <!-- ======================= GKE Cluster ======================= -->
  <rect class="zone" x="20" y="200" width="720" height="586" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text class="title" x="40" y="224">GKE Cluster</text>

  <!-- Left column: data plane -->
  <rect class="svc" x="40" y="244" width="180" height="52" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="130" y="266" text-anchor="middle">Web UI</text>
  <text class="item" x="130" y="284" text-anchor="middle">Next.js · no DB pool</text>

  <line class="conn" x1="130" y1="296" x2="130" y2="330"/>
  <text class="dim" x="138" y="316">typed clients</text>

  <rect class="svc" x="40" y="330" width="180" height="64" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="130" y="352" text-anchor="middle">Lore API</text>
  <text class="item" x="130" y="370" text-anchor="middle">REST /api/*</text>
  <text class="item" x="130" y="384" text-anchor="middle">search · memory · ingest</text>

  <line class="conn" x1="130" y1="394" x2="130" y2="450"/>
  <text class="dim" x="138" y="425">read / write</text>

  <rect class="svc" x="40" y="450" width="180" height="92" fill="#f0fdf4" stroke="#86efac"/>
  <text class="heading" x="130" y="474" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="item" x="130" y="494" text-anchor="middle">chunks · memory · pipeline</text>
  <text class="item" x="130" y="508" text-anchor="middle">schema-per-team</text>
  <text class="dim" x="130" y="524" text-anchor="middle">HNSW + GIN · CloudNativePG</text>

  <!-- Center column: control plane -->
  <rect class="svc" x="280" y="244" width="180" height="52" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="370" y="266" text-anchor="middle">stations</text>
  <text class="item" x="370" y="284" text-anchor="middle">merge-check · approval-check</text>

  <line class="conn" x1="370" y1="340" x2="370" y2="296"/>
  <text class="dim" x="378" y="322">run</text>

  <rect class="svc" x="280" y="340" width="180" height="78" fill="#fff7ed" stroke="#fdba74"/>
  <text class="heading" x="370" y="362" text-anchor="middle">Floor</text>
  <text class="item" x="370" y="380" text-anchor="middle">drain loop · assembly-run walk</text>
  <text class="item" x="370" y="394" text-anchor="middle">dispatch · cron ticks · SSE</text>
  <text class="item" x="370" y="408" text-anchor="middle">opens PRs (GitHub App)</text>

  <line class="conn" x1="370" y1="418" x2="370" y2="460"/>
  <text class="dim" x="378" y="443">claim / ack</text>

  <rect class="svc" x="280" y="460" width="180" height="92" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="370" y="482" text-anchor="middle">event-router</text>
  <text class="item" x="370" y="502" text-anchor="middle">sole writer of pipeline.events</text>
  <text class="item" x="370" y="516" text-anchor="middle">front door: POST /api/events</text>
  <text class="dim" x="370" y="532" text-anchor="middle">k8s watch → kubernetes.agent*</text>

  <!-- Lore API -> event-router -->
  <path class="conn" d="M220,372 H250 V492 H280"/>
  <text class="dim" transform="rotate(-90 244 434)" x="244" y="434" text-anchor="middle">internal.ingest.*</text>

  <!-- event-router -> DB -->
  <line class="conn" x1="280" y1="530" x2="220" y2="530"/>
  <text class="dim" x="250" y="524" text-anchor="middle">writes</text>

  <!-- Right column: execution plane -->
  <rect class="svc" x="510" y="244" width="210" height="56" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="615" y="268" text-anchor="middle">lore-mcp gateway</text>
  <text class="item" x="615" y="288" text-anchor="middle">live scoped Lore for agent pods</text>

  <rect class="svc" x="510" y="336" width="210" height="56" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="615" y="358" text-anchor="middle">cluster-agent</text>
  <text class="item" x="615" y="378" text-anchor="middle">the only Kubernetes client</text>

  <line class="conn" x1="615" y1="392" x2="615" y2="428"/>
  <text class="dim" x="607" y="412" text-anchor="end">CRs · pod logs</text>

  <rect class="svc" x="510" y="428" width="210" height="56" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="615" y="450" text-anchor="middle">agent-controller</text>
  <text class="item" x="615" y="470" text-anchor="middle">ai-agent-subsystem · ai-agents ns</text>

  <line class="conn" x1="615" y1="484" x2="615" y2="520"/>
  <text class="dim" x="607" y="504" text-anchor="end">spawn</text>

  <rect class="svc" x="510" y="520" width="210" height="78" fill="#eef2ff" stroke="#818cf8"/>
  <text class="heading" x="615" y="542" text-anchor="middle" fill="#4338ca">Agent CR pods</text>
  <text class="item" x="615" y="560" text-anchor="middle">one pod per assembly-line node</text>
  <text class="item" x="615" y="574" text-anchor="middle">clone → Claude Code → push</text>
  <text class="dim" x="615" y="588" text-anchor="middle">non-agent nodes: lore-station</text>

  <!-- Floor -> cluster-agent -->
  <line class="conn" x1="460" y1="364" x2="510" y2="364"/>
  <text class="dim" x="485" y="356" text-anchor="middle">dispatch</text>

  <!-- Agent pods -> Floor (telemetry) -->
  <path class="conn" d="M510,566 H478 V406 H460"/>
  <text class="dim" transform="rotate(-90 472 486)" x="472" y="486" text-anchor="middle">NDJSON telemetry</text>

  <!-- Agent pods -> lore-mcp gateway -->
  <path class="conn" d="M720,556 H732 V272 H720"/>

  <!-- ======================= GitHub &amp; Slack ======================= -->
  <rect class="zone" x="20" y="816" width="720" height="120" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="title" x="40" y="840">GitHub &amp; Slack</text>

  <rect class="svc" x="40" y="860" width="200" height="56" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="140" y="882" text-anchor="middle">GitHub Actions</text>
  <text class="item" x="140" y="902" text-anchor="middle">lore-ingest.yml · lore-tests.yml</text>

  <rect class="svc" x="270" y="860" width="200" height="56" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="370" y="882" text-anchor="middle">GitHub</text>
  <text class="item" x="370" y="902" text-anchor="middle">Repos · PRs · Issues</text>

  <rect class="svc" x="540" y="860" width="180" height="64" fill="#fff" stroke="#94a3b8"/>
  <text class="heading" x="630" y="882" text-anchor="middle">Slack</text>
  <text class="item" x="630" y="900" text-anchor="middle">/lore slash command</text>
  <text class="dim" x="630" y="914" text-anchor="middle">→ creates tasks via Lore API</text>

  <!-- Actions -> Lore API (ingest) -->
  <path class="conn" d="M60,860 V800 H30 V360 H40"/>
  <text class="dim" x="70" y="806">POST /api/ingest (changed files)</text>

  <!-- GitHub -> event-router (webhooks) -->
  <line class="conn" x1="370" y1="860" x2="370" y2="552"/>
  <text class="dim" transform="rotate(-90 362 706)" x="362" y="706" text-anchor="middle">webhooks: PR · review · comment</text>

  <!-- Agent pods -> GitHub (push) -->
  <path class="conn" d="M510,586 H490 V890 H470"/>
  <text class="dim" transform="rotate(-90 484 730)" x="484" y="730" text-anchor="middle">commit + push</text>
</svg>
