# Lore test-command interface for spec traceability.
# Discovery + per-test coverage come from this repo's vitest runner,
# spanning every package (shared, agent, mcp-server, web-ui).
# Descriptors are per-`it` (the describe chain feeds spec-sentence acceptance links).
# `run` executes one whole FILE under buildTestReport's concurrency cap.
# coverage_format MUST be json: the local run path JSON.parses stdout.
list: npm run trace:list-tests
run: npm run trace:run-test -- {selector}
coverage_format: json
cwd: "."
path_prefix_strip: ""