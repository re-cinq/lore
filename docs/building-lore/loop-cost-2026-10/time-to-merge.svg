<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 230" width="970" height="230" role="img" aria-label="Where the time from pull request to merge goes">
<style>
.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.muted{fill:#52514e}.grid{stroke:#e4e3df}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#eda100}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}
.title{font-size:16px;font-weight:600}.sub{font-size:12.5px}
@media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.ink{fill:#f0efec}.muted{fill:#c3c2b7}.grid{stroke:#3a3a37}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}}
</style>
<rect class="surface" width="970" height="230" rx="8"/>
<text class="ink title" x="16" y="28">Where the time from pull request to merge goes</text>
