name: implementation
description: Context optimized for implementation tasks.
sections:
  - header: "Directory Rules"
    source: rules
    priority: 1
    max_tokens: 2000

  - header: "Conventions"
    source: repo
    priority: 1
    max_tokens: 4000

  - header: "Relevant Code"
    source: code
    priority: 1
    max_tokens: 4000

  - header: "Architecture Decisions"
    source: adrs
    priority: 1
    max_tokens: 3000

  # Spec statements + tests coupled to this repo's code, ranked by collision
  # signal (violated > drifted > untested). Deterministic; empty when the
  # spec-traceability graph (LORE_DGRAPH_HTTP) is not wired.
  - header: "Coupled Spec & Tests"
    source: coupling
    priority: 2
    max_tokens: 2500

  - header: "Agent Memory"
    source: memories
    priority: 2
    max_tokens: 3000

  # Graph is entity/concept-level (not file-level), so it's demoted for code
  # tasks — the budget goes to code/conventions/ADRs first.
  - header: "Related Entities"
    source: graph
    priority: 3
    max_tokens: 1200

  - header: "Recent Episodes"
    source: episodes
    priority: 3
    max_tokens: 2000
