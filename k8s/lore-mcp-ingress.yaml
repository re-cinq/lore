apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lore-mcp-api
  namespace: mcp-servers
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: lore-api.gcp.re-cinq.com
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Only expose /api and /healthz — block /mcp from external access
      if ($uri !~ ^/(api/|healthz)) {
        return 404;
      }
spec:
  ingressClassName: nginx-ingress
  tls:
    - hosts:
        - lore-api.gcp.re-cinq.com
      secretName: lore-mcp-api-tls
  rules:
    - host: lore-api.gcp.re-cinq.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lore-mcp
                port:
                  number: 3000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: lore-mcp
                port:
                  number: 3000
