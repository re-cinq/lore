apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stations.lore.re-cinq.com
spec:
  group: lore.re-cinq.com
  names:
    kind: Station
    listKind: StationList
    plural: stations
    singular: station
    shortNames:
      - stn
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - agentDefRef
                - template
              description: The running context — a Pod template + which recipe + run policy (ADR-031).
              properties:
                agentDefRef:
                  type: string
                  description: Name of the AgentDefinition (recipe) this Station runs.
                deadlineMinutes:
                  type: integer
                  default: 30
                  description: Wall-clock limit for a run; becomes the Job's activeDeadlineSeconds.
                successfulRunsHistoryLimit:
                  type: integer
                  default: 3
                  description: How many Succeeded Agents to keep before the controller prunes the oldest.
                failedRunsHistoryLimit:
                  type: integer
                  default: 3
                  description: How many Failed Agents to keep before the controller prunes the oldest.
                template:
                  type: object
                  description: >-
                    A standard Kubernetes PodTemplateSpec. The controller stamps the run's pod from
                    this; one container named "agent" is wired with the recipe + rendered prompt.
                    Validated by Kubernetes when the Job is created.
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: AgentDef
          type: string
          jsonPath: .spec.agentDefRef
        - name: Deadline
          type: integer
          jsonPath: .spec.deadlineMinutes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
