apiVersion: batch/v1
kind: CronJob
metadata:
  name: lore-memory-ttl-cleanup
  namespace: klaus
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: postgres:16
            command: ["psql"]
            args:
            - "-h"
            - "lore-db-rw.alloydb.svc.cluster.local"
            - "-U"
            - "lore"
            - "-d"
            - "lore"
            - "-c"
            - "DELETE FROM memory.facts WHERE memory_id IN (SELECT id FROM memory.memories WHERE expires_at IS NOT NULL AND expires_at < now() - interval '24 hours'); DELETE FROM memory.memory_versions WHERE memory_id IN (SELECT id FROM memory.memories WHERE expires_at IS NOT NULL AND expires_at < now() - interval '24 hours'); DELETE FROM memory.memories WHERE expires_at IS NOT NULL AND expires_at < now() - interval '24 hours';"
            env:
            - name: PGPASSWORD
              value: "loredb2026"
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
