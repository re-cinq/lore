apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
  namespace: lore-agents
  labels:
    app: agent-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-controller
  template:
    metadata:
      labels:
        app: agent-controller
    spec:
      serviceAccountName: agent-controller
      containers:
        - name: controller
          image: ghcr.io/re-cinq/lore-agent-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main.js"]
          env:
            - name: NAMESPACE
              value: lore-agents
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
